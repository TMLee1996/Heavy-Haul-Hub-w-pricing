function pageFunnel(){
  const list=oppFiltered();
  const byStage={prequalified:[],qualifying:[],quoting:[],customer:[]};
  list.forEach(o=>{ byStage[oppStage(o)].push(o); });
  const total=list.length;
  const avg=(function(){ let s=0,n=0; list.forEach(o=>{ if(+o.likelihood){s+=+o.likelihood;n++;} }); return n?(s/n).toFixed(1):'—'; })();
  const kpis=`<div class="kpi-grid">
    ${kpi('Total Opportunities',total,'b-navy')}
    ${kpi('Avg Likelihood',avg,'b-blue')}
    ${FUNNEL.map(f=>`<div class="kpi" style="border-left:5px solid ${f.color}"><div class="bar" style="background:${f.color}"></div><div class="lbl" style="font-size:11px">${f.label}</div><div class="val">${byStage[f.key].length}</div></div>`).join('')}
  </div>`;

  const offSel=`<select style="max-width:220px" onchange="OPP_OFF=this.value;OPP_BRK='all';route()">
      <option value="all" ${OPP_OFF==='all'?'selected':''}>🏢 All Offices</option>
      ${oppOfficeList().map(o=>`<option ${OPP_OFF===o?'selected':''}>${esc(o)}</option>`).join('')}
    </select>`;
  const brks=(OPP_OFF==='all')?oppBrokerList():[...new Set(oppList().filter(o=>(o.office||'')===OPP_OFF).map(o=>(o.broker||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  if(OPP_BRK!=='all' && !brks.includes(OPP_BRK)) OPP_BRK='all';
  const brkSel=`<select style="max-width:220px" onchange="OPP_BRK=this.value;route()">
      <option value="all" ${OPP_BRK==='all'?'selected':''}>🤝 All Brokers</option>
      ${brks.map(b=>`<option ${OPP_BRK===b?'selected':''}>${esc(b)}</option>`).join('')}
    </select>`;
  const viewToggle=`<div class="filterbar" style="margin:0">
      <button class="chip ${OPP_VIEW==='funnel'?'active':''}" onclick="OPP_VIEW='funnel';route()">▦ Funnel Board</button>
      <button class="chip ${OPP_VIEW==='list'?'active':''}" onclick="OPP_VIEW='list';route()">☰ List</button>
    </div>`;

  const board = OPP_VIEW==='list' ? funnelListView(list) : funnelBoardView(byStage);

  return `
  <div class="page-title">🧲 Prospect Funnel</div>
  <div class="page-sub">Heavy-haul opportunity funnel merged from the Opp Tracker. Prospects move Pre-Qualified → Qualifying → Qualified/Quoting → Customer. A prospect auto-advances to <strong>Qualified/Quoting</strong> the moment a rep logs a quote for it, and to <strong>Customer</strong> once a shipment is won.</div>
  <div class="card" style="padding:14px 18px;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap">
    <div><label style="margin-bottom:6px">Office</label>${offSel}</div>
    <div><label style="margin-bottom:6px">Broker</label>${brkSel}</div>
    <div style="flex:1;min-width:200px"><label style="margin-bottom:6px">Search</label><input placeholder="Company, broker, industry, notes…" value="${esc(OPP_SEARCH)}" oninput="OPP_SEARCH=this.value;funnelSearchDebounce()"></div>
    <div><label style="margin-bottom:6px">View</label>${viewToggle}</div>
  </div>
  ${kpis}
  <div class="card" style="padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
    <div style="font-size:12px;color:var(--muted)">${total} opportunit${total===1?'y':'ies'} shown</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost" style="width:auto" onclick="oppAddOffice()">＋ Office</button>
      <button class="btn btn-ghost" style="width:auto" onclick="oppFunnelSummary()">📋 Manager Summary</button>
      <button class="btn btn-ghost" style="width:auto" onclick="openOppParser()">⚡ Paste &amp; Parse</button>
      <button class="btn btn-primary" style="width:auto" onclick="openOppForm()">＋ Add Opportunity</button>
    </div>
  </div>
  ${board}`;
}
let _funnelSearchT=null;
function funnelSearchDebounce(){ clearTimeout(_funnelSearchT); _funnelSearchT=setTimeout(()=>route(),250); }

function funnelBoardView(byStage){
  const cols=FUNNEL.map(f=>{
    const arr=byStage[f.key].slice().sort((a,b)=>(+b.likelihood||0)-(+a.likelihood||0)||String(a.company).localeCompare(b.company));
    const cards=arr.map(o=>funnelCard(o,f)).join('') || `<div class="empty" style="padding:22px 10px;font-size:12px">No opportunities in this stage.</div>`;
    return `<div style="flex:1;min-width:270px;display:flex;flex-direction:column">
      <div style="position:sticky;top:0;background:${f.color};color:#fff;border-radius:10px 10px 0 0;padding:10px 12px;z-index:1">
        <div style="font-weight:800;font-size:13px">${f.label} <span style="opacity:.85;font-weight:600">· ${arr.length}</span></div>
        <div style="font-size:10.5px;opacity:.9;text-transform:uppercase;letter-spacing:.03em">${f.sub}</div>
      </div>
      <div style="background:var(--bg);border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;padding:10px;flex:1;min-height:120px">${cards}</div>
    </div>`;
  }).join('');
  return `<div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;align-items:stretch">${cols}</div>`;
}
function funnelCard(o,f){
  const stage=f.key;
  const tn=oppTierNum(o.tier);
  const likeColor=o.likelihood>=9?'var(--green)':o.likelihood>=8?'var(--accent)':'var(--muted)';
  const wonPill = stage==='customer'? `<span class="pill won">✅ Customer</span>` : '';
  const qCount = oppQuotesFor(o.company).length;
  const quoteBadge = qCount? `<span class="pill vol" title="${qCount} quote(s) in the log">📄 ${qCount}</span>` : '';
  let advanceBtn='';
  if(stage==='prequalified') advanceBtn=`<button class="rowbtn" onclick="event.stopPropagation();oppAdvance('${o.id}')" title="Advance to Qualifying">→ Broker Outreach</button>`;
  else if(stage==='qualifying') advanceBtn=`<button class="rowbtn" onclick="event.stopPropagation();oppAdvance('${o.id}')" title="Advance to Qualified/Quoting">→ NSE / Ready to Quote</button>`;
  else if(stage==='quoting') advanceBtn=`<button class="rowbtn" style="background:#e3f6e9;color:var(--green)" onclick="event.stopPropagation();oppMarkWon('${o.id}')" title="Mark shipment won → Customer">🎉 Won → Customer</button>`;
  else advanceBtn=`<button class="rowbtn" onclick="event.stopPropagation();oppReopen('${o.id}')" title="Reopen as prospect">↩ Reopen</button>`;
  return `<div class="card" style="margin:0 0 10px;padding:11px 12px;cursor:pointer;border-left:4px solid ${f.color}" onclick="openOppDetail('${o.id}')">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
      <strong style="font-size:13.5px;line-height:1.3">${esc(o.company)}</strong>
      <span class="like" style="font-weight:800;color:${likeColor};white-space:nowrap">${esc(o.likelihood||'—')}</span>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:3px">${esc(o.broker||'—')}${o.office?(' · '+esc(o.office)):''}</div>
    <div style="margin-top:7px;display:flex;gap:5px;flex-wrap:wrap;align-items:center">
      <span class="tag t${tn>4?4:tn}">${esc(o.tier||'')}</span>${wonPill}${quoteBadge}
    </div>
    ${o.industry?`<div style="font-size:11px;color:var(--muted);margin-top:6px">${esc(o.industry)}</div>`:''}
    <div style="margin-top:9px;display:flex;gap:5px;flex-wrap:wrap">
      ${advanceBtn}
      <button class="rowbtn" onclick="event.stopPropagation();openOppForm('${o.id}')">Edit</button>
    </div>
  </div>`;
}
function funnelListView(list){
  const rows=list.slice().sort((a,b)=>(+b.likelihood||0)-(+a.likelihood||0)).map(o=>{
    const st=oppStage(o); const f=FUNNEL_MAP[st];
    return `<tr>
      <td><span class="office-pill" style="background:${f.color};color:#fff;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700">${f.label}</span></td>

      <td>${esc(o.broker||'—')}</td>
      <td><strong class="colink" onclick="openOppDetail('${o.id}')" style="cursor:pointer">${esc(o.company)}</strong><div style="font-size:11px;color:var(--muted)">${esc(o.industry||'')}</div></td>
      <td style="color:${o.likelihood>=9?'var(--green)':o.likelihood>=8?'var(--accent)':'var(--muted)'};font-weight:800;text-align:center">${esc(o.likelihood||'—')}</td>

      <tbody>${rows||'<tr><td colspan="7" class="empty">No opportunities match. Add one or adjust filters.</td></tr>'}</tbody>
    </table></div></div>`;
}

/* ---- stage actions ---- */
function oppAdvance(id){
  const arr=oppList(); const o=arr.find(x=>x.id===id); if(!o) return;
  const st=oppStage(o);
  if(st==='prequalified'){ o.brokerContacted=true; }
  else if(st==='qualifying'){ o.nseConversation=true; o.brokerContacted=true; }
  o.status=oppDeriveStatus(o); oppSave(arr); route(); toast('Advanced to '+FUNNEL_MAP[oppStage(o)].label);
}
function oppMarkWon(id){

/* ===================================================================
   PASTE & PARSE  (ported from Opp Tracker)
   =================================================================== */
function oppClean(t){
  return t.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|li|h\d|tr)>/gi,'\n')
    .replace(/<a\b[^>]*>[\s\S]*?<\/a>/gi,'').replace(/<[^>]+>/g,'')
    .replace(/\[[a-z0-9][a-z0-9.\-]*\.[a-z]{2,}\]/gi,'')
    .replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/\u00a0/g,' ');
}
const OPP_PLABELS=[
  ['fact',/\brelevant\s+fact\s*[:?]/i],
  ['presence',/\bheavy\s+haul[^\n:?]*presence\s*[:?]?/i],
  ['question',/\bsupply\s+chain\s+question\s*[:?]|\bdiscovery\s+question\s*[:?]/i],
  ['likelihood',/\blikelihood(?:\s+of[^\n:?]*)?\s*[:?]/i],
  ['equipment',/\bequipment(?:\s*\/\s*service\s+fit)?\s*[:?]/i],
  ['industry',/\bindustry\s*[:?]/i],
  ['tier',/\bpriority\s+tier\s*[:?]|\btier\s*[:?]/i],
  ['why',/\bwhy\s*[:?]/i],
  ['notes',/\bnotes?\s*[:?]|\blocation\s*[:?]/i]
];
function oppParseFields(block){
  const found=[]; OPP_PLABELS.forEach(([f,re])=>{ const m=re.exec(block); if(m) found.push({f,start:m.index,end:m.index+m[0].length}); });
  found.sort((a,b)=>a.start-b.start); const seen={},kept=[];
  found.forEach(it=>{ if(!seen[it.f]){ seen[it.f]=1; kept.push(it); } }); kept.sort((a,b)=>a.start-b.start);
  const rec={};
  kept.forEach((it,i)=>{ const next=i+1<kept.length?kept[i+1].start:block.length;
    let v=block.slice(it.end,next).replace(/\s+/g,' ').trim().replace(/[|;]+$/,'').trim(); if(v) rec[it.f]=v; });
  return {rec,firstLabelStart:kept.length?kept[0].start:-1};
}
function oppNormalize(rec){
  if(rec.likelihood){ const m=String(rec.likelihood).match(/\d+(?:\.\d+)?/); rec.likelihood=m?m[0]:''; }
  if(!rec.tier&&rec.likelihood) rec.tier=oppTierFromLike(rec.likelihood);
  if(rec.tier&&!/Tier/i.test(rec.tier)){ const t=rec.tier.toLowerCase(); rec.tier=t.includes('hot')||t.includes('1')?'Tier 1 - Hot':t.includes('high')||t.includes('2')?'Tier 2 - High':t.includes('med')||t.includes('3')?'Tier 3 - Medium':'Tier 4 - Low'; }
  if(OPP_REF[rec.industry]){ if(!rec.equipment) rec.equipment=OPP_REF[rec.industry].equipment; if(!rec.question) rec.question=OPP_REF[rec.industry].question; }
  return rec;
}
function oppParseBatch(raw){
  const text=oppClean(raw); const markers=[]; const re=/(?:^|\n)[\s>]*(\d{1,3})[\.\)]\s+/g; let m;
  while((m=re.exec(text))){ markers.push({start:m.index,contentStart:re.lastIndex}); }
  let chunks=[];
  if(markers.length>=1){ for(let i=0;i<markers.length;i++){ const end=i+1<markers.length?markers[i+1].start:text.length; chunks.push(text.slice(markers[i].contentStart,end).trim()); } }
  else chunks=[text.trim()];
  const out=[];
  chunks.forEach(chunk=>{ if(!chunk) return; const {rec:fields,firstLabelStart}=oppParseFields(chunk);
    let company=firstLabelStart>=0?chunk.slice(0,firstLabelStart):(chunk.split('\n')[0]||'');
    company=company.replace(/\s+/g,' ').trim().replace(/[\s\-–—:]+$/,'').trim();
    if(!company && !Object.keys(fields).length) return;
    const rec={company}; Object.assign(rec,fields); oppNormalize(rec); if(rec.company) out.push(rec); });
  return out;
}

}

/* ===================================================================
   REDESIGNED: CUSTOMER OPPORTUNITIES  (clean org of quote-log customers)
   =================================================================== */
let COPP_OFF='all', COPP_SEARCH='', COPP_SORT='quotes', COPP_GROUP='none';
function coppCustomerOffice(name){
  /* most common office across this customer's quotes */
  const qs=DB.quotes().filter(q=>((q.customerName||'(Unknown)').trim())===name && q.office);
  if(!qs.length){ const c=(DB.customers()||{})[name]; return (c&&c.office)||''; }
  const cnt={}; qs.forEach(q=>cnt[q.office]=(cnt[q.office]||0)+1);
  return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||'';
}
function coppLastActivity(name){
  const qs=DB.quotes().filter(q=>((q.customerName||'(Unknown)').trim())===name);
  let d=''; qs.forEach(q=>{ if(q.dateReceived>d) d=q.dateReceived; }); return d;
}
function pageCustomerOpps(){
  let data=buildCustomerData(null,'overall');
  data.forEach(c=>{ c._office=coppCustomerOffice(c.name); c._last=coppLastActivity(c.name); c._fromFunnel=!!(((DB.customers()||{})[c.name]||{}).fromFunnel); });
  const offs=[...new Set(data.map(c=>c._office).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  if(COPP_OFF!=='all' && !offs.includes(COPP_OFF)) COPP_OFF='all';
  let list=data.slice();
  if(COPP_OFF!=='all') list=list.filter(c=>c._office===COPP_OFF);
  const q=COPP_SEARCH.toLowerCase().trim();
  if(q) list=list.filter(c=>[c.name,c.topType,c._office,c.desc].join(' ').toLowerCase().includes(q));
  /* sort */
  if(COPP_SORT==='quotes') list.sort((a,b)=>b.total-a.total);
  else if(COPP_SORT==='win') list.sort((a,b)=>b.winPct-a.winPct);
  else if(COPP_SORT==='ship') list.sort((a,b)=>b.shipments-a.shipments);
  else if(COPP_SORT==='vol') list.sort((a,b)=>b.weightLbs-a.weightLbs);
  else if(COPP_SORT==='recent') list.sort((a,b)=>(b._last||'').localeCompare(a._last||''));
  else if(COPP_SORT==='name') list.sort((a,b)=>a.name.localeCompare(b.name));

  const totalQuotes=data.reduce((s,c)=>s+c.total,0);
  const totalShip=data.reduce((s,c)=>s+c.shipments,0);
  const converted=data.filter(c=>c._fromFunnel).length;
  const wins=data.reduce((s,c)=>s+c.won,0);
  const kpis=`<div class="kpi-grid">
    ${kpi('Customers',data.length,'b-blue')}
    ${kpi('Total Quotes',totalQuotes,'b-navy')}
    ${kpi('Total Shipments',totalShip,'b-orange')}
    ${kpi('Quotes Won',wins,'b-green')}
    ${kpi('From Prospect Funnel',converted,'b-amber','converted prospects')}
  </div>`;

  const offSel=`<select style="max-width:220px" onchange="COPP_OFF=this.value;route()">
      <option value="all" ${COPP_OFF==='all'?'selected':''}>🏢 All Offices</option>
      ${offs.map(o=>`<option ${COPP_OFF===o?'selected':''}>${esc(o)}</option>`).join('')}
    </select>`;
  const sortSel=`<select style="max-width:200px" onchange="COPP_SORT=this.value;route()">
      <option value="quotes" ${COPP_SORT==='quotes'?'selected':''}>Sort: Most Quotes</option>
      <option value="ship" ${COPP_SORT==='ship'?'selected':''}>Sort: Shipments</option>
      <option value="win" ${COPP_SORT==='win'?'selected':''}>Sort: Win %</option>
      <option value="vol" ${COPP_SORT==='vol'?'selected':''}>Sort: Volume (lbs)</option>
      <option value="recent" ${COPP_SORT==='recent'?'selected':''}>Sort: Most Recent</option>
      <option value="name" ${COPP_SORT==='name'?'selected':''}>Sort: Name A→Z</option>
    </select>`;
  const grpSel=`<select style="max-width:200px" onchange="COPP_GROUP=this.value;route()">
      <option value="none" ${COPP_GROUP==='none'?'selected':''}>Group: None</option>
      <option value="office" ${COPP_GROUP==='office'?'selected':''}>Group: Office</option>
      <option value="type" ${COPP_GROUP==='type'?'selected':''}>Group: Top Quote Type</option>
    </select>`;

  let body;
  if(!list.length){ body=`<div class="card"><div class="empty">No customers yet. Customers appear here automatically as reps log quotes — or when a prospect is won in the funnel.</div></div>`; }
  else if(COPP_GROUP==='none'){ body=coppTable(list,''); }
  else {
    const keyFn = COPP_GROUP==='office' ? (c=>c._office||'(No office)') : (c=>c.topType||'—');
    const groups={}; list.forEach(c=>{ const k=keyFn(c); (groups[k]=groups[k]||[]).push(c); });
    body=Object.keys(groups).sort((a,b)=>a.localeCompare(b)).map(k=>coppTable(groups[k],k+' ('+groups[k].length+')')).join('');
  }

  return `
  <div class="page-title">🏢 Customer Opportunities</div>
  <div class="page-sub">A clean, organized roll-up of every customer coming from the rep quote log — searchable, sortable, and groupable by office or quote type. Prospects won in the funnel land here automatically with a badge.</div>
  ${kpis}
  <div class="card" style="padding:14px 18px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap">
    <div><label style="margin-bottom:6px">Office</label>${offSel}</div>
    <div style="flex:1;min-width:180px"><label style="margin-bottom:6px">Search</label><input placeholder="Customer, type, office…" value="${esc(COPP_SEARCH)}" oninput="COPP_SEARCH=this.value;coppSearchDebounce()"></div>
    <div><label style="margin-bottom:6px">Sort</label>${sortSel}</div>
    <div><label style="margin-bottom:6px">Group</label>${grpSel}</div>
  </div>
  ${body}`;
}
let _coppT=null;
function coppSearchDebounce(){ clearTimeout(_coppT); _coppT=setTimeout(()=>route(),250); }
function coppTable(list,title){
  const rows=list.map(c=>{ const nm=jsq(c.name);
    return `<tr style="${c.fav?'background:#fff8ec':''}">
      <td><button class="rowbtn" style="background:none;font-size:17px;padding:2px 4px;${c.fav?'color:var(--accent)':'color:#c9d2dc'}" onclick="toggleCustFav('${nm}')" title="${c.fav?'Unflag':'Star'}">${c.fav?'★':'☆'}</button></td>
      <td><strong>${esc(c.name)}</strong>${c._fromFunnel?' <span class="pill won" title="Converted from Prospect Funnel">🎉 From Funnel</span>':''}<div style="font-size:11px;color:var(--muted)">Top type: ${esc(c.topType)} · ${c.laneCount} lane(s)</div></td>
      <td>${c._office?`<span class="pill type">${esc(c._office)}</span>`:'—'}</td>
      <td style="text-align:center"><strong>${c.total}</strong></td>
      <td style="text-align:center">${c.shipments}</td>
      <td style="text-align:center;color:var(--green);font-weight:700">${c.won}</td>
      <td style="text-align:center"><strong>${c.winPct}%</strong></td>
      <td style="text-align:right">${(c.weightLbs).toLocaleString()} lbs</td>
      <td style="white-space:nowrap;color:var(--muted);font-size:12px">${fmtDate(c._last)}</td>
      <td style="white-space:nowrap"><button class="rowbtn" onclick="openCustomerNotes('${nm}')">📝 ${(c.notes||[]).length}</button><button class="rowbtn del" onclick="deleteCustomer('${nm}')">Delete</button></td>
    </tr>`;
  }).join('');
  return `<div class="card">
    ${title?`<div class="card-head"><h3>${esc(title)}</h3></div>`:`<div class="card-head"><h3>All Customers <span style="color:var(--muted);font-weight:500;font-size:13px">(${list.length})</span></h3></div>`}
    <div class="table-wrap"><table style="min-width:920px">
      <thead><tr><th style="width:40px">★</th><th>Customer</th><th>Office</th><th style="text-align:center">Quotes</th><th style="text-align:center">Ship</th><th style="text-align:center">Won</th><th style="text-align:center">Win %</th><th style="text-align:right">Volume</th><th>Last Activity</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>`;
}

/* ===================================================================
   WIRE INTO NAV + ROUTER
   =================================================================== */
(function wireFunnel(){
  /* nav labels */
  const nse=NAV_GROUPS.find(g=>g.id==='nse');
  if(nse){
    nse.items=[
      {id:'nsedash',ic:'🎯',label:'NSE Dashboard'},
      {id:'funnel',ic:'🧲',label:'Prospect Funnel'},
      {id:'custopps',ic:'🏢',label:'Customer Opportunities'},
      {id:'projectcenter',ic:'🏗️',label:'Project Center'}
    ];
  }

})();

</script>
<!-- ============================================================
     HEAVY HAUL HUB — Funnel + Access PATCH  (v2)
     HOW TO INSTALL:
       1) Open your "heavy Haul Hub.html" in a text editor.
       2) Find the very last  </body>  tag (near the bottom).
       3) Paste EVERYTHING below on its own line, right BEFORE </body>.
          (It must come AFTER the existing "HEAVY HAUL OPPORTUNITY FUNNEL" <script>.)
       4) Save. Done — refresh the app.
     NOTE: If you already pasted v1, delete that old <script> block first,
           then paste this v2 block in its place.
     ============================================================ -->
<script>
/* ===================================================================
   FUNNEL + ACCESS PATCH  (paste this <script> block right before </body>,
   AFTER the existing "HEAVY HAUL OPPORTUNITY FUNNEL" script).
   Adds:
   1) Role-based "Who's working today" — NSEs = full access; Reps = AR Tools + Home only.
   2) Per-opportunity: change funnel stage, add running notes, follow-up alerts w/ reminders.
   3) Qualified/Quoting intake pop-up: Volume, Modes Needed, Needs Assessment items,
      Next Steps checklist that -> moves to Customer when all checked.
   =================================================================== */

/* ---------- new shared state ---------- */
let ACTIVE_ROLE = 'all';   /* 'all' (manager) | 'nse' | 'rep' */
let ACTIVE_NSE  = '';

const OPP_MODES = ['OTR', 'Loading / Unloading Services', 'OOG / Break Bulk / RORO'];
const OPP_VOLUMES = ['Weekly', 'Monthly', 'Yearly', 'Per Project'];
/* Opp Tracker classification labels (kept from the original tracker) */
const OPP_CLASS = ['New to Mode', 'New Customer Close', 'Reactivation'];
function oppClassColor(c){ return c==='New to Mode'?'#134074':c==='New Customer Close'?'#1b873f':c==='Reactivation'?'#c77c00':'#94a3b8'; }
function oppClassBadge(o){ if(!o||!o.classification) return ''; return `<span class="pill" style="background:${oppClassColor(o.classification)};color:#fff" title="Opportunity type">${esc(o.classification)}</span>`; }
function oppSetClass(id,c){ const arr=oppList(); const o=arr.find(x=>x.id===id); if(!o) return; o.classification=c||''; oppSave(arr); if(OPP_DETAIL===id) openOppDetail(id); route(); toast(c?('Marked: '+c):'Classification cleared'); }
/* Volume display: "500 Shipments Per Project" / "1500 Shipments Yearly" */
function oppVolumeText(I){ if(!I) return ''; const q=(I.volumeQty==null?'':String(I.volumeQty)).trim(); const f=(I.volume||'').trim();
  if(!q && !f) return ''; if(q && f) return q+' Shipments '+f; return q ? (q+' Shipments') : f; }
let OPP_INTAKE = null;     /* working state while the intake modal is open */

/* =====================================================================
   1) ROLE-BASED ACCESS  ("Who's working today")
   ===================================================================== */
const REP_PAGES = ['home','team','quoting','dashboard','repprospects','projectcenter'];
function roleAllowsPage(page){
  if(ACTIVE_ROLE==='rep') return REP_PAGES.indexOf(page)>=0;
  return true; /* manager + nse = everything */
}
function roleAllowsGroup(gid){
  if(ACTIVE_ROLE==='rep') return gid==='home' || gid==='ar';
  return true;
}

/* Role-aware sidebar (mirrors the original buildSidebar, filters groups) */
window.buildSidebar = function(){
  if(!NAV_INIT){ navOpenForPage(CURRENT_PAGE); if(!Object.keys(NAV_OPEN).length) NAV_OPEN.home=true; NAV_INIT=true; }
  let h='';
  NAV_GROUPS.filter(g=>roleAllowsGroup(g.id)).forEach(g=>{
    const open=!!NAV_OPEN[g.id];
    const hasActive=g.items.some(it=>it.id===CURRENT_PAGE);
    h+=`<div class="nav-group ${open?'':'closed'}">`;
    h+=`<button class="nav-group-head ${hasActive?'has-active':''}" onclick="navToggle('${g.id}')"><span class="ic">${g.icon}</span><span class="lbl">${g.label}</span><span class="nav-chev">▾</span></button>`;
    h+=`<div class="nav-group-body">`;
    g.items.forEach(it=>{ h+=navBtn(it.id,it.ic,it.label,g.id); });
    h+=`</div></div>`;
  });
  const sb=document.getElementById('sidebar'); if(sb) sb.innerHTML=h;
};

/* Guard navigation + routing so a Rep can't reach a hidden page directly */
const _go_prev = window.go;
window.go = function(page){ if(!roleAllowsPage(page)){ toast('That section is not available for your access'); page='home'; } return _go_prev(page); };
const _goNav_prev = window.goNav;
window.goNav = function(page,gid){ if(!roleAllowsPage(page)){ toast('That section is not available for your access'); page='home'; gid='home'; } return _goNav_prev(page,gid); };
const _route_prev = window.route;
window.route = function(){ if(!roleAllowsPage(CURRENT_PAGE)){ CURRENT_PAGE='home'; } return _route_prev(); };

/* Identity badge */
window.buildIdentityBadge = function(){
  const el=document.getElementById('identityBadge'); if(!el) return;
  if(ACTIVE_ROLE==='nse'){ el.innerHTML='🎯 NSE: '+esc(nseName(ACTIVE_NSE))+' ▾'; }
  else if(ACTIVE_ROLE==='rep'){ el.innerHTML='👤 Rep: '+esc(repName(ACTIVE_REP))+(isART(ACTIVE_REP)?' (ART)':'')+' ▾'; }
  else { el.innerHTML='👑 Manager (all access) ▾'; }
};

/* Apply + persist an identity */
function applyIdentityV2(role, id){
  ACTIVE_ROLE = role;
  if(role==='rep'){ ACTIVE_REP=id; ACTIVE_NSE=''; RP_REP=id; DASH_REP=id; RP_OFFICE='all'; RP_BROKER='all'; }
  else if(role==='nse'){ ACTIVE_NSE=id; ACTIVE_REP='all'; RP_REP='all'; if(typeof NSE_SEL!=='undefined') NSE_SEL=id; }
  else { ACTIVE_REP='all'; ACTIVE_NSE=''; RP_REP='all'; }
  try{ localStorage.setItem(IDENTITY_KEY, JSON.stringify({date:todayISO(), role, id})); }catch(e){}
  buildIdentityBadge();
}

/* New identity modal with Manager / NSE / Rep groups */
window.openIdentityModal = function(force){
  const reps=DB.reps()||[], nses=DB.nses()||[];
  const box=document.getElementById('modalBox');
  box.parentElement.querySelector('.modal').classList.remove('xwide');
  box.parentElement.querySelector('.modal').classList.remove('wide');
  const curVal = ACTIVE_ROLE==='nse' ? ('nse:'+ACTIVE_NSE) : ACTIVE_ROLE==='rep' ? ('rep:'+ACTIVE_REP) : 'all';
  const nseOpts = nses.map(n=>`<option value="nse:${n.u}" ${curVal==='nse:'+n.u?'selected':''}>${esc(n.name)}</option>`).join('');
  const repOpts = reps.map(r=>`<option value="rep:${r.u}" ${curVal==='rep:'+r.u?'selected':''}>${esc(r.name)}${r.role==='ART'?' (ART)':''}</option>`).join('');
  box.innerHTML=`<h3>👋 Who's working today?</h3>
    <div class="card-sub" style="margin:-4px 0 14px">Pick your name. <strong>NSEs</strong> get full access to everything. <strong>Reps</strong> see only <strong>AR Tools</strong> and the <strong>Home</strong> page. <strong>Manager</strong> sees everyone.</div>
    <div class="field"><label>Your name</label>
      <select id="identSel" style="width:100%">
        <optgroup label="Manager">
          <option value="all" ${curVal==='all'?'selected':''}>👑 Manager / view everyone (full access)</option>
        </optgroup>
        ${nses.length?`<optgroup label="NSEs — full access">${nseOpts}</optgroup>`:''}
        ${reps.length?`<optgroup label="Reps — AR Tools + Home only">${repOpts}</optgroup>`:''}
      </select></div>
    <div class="modal-actions" style="justify-content:${force?'space-between':'flex-end'}">
      ${force?'<button class="btn btn-ghost" style="width:auto" onclick="closeModal()">Cancel</button>':''}
      <button class="btn btn-primary" style="width:auto" onclick="confirmIdentity()">Start my day →</button>
    </div>`;
  document.getElementById('modalBg').classList.add('show');
};

window.confirmIdentity = function(){
  const sel=val('identSel')||'all';
  if(sel.indexOf('nse:')===0){ applyIdentityV2('nse', sel.slice(4)); }
  else if(sel.indexOf('rep:')===0){ applyIdentityV2('rep', sel.slice(4)); }
  else { applyIdentityV2('all',''); }
  closeModal();
  if(!roleAllowsPage(CURRENT_PAGE)) CURRENT_PAGE='home';
  buildSidebar(); route(); window.scrollTo(0,0);
  toast(ACTIVE_ROLE==='nse'?('NSE view — '+nseName(ACTIVE_NSE)) : ACTIVE_ROLE==='rep'?('Working as '+repName(ACTIVE_REP)) : 'Manager view — all access');
};

/* =====================================================================
   2) FOLLOW-UP ALERTS + REMINDERS
   ===================================================================== */
function oppFollowDue(o){
  if(!o || !o.followUpDate) return false;
  if(o.wonCustomer || oppStage(o)==='customer') return false;
  return daysSince(o.followUpDate) >= 0;            /* date has hit or passed */
}
function oppFollowBadge(o){
  if(!o.followUpDate) return '';
  const d=daysSince(o.followUpDate);
  if(oppStage(o)==='customer') return '';
  if(d>=0) return `<span class="age-badge" title="Follow-up due">🔔 ${d===0?'Due today':(d+'d overdue')}</span>`;
  return `<span class="pill pending" title="Follow-up scheduled">🔔 in ${Math.abs(d)}d</span>`;
}
function oppSetFollowUp(id, days){
  const arr=oppList(); const o=arr.find(x=>x.id===id); if(!o) return;
  const n=parseInt(days); if(isNaN(n)||n<0){ toast('Enter a number of days'); return; }
  const dt=new Date(); dt.setDate(dt.getDate()+n);
  o.followUpDays=n; o.followUpDate=dt.toISOString().slice(0,10); o.followUpSetAt=new Date().toISOString();
  oppSave(arr); if(OPP_DETAIL===id) openOppDetail(id); route(); toast('Follow-up set for '+fmtDate(o.followUpDate)+' ('+n+' day'+(n===1?'':'s')+')');
}
function oppClearFollowUp(id){
  const arr=oppList(); const o=arr.find(x=>x.id===id); if(!o) return;
  o.followUpDate=''; o.followUpDays=''; oppSave(arr); if(OPP_DETAIL===id) openOppDetail(id); route(); toast('Follow-up cleared');
}
function oppRemindersBanner(){
  const due=oppFiltered().filter(oppFollowDue)
     .sort((a,b)=> daysSince(b.followUpDate)-daysSince(a.followUpDate));
  if(!due.length) return '';
  const items=due.map(o=>{
     const d=daysSince(o.followUpDate);
     return `<div onclick="openOppDetail('${o.id}')" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;cursor:pointer;background:var(--card)">
       <span style="font-weight:700;color:var(--ink)">${esc(o.company)}<span style="font-weight:500;color:var(--muted)">${o.broker?(' · '+esc(o.broker)):''}${o.office?(' · '+esc(o.office)):''}</span></span>
       <span class="age-badge">🔔 ${d===0?'Due today':(d+'d overdue')}</span>
     </div>`;
  }).join('');
  return `<div class="alert-box danger"><h4>🔔 Follow-Ups Due <span class="age-badge">${due.length}</span></h4>
    <div class="a-sub">These opportunities have hit their follow-up date. Click one to open it and log the next step.</div>${items}</div>`;
}

/* =====================================================================
   3) PER-OPPORTUNITY NOTES
   ===================================================================== */
function oppAddNote(id){
  const t=val('oppNoteInput'); if(!t){ toast('Type a note first'); return; }
  const arr=oppList(); const o=arr.find(x=>x.id===id); if(!o) return;
  o.notesLog=o.notesLog||[]; o.notesLog.push({ts:new Date().toISOString(), text:t});
  oppSave(arr); openOppDetail(id); toast('Note added');
}
function oppDelNote(id, idx){
  const arr=oppList(); const o=arr.find(x=>x.id===id); if(!o||!o.notesLog) return;
  o.notesLog.splice(idx,1); oppSave(arr); openOppDetail(id); toast('Note deleted');
}

/* =====================================================================
   4) CHANGE FUNNEL STAGE (dropdown inside each opportunity)
   ===================================================================== */
function oppSetStage(id, key){
  const arr=oppList(); const o=arr.find(x=>x.id===id); if(!o) return;
  if(key==='customer'){ return oppMarkWon(id); }             /* reuse existing won->customer flow */
  o.wonCustomer=false;
  if(key==='prequalified'){ o.brokerContacted=false; o.nseConversation=false; o.readyToQuote=false; }
  else if(key==='qualifying'){ o.brokerContacted=true; o.nseConversation=false; o.readyToQuote=false; }
  else if(key==='quoting'){ o.brokerContacted=true; o.nseConversation=true; }
  o.status=oppDeriveStatus(o); oppSave(arr);
  if(key==='quoting' && !o.intake){ openOppIntake(id); return; }   /* trigger intake pop-up */
  openOppDetail(id); route();
  toast('Stage set to '+ (FUNNEL_MAP[key]?FUNNEL_MAP[key].label:key));
}

/* =====================================================================
   5) QUALIFIED / QUOTING INTAKE POP-UP  (Volume, Modes, Needs, Next Steps)
   ===================================================================== */
function openOppIntake(id){
  const o=oppById(id); if(!o) return;
  const src=o.intake||{};
  OPP_INTAKE = {
    id,
    volume: src.volume||'',
    volumeQty: src.volumeQty!=null? src.volumeQty : '',
    classification: o.classification||'',
    modes: Array.isArray(src.modes)? src.modes.slice() : [],
    needs: Array.isArray(src.needs)&&src.needs.length? src.needs.slice() : [''],
    steps: Array.isArray(src.steps)&&src.steps.length? JSON.parse(JSON.stringify(src.steps)) : [{text:'',done:false}]
  };
  const box=document.getElementById('modalBox');
  box.parentElement.querySelector('.modal').classList.remove('xwide');
  box.parentElement.querySelector('.modal').classList.add('wide');
  oppRenderIntake();
  document.getElementById('modalBg').classList.add('show');
}
function oppRenderIntake(){
  const I=OPP_INTAKE; if(!I) return; const o=oppById(I.id)||{};
  const box=document.getElementById('modalBox');
  const volOpts = OPP_VOLUMES.map(v=>`<option ${I.volume===v?'selected':''}>${v}</option>`).join('');
  const classOpts = OPP_CLASS.map(c=>`<option ${I.classification===c?'selected':''}>${c}</option>`).join('');
  const volPreview = oppVolumeText(I);
  const modeChips = OPP_MODES.map(m=>`<label style="display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;cursor:pointer;text-transform:none;letter-spacing:0">
      <input type="checkbox" style="width:auto" ${I.modes.indexOf(m)>=0?'checked':''} onchange="oppIntakeToggleMode('${m.replace(/'/g,"\\'")}',this.checked)">
      <span style="font-weight:600">${esc(m)}</span></label>`).join('');

    </div>`;
}
function oppIntakeToggleMode(m, on){
  const i=OPP_INTAKE.modes.indexOf(m);
  if(on && i<0) OPP_INTAKE.modes.push(m);
  if(!on && i>=0) OPP_INTAKE.modes.splice(i,1);
}
function oppIntakeVolPreview(){
  const el=document.getElementById('oiVolPreview'); if(!el) return;
  const t=oppVolumeText(OPP_INTAKE);
  el.innerHTML = t ? ('▸ '+esc(t)) : '<span style="color:var(--muted);font-weight:400">Enter a quantity and pick a frequency — e.g. “500 Shipments Per Project”.</span>';
}
function oppIntakeAddNeed(){ OPP_INTAKE.needs.push(''); oppRenderIntake(); }
function oppIntakeDelNeed(i){ OPP_INTAKE.needs.splice(i,1); if(!OPP_INTAKE.needs.length) OPP_INTAKE.needs=['']; oppRenderIntake(); }
function oppIntakeAddStep(){ OPP_INTAKE.steps.push({text:'',done:false}); oppRenderIntake(); }
function oppIntakeDelStep(i){ OPP_INTAKE.steps.splice(i,1); if(!OPP_INTAKE.steps.length) OPP_INTAKE.steps=[{text:'',done:false}]; oppRenderIntake(); }
function oppIntakeSave(){
  const I=OPP_INTAKE; if(!I) return;
  const arr=oppList(); const o=arr.find(x=>x.id===I.id); if(!o){ closeModal(); return; }
  const needs=I.needs.map(x=>(x||'').trim()).filter(Boolean);
  const steps=I.steps.filter(s=>(s.text||'').trim()).map(s=>({text:s.text.trim(), done:!!s.done}));
  o.intake={ volume:I.volume||'', volumeQty:(I.volumeQty==null?'':String(I.volumeQty).trim()), modes:I.modes.slice(), needs, steps, savedAt:new Date().toISOString() };
  o.classification = I.classification||'';   /* keep New to Mode / New Customer Close / Reactivation on the opp */
  /* make sure it sits in Qualified/Quoting */
  o.brokerContacted=true; o.nseConversation=true; o.status=oppDeriveStatus(o);
  oppSave(arr); toast('Quoting info saved');
  /* all steps checked -> offer move to Customer */
  if(steps.length && steps.every(s=>s.done)){ oppPromptMoveToCustomer(I.id); return; }
  closeModal(); openOppDetail(I.id); route();
}

/* toggling a step from the DETAIL view (outside the intake modal) */
function oppToggleStep(id, idx, checked){
  const arr=oppList(); const o=arr.find(x=>x.id===id); if(!o||!o.intake||!o.intake.steps[idx]) return;
  o.intake.steps[idx].done=checked; oppSave(arr);
  const steps=o.intake.steps.filter(s=>(s.text||'').trim());
  if(steps.length && steps.every(s=>s.done)){ oppPromptMoveToCustomer(id); return; }
  openOppDetail(id); route();
}
function oppPromptMoveToCustomer(id){
  const o=oppById(id); if(!o) return;
  if(confirm('All next steps for "'+o.company+'" are complete.\n\nMove it to "Prospect Turned Customer"?')){
    oppMarkWon(id);   /* existing flow: flags won + adds to Customer Opportunities */
  } else {
    const more=prompt('What additional action items need to be added?\n(Enter one per line.)','');
    if(more!=null){
      const arr=oppList(); const t=arr.find(x=>x.id===id);
      t.intake=t.intake||{steps:[]}; t.intake.steps=t.intake.steps||[];
      more.split(/\n+/).map(s=>s.trim()).filter(Boolean).forEach(s=>t.intake.steps.push({text:s,done:false}));
      oppSave(arr); toast('Added new action items — checklist reopened');
    }
    openOppDetail(id); route();
  }
}

  return `

window.oppFunnelSummary = function(){
  const list=oppFiltered();
  const byStage={prequalified:[],qualifying:[],quoting:[],customer:[]};
  list.forEach(o=>byStage[oppStage(o)].push(o));
  const L=[];
  L.push('HEAVY HAUL PROSPECT FUNNEL — '+(OPP_OFF==='all'?'All Offices':OPP_OFF)+(OPP_BRK!=='all'?(' · '+OPP_BRK):''));
  L.push(fmtDate(todayISO()));
  L.push('='.repeat(52));
  /* classification tally (kept from the Opp Tracker) */
  const classCounts={}; OPP_CLASS.forEach(c=>classCounts[c]=0); let classified=0;
  list.forEach(o=>{ if(o.classification && classCounts[o.classification]!=null){ classCounts[o.classification]++; classified++; } });
  L.push('');
  L.push('OPPORTUNITY TYPES');
  L.push('-'.repeat(30));
  OPP_CLASS.forEach(c=>L.push('  '+c+': '+classCounts[c]));
  if(!classified) L.push('  (none marked yet)');
  /* per-stage detail with volume + modes */
  FUNNEL.forEach(f=>{
    const arr=byStage[f.key].slice().sort((a,b)=>(+b.likelihood||0)-(+a.likelihood||0));
    L.push('');
    L.push(f.label.toUpperCase()+' ('+arr.length+')');
    L.push('-'.repeat(30));
    if(!arr.length){ L.push('  (none)'); return; }
    arr.forEach(o=>{
      let line='• '+o.company+'  —  Likelihood '+(o.likelihood||'—')+'/10';
      if(o.classification) line+='  ['+o.classification+']';
      if(o.broker) line+='  ·  '+o.broker;
      L.push(line);
      const vt=o.intake?oppVolumeText(o.intake):'';
      if(vt) L.push('   Volume: '+vt);
      if(o.intake && o.intake.modes && o.intake.modes.length) L.push('   Modes: '+o.intake.modes.join(', '));
      if(o.intake && o.intake.needs && o.intake.needs.length) L.push('   Needs: '+o.intake.needs.join(', '));
      if(o.equipment) L.push('   Fit: '+o.equipment);
    });
  });
  const txt=L.join('\n');
  const box=document.getElementById('modalBox');
  box.parentElement.querySelector('.modal').classList.remove('xwide');
  box.parentElement.querySelector('.modal').classList.add('wide');
  box.innerHTML=`<h3>📋 Funnel Summary for Manager</h3>
    <div class="card-sub" style="margin-bottom:10px">Copy-ready recap for the current filters — includes opportunity types (New to Mode / New Customer Close / Reactivation), volume, and modes.</div>

  document.getElementById('modalBg').classList.add('show');
};

/* =====================================================================
   8) TRANSITION WRAPPERS  (open intake when an opp enters Quoting)
   ===================================================================== */
function oppMaybeIntake(id){ const o=oppById(id); if(o && oppStage(o)==='quoting' && !o.intake){ openOppIntake(id); } }
const _oppAdvance_prev = window.oppAdvance;
window.oppAdvance = function(id){ _oppAdvance_prev(id); oppMaybeIntake(id); };
const _oppToggle_prev = window.oppToggle;
window.oppToggle = function(id,field,v){ _oppToggle_prev(id,field,v); oppMaybeIntake(id); };

/* =====================================================================
   9) INIT  — re-apply identity (role-aware) now that the patch is loaded
   ===================================================================== */
(function patchInit(){
  let stored=null; try{ stored=JSON.parse(localStorage.getItem(IDENTITY_KEY)||'null'); }catch(e){}
  const reps=DB.reps()||[], nses=DB.nses()||[];
  let need=false;
  if(stored && stored.date===todayISO()){
    if(stored.role==='nse' && nses.find(n=>n.u===stored.id)) applyIdentityV2('nse',stored.id);
    else if(stored.role==='rep' && reps.find(r=>r.u===stored.id)) applyIdentityV2('rep',stored.id);
    else if(stored.role==='all') applyIdentityV2('all','');
    else if(stored.rep!=null){ /* legacy */ if(stored.rep==='all') applyIdentityV2('all',''); else if(reps.find(r=>r.u===stored.rep)) applyIdentityV2('rep',stored.rep); else need=true; }
    else need=true;
  } else { applyIdentityV2('all',''); need=true; }
  buildIdentityBadge();
  if(!roleAllowsPage(CURRENT_PAGE)) CURRENT_PAGE='home';
  buildSidebar(); route();
  if(need && (reps.length||nses.length)) openIdentityModal(false);
})();

<script>
/* ===================================================================
   FUNNEL PATCH v3  — Office Summary Report + Funnel Filters + Top 5
   Paste this <script> block right before </body>, AFTER the v2 patch.
   Adds:
   1) Office Summary Report (branded, filterable, CSV/Print/Copy/Download)
   2) Funnel filters: Funnel Stage (focused view) + Opportunity Type
   3) Top-5 marking for Prospects & Customers, with an auto-suggest engine
      scoring by volume + funnel progress + note count.
   =================================================================== */

/* =====================================================================
   SHARED HELPERS
   ===================================================================== */
const OSR_PROG = {
  ready:   {lbl:'Ready to Quote',    c:'#1b873f'},
  nse:     {lbl:'NSE Conversation',  c:'#0e7490'},
  broker:  {lbl:'Broker Outreach',   c:'#e8830c'},
  none:    {lbl:'No Communication',  c:'#c0392b'},
  excluded:{lbl:'Excluded',          c:'#94a3b8'}
};
const OSR_PROG_ORDER = ['ready','nse','broker','none','excluded'];
function oppProgStatus(o){
  if(String(o.status||'').trim().startsWith('0')) return 'excluded';
  if(o.readyToQuote) return 'ready';
  if(o.nseConversation) return 'nse';
  if(o.brokerContacted) return 'broker';

}
/* ---- Prospect vs Customer relationship (explicit flag wins; legacy inference as fallback) ---- */
function oppRelationship(o){
  if(o && o.relationship==='Customer') return 'Customer';
  if(o && o.relationship==='Prospect') return 'Prospect';
  return (o && (o.classification==='New Customer Close' || o.classification==='Reactivation' || oppStage(o)==='customer')) ? 'Customer' : 'Prospect';
}
function oppIsCustomer(o){ return oppRelationship(o)==='Customer'; }
function oppIsProspect(o){ return oppRelationship(o)==='Prospect'; }

/* =====================================================================
   1) OFFICE SUMMARY REPORT
   ===================================================================== */
let OSR = null;
function osrDefault(){
  return { office:(typeof OPP_OFF!=='undefined'&&OPP_OFF!=='all')?OPP_OFF:'all',

}
function osrPreparedBy(){

/* ---- branded report HTML (used in preview, print, download) ---- */
function osrReportHTML(list){

  const progC={}; OSR_PROG_ORDER.forEach(k=>progC[k]=list.filter(o=>oppProgStatus(o)===k).length);

  const filtBits=[];
  if(OSR.type!=='all') filtBits.push(OSR.type==='customers'?'Customers':'Prospects');
  if(OSR.dealType!=='all') filtBits.push(OSR.dealType);
  if(OSR.tier!=='all') filtBits.push(OSR.tier);

  const segs=OSR_PROG_ORDER.filter(k=>k!=='excluded'&&progC[k]>0).map(k=>
    `<div style="width:${Math.round(progC[k]/activeTotal*100)}%;background:${OSR_PROG[k].c}"></div>`).join('');
  const legend=OSR_PROG_ORDER.filter(k=>progC[k]>0).map(k=>
    `<span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;margin-right:12px"><span style="width:10px;height:10px;border-radius:50%;background:${OSR_PROG[k].c};display:inline-block"></span>${OSR_PROG[k].lbl} (${progC[k]})</span>`).join('');

  /* opportunities (grouped) */
  const groups=osrGroups(list);
  const oppsHTML=groups.map(g=>{

  }).join('') || `<div style="color:#6b7a8d;padding:14px">No opportunities match these filters.</div>`;

  return `<div style="font-family:'Segoe UI',Arial,sans-serif;color:#1a2733">

        <div><div style="font-size:20px;font-weight:800;color:#0b2545">Heavy Haul Opportunity Summary</div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6b7a8d">Sales Pipeline Report</div></div>
      </div>
      <div style="text-align:right"><div style="font-size:20px;font-weight:800;color:#0b2545">${esc(officeLbl)}</div>
        <div style="font-size:12px;color:#6b7a8d">${new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</div></div>

    <div style="font-size:12px;color:#134074;margin-bottom:14px">

      &nbsp;·&nbsp; Detail: <strong>${OSR.detail==='detailed'?'Detailed':'Summary'}</strong>
      &nbsp;·&nbsp; Filters: <strong>${esc(filtLine)}</strong>
    </div>

    </div>
    <div style="font-size:12.5px;margin-bottom:8px"><strong>Deal types:</strong>
      <span style="background:#eaf1fb;color:#134074;padding:2px 9px;border-radius:20px;font-weight:700;font-size:11px;margin:0 4px">New To Mode</span>${deal['New to Mode']||0}
      <span style="background:#e3f6e9;color:#1b873f;padding:2px 9px;border-radius:20px;font-weight:700;font-size:11px;margin:0 4px">New Customer Close</span>${deal['New Customer Close']||0}
      <span style="background:#fef3e0;color:#c77c00;padding:2px 9px;border-radius:20px;font-weight:700;font-size:11px;margin:0 4px">Reactivation</span>${deal['Reactivation']||0}
    </div>

    <div style="margin-bottom:8px">${legend}</div>
    <div style="font-size:12px;font-weight:800;color:#e07a00;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #e2e8f0;padding-bottom:6px;margin:14px 0 4px">Opportunities</div>
    ${oppsHTML}

}
function osrGroups(list){
  if(OSR.groupBy==='stage'){ return OSR_PROG_ORDER.map(k=>({title:OSR_PROG[k].lbl, items:list.filter(o=>oppProgStatus(o)===k)})).filter(g=>g.items.length); }
  if(OSR.groupBy==='type'){ return OPP_CLASS.concat(['(Unclassified)']).map(c=>({title:c, items:list.filter(o=> c==='(Unclassified)'? !o.classification : o.classification===c )})).filter(g=>g.items.length); }
  if(OSR.groupBy==='broker'){ const brs=[...new Set(list.map(o=>o.broker||'—'))].sort((a,b)=>a.localeCompare(b)); return brs.map(b=>({title:b, items:list.filter(o=>(o.broker||'—')===b)})); }

}
function osrOppCard(o){

    ${(o.intake&&o.intake.modes&&o.intake.modes.length)?line('Modes Needed',o.intake.modes.join(', ')):''}
    ${(o.intake&&o.intake.needs&&o.intake.needs.length)?line('Needs Assessment',o.intake.needs.join(', ')):''}

/* ---- plain-text + CSV ---- */
function osrReportText(list){
  const L=[]; L.push('HEAVY HAUL OPPORTUNITY SUMMARY — '+(OSR.office==='all'?'All Offices':OSR.office));

  L.push('Total: '+total+'  |  Avg Likelihood: '+avg+'  |  Customers: '+list.filter(oppIsCustomer).length+'  |  Prospects: '+list.filter(oppIsProspect).length);
  osrGroups(list).forEach(g=>{ if(g.title){ L.push(''); L.push((g.title).toUpperCase()+' ('+g.items.length+')'); L.push('-'.repeat(30)); }

      L.push('• '+o.company+'  —  '+(o.likelihood||'—')+'/10  ·  '+OSR_PROG[oppProgStatus(o)].lbl+(o.classification?('  ['+o.classification+']'):''));

  });

}
function osrCSV(list){
  const cols=['Company','Broker','Office','Industry','Tier','Likelihood','Progress','Type','Deal Type','Volume','Modes','Equipment','Notes'];
  const esc2=v=>{ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };

}
/* ---- render the whole modal ---- */
function osrSet(field,value){ if(!OSR) return; OSR[field]=value; renderOfficeSummary(); }

/* =====================================================================
   2) TOP-5 ENGINE  (prospects + customers)
   ===================================================================== */
function oppScore(o){
  const vol=oppVolNum(o);
  const volScore = vol>0 ? Math.min(Math.log10(vol+1)*2.5,10) : 0;
  const stageIdx={prequalified:1,qualifying:2,quoting:3,customer:4}[oppStage(o)]||0;
  const notes=(o.notesLog||[]).length;
  const like=parseFloat(o.likelihood)||0;
  return volScore*3 + stageIdx*2 + notes*1.5 + like*0.4;
}
function oppToggleTop(id){
  const arr=oppList(); const o=arr.find(x=>x.id===id); if(!o) return;
  const cur=arr.filter(x=>x.topOpp).length;
  if(!o.topOpp && cur>=5){ toast('You already have 5 top opps — unstar one first'); return; }
  o.topOpp=!o.topOpp; oppSave(arr); if(OPP_DETAIL===id) openOppDetail(id); route(); toast(o.topOpp?'⭐ Marked as Top Opp':'Removed from Top Opps');
}
function oppSuggestTop5(){
  const arr=oppList();
  const pool=arr.filter(o=>oppStage(o)!=='customer' && !String(o.status||'').trim().startsWith('0'));
  const top=pool.slice().sort((a,b)=>oppScore(b)-oppScore(a)).slice(0,5).map(o=>o.id);
  arr.forEach(o=>o.topOpp=false);
  arr.forEach(o=>{ if(top.indexOf(o.id)>=0) o.topOpp=true; });
  oppSave(arr); route(); toast('✨ Suggested top 5 by volume, progress & notes');
}
function funnelTopPanel(){
  const tops=oppList().filter(o=>o.topOpp).sort((a,b)=>oppScore(b)-oppScore(a)).slice(0,5);
  const cards = tops.length ? tops.map(o=>{ const f=FUNNEL_MAP[oppStage(o)]; const vt=o.intake?oppVolumeText(o.intake):'';
    return `<div class="card" style="margin:0;min-width:210px;flex:1;cursor:pointer;border-left:4px solid ${f.color}" onclick="openOppDetail('${o.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px">

  }).join('') : `<div class="empty" style="padding:18px;flex:1">No top opps yet. Star up to 5 opportunities, or click <strong>✨ Suggest Top 5</strong>.</div>`;
  return `<div class="card">

    <div><label style="margin-bottom:6px">Broker</label>${brkSel}</div>
    <div><label style="margin-bottom:6px">Funnel Stage</label>${stageSel}</div>
    <div><label style="margin-bottom:6px">Opportunity Type</label>${typeSel}</div>
    <div style="flex:1;min-width:160px"><label style="margin-bottom:6px">Search</label><input placeholder="Company, broker, industry, notes…" value="${esc(OPP_SEARCH)}" oninput="OPP_SEARCH=this.value;funnelSearchDebounce()"></div>
    <div><label style="margin-bottom:6px">View</label>${viewToggle}</div>
  </div>
  ${kpis}
  <div class="card" style="padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="font-size:12px;color:var(--muted)">${total} shown</span>${clearBtn}${filterChips.map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost" style="width:auto" onclick="oppAddOffice()">＋ Office</button>
      <button class="btn btn-ghost" style="width:auto" onclick="oppFunnelSummary()">📊 Office Summary Report</button>
      <button class="btn btn-ghost" style="width:auto" onclick="openOppParser()">⚡ Paste &amp; Parse</button>
      <button class="btn btn-primary" style="width:auto" onclick="openOppForm()">＋ Add Opportunity</button>
    </div>
  </div>
  ${board}`;
};

<script>
/* ===================================================================
   NSE SCOPING PATCH v4
   NSEs keep FULL feature access, but only SEE the offices, reps, and
   prospect funnel they are working on. Manager ('all') and Rep views
   are unchanged. Active only when ACTIVE_ROLE==='nse'.
   =================================================================== */
(function(){
/* ---------- helpers ---------- */
function nseScoped(){ return typeof ACTIVE_ROLE!=='undefined' && ACTIVE_ROLE==='nse' && ACTIVE_NSE; }
function nseOffices(nseU){ const s=new Set(); repsForNse(nseU).forEach(r=>(r.offices||[]).forEach(o=>{ if(o) s.add(o); })); return [...s].sort((a,b)=>a.localeCompare(b)); }
function activeOfficeArr(){ return nseOffices(ACTIVE_NSE); }
function activeOfficeSet(){ return new Set(activeOfficeArr()); }
function officeAllowed(o){ if(!nseScoped()) return true; const s=activeOfficeSet(); if(!s.size) return false; return s.has(o||''); }
function activeRepSet(){ return new Set(repsForNse(ACTIVE_NSE).map(r=>r.u)); }
function repAllowed(u){ if(!nseScoped()) return true; return activeRepSet().has(u); }
/* expose for other overrides */
window.nseScoped=nseScoped; window.nseOffices=nseOffices; window.officeAllowed=officeAllowed; window.repAllowed=repAllowed; window.activeOfficeSet=activeOfficeSet;

/* run a render-only function with DB.reps()/DB.nses() temporarily narrowed
   to this NSE (safe: synchronous, restored in finally; edits happen elsewhere) */
function withScopedRoster(fn){
  if(!nseScoped()) return fn();
  const _r=DB.reps, _n=DB.nses;
  const myU=activeRepSet();
  DB.reps=function(){ return (_r.call(DB)||[]).filter(x=>myU.has(x.u)); };
  DB.nses=function(){ return (_n.call(DB)||[]).filter(x=>x.u===ACTIVE_NSE); };
  try { return fn(); } finally { DB.reps=_r; DB.nses=_n; }
}

/* =========================================================
   OFFICES + REPS (list sources)
   ========================================================= */
const _oppOfficeList=oppOfficeList;
oppOfficeList=function(){ let l=_oppOfficeList(); if(nseScoped()){ const s=activeOfficeSet(); (DB.oppOffices()||[]).forEach(o=>{ if(o) s.add(o); }); l=l.filter(o=>s.has(o)); } return l; };

const _oppBrokerList=oppBrokerList;
oppBrokerList=function(){ if(!nseScoped()) return _oppBrokerList();
  const s=activeOfficeSet(); const set=new Set();
  oppList().forEach(o=>{ if(s.has(o.office||'') && o.broker && o.broker.trim()) set.add(o.broker.trim()); });
  return [...set].sort((a,b)=>a.localeCompare(b)); };

const _arReps=arReps;
arReps=function(){ let l=_arReps(); if(nseScoped()){ const s=activeRepSet(); l=l.filter(r=>s.has(r.u)); } return l; };

const _repOptions=repOptions;
repOptions=function(sel){ if(!nseScoped()) return _repOptions(sel);
  const s=activeRepSet();
  return (DB.reps()||[]).filter(r=>s.has(r.u)||r.u===sel).map(r=>{
    const lbl=r.role==='ART'?esc(r.name)+' (ART → '+esc(r.mentorAR?repName(r.mentorAR):'unassigned')+')':esc(r.name);
    return `<option value="${r.u}" ${sel===r.u?'selected':''}>${lbl}</option>`;
  }).join(''); };

if(typeof allOffices==='function'){ const _allOffices=allOffices;
  allOffices=function(){ let l=_allOffices(); if(nseScoped()){ const s=activeOfficeSet(); l=l.filter(o=>s.has(o)); } return l; }; }

/* =========================================================
   PROSPECT FUNNEL (opps scoped by office)
   ========================================================= */
if(typeof oppFilteredNoStage==='function'){ const _base=oppFilteredNoStage;
  oppFilteredNoStage=function(){ let l=_base(); if(nseScoped()){ const s=activeOfficeSet(); l=l.filter(o=>s.has(o.office||'')); } return l; };
  window.oppFilteredNoStage=oppFilteredNoStage; }

if(window.osrFiltered){ const _osr=window.osrFiltered;
  window.osrFiltered=function(){ let l=_osr(); if(nseScoped()){ const s=activeOfficeSet(); l=l.filter(o=>s.has(o.office||'')); } return l; };
}

if(window.funnelTopPanel){ const _ftp=window.funnelTopPanel;
  window.funnelTopPanel=function(){ if(!nseScoped()) return _ftp();
    const s=activeOfficeSet();
    const tops=oppList().filter(o=>o.topOpp && s.has(o.office||'')).sort((a,b)=>oppScore(b)-oppScore(a)).slice(0,5);
    const cards=tops.length?tops.map(o=>{ const f=FUNNEL_MAP[oppStage(o)]; const vt=o.intake?oppVolumeText(o.intake):'';
      return `<div class="card" style="margin:0;min-width:210px;flex:1;cursor:pointer;border-left:4px solid ${f.color}" onclick="openOppDetail('${o.id}')">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px">
          <strong style="font-size:13px;line-height:1.25">${esc(o.company)}</strong>
          <button class="rowbtn" style="background:none;padding:0;font-size:16px;color:var(--accent)" onclick="event.stopPropagation();oppToggleTop('${o.id}')" title="Remove from Top Opps">★</button></div>
        <div style="font-size:11px;color:var(--muted);margin-top:3px">${esc(o.broker||'—')}${o.office?(' · '+esc(o.office)):''}</div>
        <div style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;align-items:center">
          <span class="pill" style="background:${f.color};color:#fff">${f.label}</span>
          <span style="font-weight:800;color:var(--accent)">${esc(o.likelihood||'—')}/10</span></div>
        ${vt?`<div style="font-size:11px;color:var(--muted);margin-top:5px">📦 ${esc(vt)}</div>`:''}
        <div style="font-size:11px;color:var(--muted);margin-top:3px">📝 ${(o.notesLog||[]).length} note(s)</div>
      </div>`;}).join('') : `<div class="empty" style="padding:18px;flex:1">No top opps yet in your offices. Star up to 5, or click <strong>✨ Suggest Top 5</strong>.</div>`;
    return `<div class="card"><div class="card-head"><h3>⭐ Top 5 Prospect Opps <span style="color:var(--muted);font-weight:500;font-size:13px">(${tops.length}/5)</span></h3>
      <button class="btn btn-ghost" style="width:auto" onclick="oppSuggestTop5()">✨ Suggest Top 5</button></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${cards}</div></div>`;
  };
}

if(window.oppSuggestTop5){ const _sug=window.oppSuggestTop5;
  window.oppSuggestTop5=function(){ if(!nseScoped()) return _sug();
    const s=activeOfficeSet(); const arr=oppList();
    const pool=arr.filter(o=>s.has(o.office||'') && oppStage(o)!=='customer' && !String(o.status||'').trim().startsWith('0'));
    const top=pool.slice().sort((a,b)=>oppScore(b)-oppScore(a)).slice(0,5).map(o=>o.id);
    arr.forEach(o=>{ if(s.has(o.office||'')) o.topOpp=false; });   /* only clear within my offices */
    arr.forEach(o=>{ if(top.indexOf(o.id)>=0) o.topOpp=true; });
    oppSave(arr); route(); toast('✨ Suggested top 5 in your offices');
  };
}

/* Friendly banner if an NSE has no offices assigned yet */
if(window.pageFunnel){ const _pf=window.pageFunnel;
  window.pageFunnel=function(){ if(nseScoped() && !activeOfficeArr().length){
      return `<div class="page-title">🧲 Prospect Funnel</div>
        <div class="alert-box warn"><h4>⚠️ No offices assigned to you yet</h4>
        <div class="a-sub">Your funnel is scoped to the offices your reps cover. Ask your manager to assign your reps to offices under <strong>Manage Reps → 🏢 Offices</strong>, and they'll appear here automatically.</div></div>`;
    }
    return _pf(); };
}

/* =========================================================
   CUSTOMER OPPORTUNITIES (scope to this NSE's reps' quotes)
   ========================================================= */
if(typeof buildCustomerData==='function'){ const _bcd=buildCustomerData;
  buildCustomerData=function(sourceList, period, metaStore){
    if(nseScoped() && (sourceList==null)){ sourceList=quotesForNse(ACTIVE_NSE); }
    return _bcd(sourceList, period, metaStore);
  };
  window.buildCustomerData=buildCustomerData;
}

/* =========================================================
   MANAGE REPS  — show only this NSE's reps + themselves
   ========================================================= */
if(typeof pageReps==='function'){ const _pageReps=pageReps;
  pageReps=function(){ return withScopedRoster(_pageReps); };
  window.pageReps=pageReps;
}

/* =========================================================
   NSE DASHBOARD + (old) PROSPECT OPPORTUNITIES
   Lock the NSE selector to the logged-in NSE and scope roster/offices.
   ========================================================= */
function lockNseSelector(html){
  const label = esc(nseName(ACTIVE_NSE));
  return html.replace(
    /<select style="max-width:300px" onchange="NSE_SEL=this\.value;route\(\)">[\s\S]*?<\/select>/,
    `<div class="tag" style="padding:9px 12px;font-size:14px">🎯 ${label} <span style="color:var(--muted);font-weight:500">· your dashboard</span></div>`
  );
}
if(typeof pageNseDash==='function'){ const _pnd=pageNseDash;
  pageNseDash=function(){ if(!nseScoped()) return _pnd();
    NSE_SEL=ACTIVE_NSE;
    return lockNseSelector(withScopedRoster(_pnd)); };
  window.pageNseDash=pageNseDash;
}
if(typeof pageProspects==='function'){ const _pp=pageProspects;
  pageProspects=function(){ if(!nseScoped()) return _pp();
    NSE_SEL=ACTIVE_NSE;
    return lockNseSelector(withScopedRoster(_pp)); };
  window.pageProspects=pageProspects;
}

/* Keep NSE_SEL pinned to the active NSE on every route while scoped */
if(typeof window.route==='function'){ const _route=window.route;
  window.route=function(){ if(nseScoped()) NSE_SEL=ACTIVE_NSE; return _route(); };
}

/* When switching INTO an NSE identity, reset funnel office filter so they
   start seeing all of THEIR offices. */
if(typeof applyIdentityV2==='function'){ const _apply=applyIdentityV2;
  applyIdentityV2=function(role,id){ _apply(role,id);
    if(role==='nse'){ if(typeof OPP_OFF!=='undefined') OPP_OFF='all'; if(typeof OPP_BRK!=='undefined') OPP_BRK='all'; NSE_SEL=id; } };
  window.applyIdentityV2=applyIdentityV2;
}

})();

</script>
<script>
/* ===================================================================
   NSE TOOLS UPGRADE v5
   -------------------------------------------------------------------
   1) CUSTOMER OPPORTUNITIES — full redo: clean list, Quarter-over-Quarter
      growth line graph, click-into detail with Action-Item checklist,
      Customer Visit Date, Notes, New Opportunities, and Top-Customer star.
   2) NSE DASHBOARD — surfaces Top 5 Customers + Top 5 Prospects (funnel).
   3) PROSPECT FUNNEL — "Move to Whale" category button (massive, long-close
      opportunities), a Work-a-Tier filter bar, and an expanded Whale tier
      that shows every qualifying + needs-assessment detail on one page.
   All new fields ride on the existing customer/opp records, so they
   round-trip through JSON backups & the Import Center automatically.
   =================================================================== */

/* =====================================================================
   SMALL SHARED HELPERS
   ===================================================================== */
function v5CustMeta(name){ const c=DB.customers()||{}; return c[name]||{}; }
function v5CustSet(name, patch){
  const c=DB.customers()||{}; c[name]=Object.assign({}, c[name], patch); DB.saveCustomers(c);
}
function v5QKey(iso){ if(!iso) return null; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return null; return d.getFullYear()+' Q'+(Math.floor(d.getMonth()/3)+1); }
function v5QCmp(a,b){ const pa=a.split(' Q'), pb=b.split(' Q'); return (+pa[0]*10 + +pa[1])-(+pb[0]*10 + +pb[1]); }
function v5QShort(k){ const p=k.split(' Q'); return 'Q'+p[1]+" '"+p[0].slice(2); }

/* Quarter-over-quarter buckets from the quote log (optionally scoped to
   one customer and/or the current COPP office filter). */
function v5QuarterSeries(customerName){
  const off=(typeof COPP_OFF!=='undefined')?COPP_OFF:'all';
  const buckets={};
  (DB.quotes()||[]).forEach(q=>{
    if(customerName && ((q.customerName||'(Unknown)').trim())!==customerName) return;
    if(off && off!=='all' && (q.office||'')!==off) return;
    const k=v5QKey(q.dateReceived); if(!k) return;
    if(!buckets[k]) buckets[k]={quotes:0,ships:0,won:0};
    buckets[k].quotes++;
    quoteItems(q).forEach(it=>buckets[k].ships+=itemVol(it));
    if(q.status==='Won') buckets[k].won++;
  });
  const keys=Object.keys(buckets).sort(v5QCmp).slice(-8);
  return keys.map(k=>({label:v5QShort(k), full:k, ships:buckets[k].ships, quotes:buckets[k].quotes, won:buckets[k].won}));
}

/* Clean SVG line chart (with soft area fill, gridlines, value labels). */
function v5LineSVG(series, valKey, opts){
  opts=opts||{};
  const W=opts.w||760, H=opts.h||210, pad={l:46,r:18,t:18,b:34};
  if(!series || !series.length) return '<div class="empty" style="padding:22px">No dated quotes yet to chart growth.</div>';
  const vals=series.map(s=>s[valKey]||0);
  const max=Math.max(1,...vals);
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b, n=series.length;
  const X=i=> pad.l + (n===1? iw/2 : (iw*i/(n-1)));
  const Y=val=> pad.t + ih - (ih*val/max);
  const pts=series.map((s,i)=>[X(i),Y(s[valKey]||0)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area='M'+pts[0][0].toFixed(1)+' '+(pad.t+ih).toFixed(1)+' '+pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+' L'+pts[n-1][0].toFixed(1)+' '+(pad.t+ih).toFixed(1)+' Z';
  let grid='';
  for(let g=0;g<=4;g++){ const gv=max*g/4, gy=Y(gv);
    grid+=`<line x1="${pad.l}" y1="${gy.toFixed(1)}" x2="${W-pad.r}" y2="${gy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`
        +`<text x="${pad.l-7}" y="${(gy+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(gv)}</text>`;
  }
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.6" fill="var(--accent2)"/>`
        +`<text x="${p[0].toFixed(1)}" y="${(p[1]-8).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)">${series[i][valKey]||0}</text>`).join('');
  const xlab=series.map((s,i)=>`<text x="${X(i).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(s.label)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:230px" preserveAspectRatio="xMidYMid meet">
    ${grid}
    <path d="${area}" fill="rgba(19,64,116,.10)" stroke="none"/>
    <path d="${line}" fill="none" stroke="var(--accent2)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${xlab}
  </svg>`;
}

/* Growth stat between the last two quarters. */
function v5GrowthStat(series, key){
  key=key||'ships';
  if(!series || series.length<2) return {pct:null, dir:'flat', last:series&&series.length?series[series.length-1][key]:0, prev:0};
  const last=series[series.length-1][key]||0, prev=series[series.length-2][key]||0;
  let pct=null; if(prev>0) pct=Math.round(((last-prev)/prev)*100); else if(last>0) pct=100;
  const dir = pct==null?'flat': pct>0?'up': pct<0?'down':'flat';
  return {pct, dir, last, prev};
}
function v5GrowthChip(g){
  if(g.pct==null) return `<span class="tag">— no prior quarter —</span>`;
  const col=g.dir==='up'?'var(--green)':g.dir==='down'?'var(--red)':'var(--muted)';
  const arr=g.dir==='up'?'▲':g.dir==='down'?'▼':'▬';
  return `<span style="font-weight:800;color:${col}">${arr} ${g.pct>0?'+':''}${g.pct}%</span> <span style="color:var(--muted);font-size:12px">QoQ (${g.prev}→${g.last} shp)</span>`;
}

/* =====================================================================
   1) CUSTOMER OPPORTUNITIES — FULL REDESIGN
   ===================================================================== */
function v5CustList(){
  let data=buildCustomerData(null,'overall');
  data.forEach(c=>{ c._office=coppCustomerOffice(c.name); c._last=coppLastActivity(c.name); c._meta=v5CustMeta(c.name); c._fromFunnel=!!(c._meta.fromFunnel); });
  const off=(typeof COPP_OFF!=='undefined')?COPP_OFF:'all';
  let list=data.slice();
  if(off!=='all') list=list.filter(c=>c._office===off);
  const q=((typeof COPP_SEARCH!=='undefined')?COPP_SEARCH:'').toLowerCase().trim();
  if(q) list=list.filter(c=>[c.name,c.topType,c._office,c.desc].join(' ').toLowerCase().includes(q));
  const sort=(typeof COPP_SORT!=='undefined')?COPP_SORT:'quotes';
  if(sort==='quotes') list.sort((a,b)=>b.total-a.total);
  else if(sort==='win') list.sort((a,b)=>b.winPct-a.winPct);
  else if(sort==='ship') list.sort((a,b)=>b.shipments-a.shipments);
  else if(sort==='vol') list.sort((a,b)=>b.weightLbs-a.weightLbs);
  else if(sort==='recent') list.sort((a,b)=>(b._last||'').localeCompare(a._last||''));
  else if(sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sort==='top') list.sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||b.total-a.total);
  return {data, list, offs:[...new Set(data.map(c=>c._office).filter(Boolean))].sort((a,b)=>a.localeCompare(b))};
}

function v5ActionProgress(meta){
  const a=(meta.actionItems||[]); const done=a.filter(x=>x.done).length; return {done, total:a.length};
}

window.pageCustomerOpps = function(){
  const off=(typeof COPP_OFF!=='undefined')?COPP_OFF:'all';
  const {data, list, offs}=v5CustList();
  if(off!=='all' && !offs.includes(off) && typeof COPP_OFF!=='undefined') COPP_OFF='all';

  /* KPIs */
  const totalQuotes=data.reduce((s,c)=>s+c.total,0);
  const totalShip=data.reduce((s,c)=>s+c.shipments,0);
  const wins=data.reduce((s,c)=>s+c.won,0);
  const tops=data.filter(c=>c.fav).length;
  const converted=data.filter(c=>c._fromFunnel).length;
  const kpis=`<div class="kpi-grid">
    ${kpi('Customers',data.length,'b-blue')}
    ${kpi('Total Quotes',totalQuotes,'b-navy')}
    ${kpi('Total Shipments',totalShip,'b-orange')}
    ${kpi('Quotes Won',wins,'b-green')}
    ${kpi('⭐ Top Customers',tops+'/5','b-amber','starred')}
  </div>`;

  /* QoQ growth chart (scoped to the office filter) */
  const series=v5QuarterSeries(null);
  const g=v5GrowthStat(series,'ships');
  const growthCard=`<div class="card">
    <div class="card-head"><h3>📈 Growth — Quarter over Quarter${off!=='all'?(' · '+esc(off)):''}</h3>
      <span style="font-size:13px">${v5GrowthChip(g)}</span></div>
    <div class="card-sub">Total shipment volume booked each quarter across ${off==='all'?'all offices':esc(off)}. Hover the points for the per-quarter totals.</div>
    ${v5LineSVG(series,'ships')}
  </div>`;

  /* Controls */
  const offSel=`<select style="max-width:220px" onchange="COPP_OFF=this.value;route()">
      <option value="all" ${off==='all'?'selected':''}>🏢 All Offices</option>
      ${offs.map(o=>`<option ${off===o?'selected':''}>${esc(o)}</option>`).join('')}
    </select>`;
  const sort=(typeof COPP_SORT!=='undefined')?COPP_SORT:'quotes';
  const sortSel=`<select style="max-width:200px" onchange="COPP_SORT=this.value;route()">
      <option value="quotes" ${sort==='quotes'?'selected':''}>Sort: Most Quotes</option>
      <option value="top" ${sort==='top'?'selected':''}>Sort: Top Customers First</option>
      <option value="ship" ${sort==='ship'?'selected':''}>Sort: Shipments</option>
      <option value="win" ${sort==='win'?'selected':''}>Sort: Win %</option>
      <option value="vol" ${sort==='vol'?'selected':''}>Sort: Volume (lbs)</option>
      <option value="recent" ${sort==='recent'?'selected':''}>Sort: Most Recent</option>
      <option value="name" ${sort==='name'?'selected':''}>Sort: Name A→Z</option>
    </select>`;
  const search=(typeof COPP_SEARCH!=='undefined')?COPP_SEARCH:'';

  /* Clean list */
  let body;
  if(!list.length){ body=`<div class="card"><div class="empty">No customers yet. Customers appear here automatically as reps log quotes — or when a prospect is won in the funnel.</div></div>`; }
  else {
    const rows=list.map(c=>{ const nm=jsq(c.name); const ap=v5ActionProgress(c._meta);
      const visit=c._meta.visitDate;
      const apChip = ap.total? `<span class="pill ${ap.done===ap.total?'won':'pending'}" title="Action items complete">${ap.done}/${ap.total} ✓</span>` : '<span style="color:var(--muted);font-size:12px">—</span>';
      return `<tr style="cursor:pointer;${c.fav?'background:#fff8ec':''}" onclick="openCustomerDetail('${nm}')">
        <td onclick="event.stopPropagation();toggleCustFav('${nm}')" title="${c.fav?'Remove Top Customer':'Mark as Top Customer'}" style="text-align:center;font-size:17px;color:${c.fav?'var(--accent)':'#c9d2dc'}">${c.fav?'★':'☆'}</td>
