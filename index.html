/* ============================================================
   CRANE, RIGGING, & STORAGE — cost model
   ============================================================ */
function pcCrHours(min){ const n=Number(min); return (n===4||n===8)?n:8; }        /* billed hrs/day */
function pcCrDays(it){ return Number(it.days)||0; }
/* Operator & Crane */
function pcCrIsJackSlide(it){ return it.kind==='crane' && it.craneMode==='jackslide'; }
function pcCrOpBase(it){ if(pcCrIsJackSlide(it)) return Number(it.contractRate)||0; return (Number(it.opRate)||0)*pcCrHours(it.opMin)*pcCrDays(it); }
function pcCrOpOt(it){ return (Number(it.opOtHours)||0)*(Number(it.opOtRate)||0); }
function pcCrOpTotal(it){ return pcCrOpBase(it)+pcCrOpOt(it); }
/* Riggers (crane) / Riggers & Flaggers (forklift) */
function pcCrRigBase(it){ return (Number(it.riggers)||0)*(Number(it.rigRate)||0)*pcCrHours(it.rigMin)*pcCrDays(it); }
function pcCrRigOt(it){ return (Number(it.rigOtHours)||0)*(Number(it.rigOtRate)||0); }
function pcCrRigTotal(it){ return pcCrRigBase(it)+pcCrRigOt(it); }
/* Multi-forklift operators (each size its own section) */
function pcCrForkBase(f,it){ return (Number(f.count)||0)*(Number(f.opRate)||0)*pcCrHours(f.opMin)*pcCrDays(it); }
function pcCrForkOt(f){ return (Number(f.otHours)||0)*(Number(f.otRate)||0); }
function pcCrForkLine(f,it){ return pcCrForkBase(f,it)+pcCrForkOt(f); }
function pcCrForkTotal(it){ return (it.forklifts||[]).reduce((s,f)=>s+pcCrForkLine(f,it),0); }
function pcCrForkOperators(it){ return (it.forklifts||[]).reduce((s,f)=>s+(Number(f.count)||0),0); }
/* Per diem — headcount onsite × days.  Crane: 1 operator + riggers.  Forklift: forklift operators + riggers/flaggers. */
function pcCrPeople(it){ const riggers=Number(it.riggers)||0;
  if(it.kind==='forklift') return pcCrForkOperators(it)+riggers;
  return 1+riggers; }
function pcCrPerDiem(it){ return (Number(it.perDiemRate)||0)*pcCrPeople(it)*pcCrDays(it); }
/* Custom entries (crane) */
function pcCrCustomLine(c,it){ const price=Number(c.price)||0; return c.type==='hourly'? price*pcCrHours(it.opMin)*pcCrDays(it) : price; }
function pcCrCustomsTotal(it){ return (it.customs||[]).reduce((s,c)=>s+pcCrCustomLine(c,it),0); }
/* Storage */
function pcCrStorageCost(it){ return (Number(it.storageRate)||0)*(Number(it.duration)||0); }
/* Mobilization — In + Out (legacy single 'mobilization' counts as In) */
function pcCrMob(it){ if(it.mobIn==null && it.mobOut==null && it.mobilization!=null) return Number(it.mobilization)||0;
  return (Number(it.mobIn)||0)+(Number(it.mobOut)||0); }
/* Raw internal cost (before margin) — what the rep sees, never shown to the customer */
function pcCrItemCost(it){
  if(!it || !it.kind){ return (Number(it&&it.qty)||0)*(Number(it&&it.rate)||0); }   /* legacy line */
  if(it.kind==='storage'){ return pcCrStorageCost(it)+(Number(it.handleIn)||0)+(Number(it.handleOut)||0); }
  if(it.kind==='forklift'){ return pcCrMob(it)+pcCrForkTotal(it)+pcCrRigTotal(it)+pcCrPerDiem(it); }
  return pcCrMob(it)+pcCrOpTotal(it)+pcCrRigTotal(it)+(Number(it.riggingFee)||0)+pcCrPerDiem(it)+pcCrCustomsTotal(it);
}
/* Margin — a % added on top of cost; only the finalized rate is shown to the customer.
   pcCrMarginPct = the item's DEFAULT margin (used by any section without its own override). */
function pcCrMarginPct(it){ return Number(it.margin)||0; }
/* Finalized customer-facing total = sum of each section's cost × (1 + that section's margin). */
function pcCrItemTotal(it){ return pcCrComponentsFinal(it).reduce((s,c)=>s+c.amount,0); }
function pcCrItemMargin(it){ return pcCrItemTotal(it)-pcCrItemCost(it); }
/* Rate-bearing components of a line (BEFORE margin) — used to build the detailed customer breakdown.
   Returns [{label, cost}]; only components with a nonzero cost are included. */
function pcCrComponents(it){
  const out=[]; const add=(label,cost,mkey)=>{ if(cost) out.push({label,cost,mkey:mkey||'op'}); };
  if(!it || !it.kind){ add(it&&it.desc?it.desc:'Item', (Number(it&&it.qty)||0)*(Number(it&&it.rate)||0), 'op'); return out; }
  const days=pcCrDays(it);
  if(it.kind==='storage'){
    add('Storage ('+pcMoney(Number(it.storageRate)||0)+'/'+(it.ratePeriod||'month')+' \u00d7 '+(Number(it.duration)||0)+')', pcCrStorageCost(it), 'storage');
    add('Handling In', Number(it.handleIn)||0, 'handle');
    add('Handling Out', Number(it.handleOut)||0, 'handle');
    return out;
  }
  add('Mobilization In', Number(it.mobIn)||(it.mobIn==null&&it.mobOut==null?Number(it.mobilization)||0:0), 'mob');
  add('Mobilization Out', Number(it.mobOut)||0, 'mob');
  if(it.kind==='crane'){
    if(pcCrIsJackSlide(it)){
      add('Jack & Slide \u2014 Contracted Rate', pcCrOpBase(it), 'op');
      add('Overtime ('+ (Number(it.opOtHours)||0)+' hr @ '+pcMoney(Number(it.opOtRate)||0)+')', pcCrOpOt(it), 'op');
    } else {
      add('Operator & Crane ('+pcMoney(Number(it.opRate)||0)+'/hr \u00d7 '+pcCrHours(it.opMin)+' \u00d7 '+days+'d)', pcCrOpBase(it), 'op');
      add('Operator Overtime ('+ (Number(it.opOtHours)||0)+' hr @ '+pcMoney(Number(it.opOtRate)||0)+')', pcCrOpOt(it), 'op');
    }
  } else {
    (it.forklifts||[]).forEach(f=>{
      add('Forklift'+(f.size?(' '+f.size):'')+' ('+(Number(f.count)||0)+' \u00d7 '+pcMoney(Number(f.opRate)||0)+'/hr \u00d7 '+pcCrHours(f.opMin)+' \u00d7 '+days+'d)', pcCrForkBase(f,it), 'op');
      add('Forklift'+(f.size?(' '+f.size):'')+' Overtime ('+(Number(f.otHours)||0)+' hr @ '+pcMoney(Number(f.otRate)||0)+')', pcCrForkOt(f), 'op');
    });
  }
  const rigLbl=(it.kind==='crane')?'Riggers':'Riggers/Flaggers';
  add(rigLbl+' ('+(Number(it.riggers)||0)+' \u00d7 '+pcMoney(Number(it.rigRate)||0)+'/hr \u00d7 '+pcCrHours(it.rigMin)+' \u00d7 '+days+'d)', pcCrRigBase(it), 'rig');
  add(rigLbl+' Overtime ('+(Number(it.rigOtHours)||0)+' hr @ '+pcMoney(Number(it.rigOtRate)||0)+')', pcCrRigOt(it), 'rig');
  if(it.kind==='crane') add('Rigging Fee', Number(it.riggingFee)||0, 'rigFee');
  add('Per Diem ('+pcMoney(Number(it.perDiemRate)||0)+' \u00d7 '+pcCrPeople(it)+' ppl \u00d7 '+days+'d)', pcCrPerDiem(it), 'perDiem');
  if(it.kind==='crane') (it.customs||[]).forEach(c=>{ add((c.title||'Custom'), pcCrCustomLine(c,it), 'custom'); });
  return out;
}
/* ---- Per-section margin engine ---- */
/* Margin for a given section key: section override if set, else the item default margin. */
function pcCrMarginFor(it,mkey){ const o=it.margins||{}; const v=o[mkey]; if(v!=null&&v!=='') return Number(v)||0; return Number(it.margin)||0; }
/* Active sections per line kind — [key,label] pairs, in display order. */
function pcCrActiveSections(it){
  if(!it||!it.kind) return [['op','Line Item']];
  if(it.kind==='storage') return [['storage','Storage'],['handle','Handling In/Out']];
  if(it.kind==='forklift') return [['mob','Mobilization'],['op','Forklifts & Operators'],['rig','Riggers / Flaggers'],['perDiem','Per Diem']];
  return [['mob','Mobilization'],['op', pcCrIsJackSlide(it)?'Jack & Slide (Contracted)':'Operator & Crane'],['rig','Riggers'],['rigFee','Rigging Fee'],['perDiem','Per Diem'],['custom','Custom Entries']];
}
/* Raw cost of a single section (before margin). */
function pcCrSectionCost(it,mkey){
  switch(mkey){
    case 'mob': return pcCrMob(it);
    case 'op': return (it.kind==='forklift')?pcCrForkTotal(it):pcCrOpTotal(it);
    case 'rig': return pcCrRigTotal(it);
    case 'rigFee': return Number(it.riggingFee)||0;
    case 'perDiem': return pcCrPerDiem(it);
    case 'custom': return pcCrCustomsTotal(it);
    case 'storage': return pcCrStorageCost(it);
    case 'handle': return (Number(it.handleIn)||0)+(Number(it.handleOut)||0);
  }
  return 0;
}
/* Same components with per-section margin applied — the finalized rates shown to the customer. */
function pcCrComponentsFinal(it){ return pcCrComponents(it).map(c=>({label:c.label, cost:c.cost, mkey:c.mkey, pct:pcCrMarginFor(it,c.mkey), amount:c.cost*(1+pcCrMarginFor(it,c.mkey)/100)})); }
function pcCrKindLabel(k){ return k==='crane'?'Crane & Rigging':k==='forklift'?'Forklift / Material Handling':k==='storage'?'Storage':'Item'; }
function pcCrKindIcon(k){ return k==='crane'?'\uD83C\uDFD7\uFE0F':k==='forklift'?'\uD83D\uDE9C':k==='storage'?'\uD83D\uDCE6':'\u2022'; }
function pcCraneSubtotal(p){ return pcSvc(p,'craneRigging').reduce((s,it)=>s+pcCrItemTotal(it),0); }
/* distinct truck types present (for storage trailer dropdowns) */
function pcTruckTypesInProject(p){ const s=new Set(); pcAllTrucks(p).forEach(t=>{ if(t.type) s.add(t.type); }); return [...s]; }
/* Grouped packing-list pull: combine items with identical weight + dimensions and count each → Product Information */
function pcCrGroupedProducts(p){
  const map={};
  pcAllPackages(p).forEach(pk=>{
    const disp=[pk.L,pk.W,pk.H].map(inchesToFtIn).filter(Boolean).join(' x ');
    const wt=Math.round(Number(pk.weight)||0);
    const key=disp+'|'+wt;
    if(!map[key]) map[key]={ desc:(pk.desc||('Pkg '+pk.pkg)), disp, weight:wt, count:0 };
    map[key].count += Math.max(1, parseInt(pk.qty)||1);
  });
  return Object.values(map);
}
function pcServicesSubtotal(p){ return pcDrayageSubtotal(p)+pcTransSubtotal(p)+pcCraneSubtotal(p); }
function pcGrand(p){ return pcTruckSubtotal(p)+pcServicesSubtotal(p); }
function pcTruckGroupKey(t){ const fl=Array.isArray(t.flags)?t.flags:[]; const ow=fl.indexOf('Over-width')>=0, oh=fl.indexOf('Over-height')>=0; return t.type+(ow?'|OW':'')+(oh?'|OH':''); }
function pcTruckGroupSan(type,ow,oh){ return ('tr-'+type+(ow?'OW':'')+(oh?'OH':'')).replace(/[^A-Za-z0-9]/g,''); }
function pcTypeSummary(p){ const order={'Double Drop':0,'Stepdeck':1,'Flatbed':2}; const map={};
  (p.trucks||[]).forEach(t=>{ const fl=Array.isArray(t.flags)?t.flags:[]; const ow=fl.indexOf('Over-width')>=0, oh=fl.indexOf('Over-height')>=0;
    const key=pcTruckGroupKey(t);
    const g=(map[key]=map[key]||{key,type:t.type,ow,oh,qty:0,len:0,maxW:0,maxH:0,loadedH:0,amount:0,rates:new Set()});
    g.qty++; g.len+=(t.usedLen||0); g.maxW=Math.max(g.maxW,t.maxW||0); g.maxH=Math.max(g.maxH,t.maxH||0); g.loadedH=Math.max(g.loadedH,t.loadedH||0);
    g.amount+=(Number(t.rate)||0); if(t.rate!==''&&t.rate!=null) g.rates.add(Number(t.rate)); });
  return Object.values(map).sort((a,b)=>{ const oa=order[a.type]==null?9:order[a.type], ob=order[b.type]==null?9:order[b.type];
    if(oa!==ob) return oa-ob; return (a.ow===b.ow)?((a.oh===b.oh)?0:(a.oh?1:-1)):(a.ow?1:-1); }); }

/* LFD helpers */
function pcDaysToLFD(lfd){ if(!lfd) return null; const d=new Date(lfd+'T23:59:59'); return Math.ceil((d-Date.now())/86400000); }
function pcPastLFD(c){ if(!c.lfd || c.returned || c.pulled) return false; return new Date(c.lfd+'T23:59:59') < new Date(); }

function pcToggle(sec){ PC_COLLAPSE[sec]=!PC_COLLAPSE[sec]; const el=document.getElementById('collap-'+sec); if(el && el.classList) el.classList.toggle('closed', PC_COLLAPSE[sec]); }
function pcCollap(sec,title,headRight,body){
  const closed=PC_COLLAPSE[sec]?' closed':'';
  return `<div class="card collap${closed}" id="collap-${sec}">
    <div class="collap-head" onclick="pcToggle('${sec}')">
      <h3 style="margin:0">${title} <span class="chev">▼</span></h3>
      <div class="head-right" onclick="event.stopPropagation()">${headRight||''}</div>
    </div>
    <div class="collap-body" style="margin-top:14px">${body}</div>
  </div>`;
}

/* ---------------- Page: list + detail ---------------- */
function pcProjRepOptions(sel){
  const reps=DB.reps()||[];
  let o=`<option value="all" ${sel==='all'?'selected':''}>All Reps</option>`;
  o+=reps.map(r=>`<option value="${r.u}" ${sel===r.u?'selected':''}>${esc(r.name)}</option>`).join('');
  o+=`<option value="__un" ${sel==='__un'?'selected':''}>Unassigned</option>`;
  return o;
}
function pcRepCell(p){
  const reps=DB.reps()||[];
  const opts=[`<option value="">\u2014 unassigned \u2014</option>`].concat(reps.map(r=>`<option value="${r.u}" ${p.rep===r.u?'selected':''}>${esc(r.name)}</option>`)).join('');
  return `<select class="mini-input" style="min-width:130px" onchange="pcSetProjectRep('${p.id}',this.value)">${opts}</select>`;
}
function pageProjectCenter(){
  if(PC_SUM_OPEN && pcProject(PC_SUM_OPEN)) return pcSummaryBuilderPage(pcProject(PC_SUM_OPEN));
  if(PC_OPEN && pcProject(PC_OPEN)) return pcDetailView(pcProject(PC_OPEN));
  const projs=DB.projects();
  const active=projs.filter(p=>!p.lost).length, lostN=projs.filter(p=>p.lost).length;
  let list=projs.slice();
  if(PC_STATUS==='active') list=list.filter(p=>!p.lost);
  else if(PC_STATUS==='lost') list=list.filter(p=>p.lost);
  if(PC_REP==='__un') list=list.filter(p=>!p.rep);
  else if(PC_REP!=='all') list=list.filter(p=>p.rep===PC_REP);
  const rows=list.map(p=>{
    const pieces=pcAllTrucks(p).reduce((s,t)=>s+((t.items||[]).length),0);
    const past=pcSvc(p,'drayage').filter(pcPastLFD).length;
    return `<tr class="${p.lost?'proj-lost':''}">
      <td><strong>${esc(p.name)}</strong><div style="font-size:11px;color:var(--muted)">${esc(p.origin||'\u2014')} \u2192 ${esc(p.destination||'\u2014')}</div></td>
      <td>${pcRepCell(p)}</td>
      <td>${pcStatusPill(p)}</td>
      <td>${pcAllPackages(p).length} lines / ${pieces} pcs</td>
      <td>${pcAllTrucks(p).length}</td>
      <td>${(pcAllWeight(p)||0).toLocaleString()} lbs</td>
      <td>${pcGrand(p)?pcMoney(pcGrand(p)):'\u2014'}</td>
      <td>${past?`<span class="lfd-alert">${past} past LFD</span>`:'\u2014'}</td>
      <td style="white-space:nowrap">
        <button class="rowbtn" onclick="pcOpen('${p.id}')">Open \u2192</button>
        <button class="rowbtn" onclick="pcToggleLost('${p.id}')">${p.lost?'Reopen':'Lost'}</button>
        <button class="rowbtn del" onclick="pcDeleteProject('${p.id}')">Delete</button>
      </td></tr>`;
  }).join('');
  const sChip=(v,l)=>`<button class="chip ${PC_STATUS===v?'active':''}" onclick="PC_STATUS='${v}';route()">${l}</button>`;
  return `
  <div class="page-title">\uD83C\uDFD7\uFE0F Project Center</div>
  <div class="page-sub">Upload a packing-list Excel and it auto-converts every package's dimensions and builds a truck breakdown. Pick a rep to see only their projects. Track drayage, transloading &amp; crane/rigging, then generate a clean customer summary.</div>
  <div class="card" style="padding:16px 20px;display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end">
    <div><label>Viewing Rep</label><select style="max-width:260px" onchange="PC_REP=this.value;route()">${pcProjRepOptions(PC_REP)}</select></div>
    <div><label>Status</label><div class="filterbar" style="margin:0">${sChip('active','Active ('+active+')')}${sChip('lost','Lost ('+lostN+')')}${sChip('all','All ('+projs.length+')')}</div></div>
  </div>
  <div class="card">
    <div class="card-head"><h3>New Project from Excel</h3></div>
    <div class="card-sub">Reads .xlsx, legacy .xls, or .csv entirely in your browser \u2014 nothing is uploaded anywhere. New projects are assigned to the <strong>Viewing Rep</strong> above (choose a rep first to set the owner).</div>
    <button class="btn btn-primary" style="width:auto" onclick="pcUpload()">\u2B06 Upload Packing List (.xlsx / .xls / .csv)</button>
  </div>
  <div class="card">
    <div class="card-head"><h3>Saved Projects <span style="color:var(--muted);font-weight:500;font-size:13px">(${list.length})</span></h3></div>
    <div class="table-wrap"><table style="min-width:1000px">
      <thead><tr><th>Project</th><th>Owner (Rep)</th><th>Status</th><th>Packages</th><th>Trucks</th><th>Total Weight</th><th>Quoted</th><th>LFD</th><th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan="9" class="empty">No projects for this rep / status. Upload a packing list or change the filters above.</td></tr>'}</tbody>
    </table></div>
  </div>`;
}
function pcOpen(id){ PC_OPEN=id; PC_SUM_OPEN=null; route(); window.scrollTo(0,0); }
function pcBackToList(){ PC_OPEN=null; route(); window.scrollTo(0,0); }
function pcDeleteProject(id){ if(!confirm('Delete this project? This cannot be undone.')) return;
  DB.saveProjects(DB.projects().filter(p=>p.id!==id)); if(PC_OPEN===id) PC_OPEN=null; route(); toast('Project deleted'); }

    <div class="form-row three">

    </div>

    <div class="form-row">
      <div class="field-c"><label>Lane Origin${many?(' \u2014 '+esc(laneName)):''}</label><input value="${esc(ln.origin||'')}" ${isAll?'disabled':''} placeholder="Pickup city, ST" onchange="pcSetLaneField('${p.id}','${ln.id}','origin',this.value)"></div>
      <div class="field-c"><label>Lane Destination</label><input value="${esc(ln.destination||'')}" ${isAll?'disabled':''} placeholder="Delivery city, ST" onchange="pcSetLaneField('${p.id}','${ln.id}','destination',this.value)"></div>
    </div>`;
}
function pcTrucksBody(p){
  if(p.awarded) return pcTrucksTrackBody(p);
  const truckRows=(p.trucks||[]).map(t=>{
    const cfg=PC_TRUCKS[t.type]||{deckLen:0};
    const manual=!!t.manual;
    const flags=t.flags&&t.flags.length?`<div style="margin-top:3px">${t.flags.map(f=>`<span class="pill loss">${f}</span>`).join(' ')}</div>`:'';
    const typeCell = manual
      ? `<select class="mini-input" style="min-width:120px" onchange="pcTruckType('${p.id}','${t.id}',this.value)">${['Double Drop','Stepdeck','Flatbed'].map(tt=>`<option ${t.type===tt?'selected':''}>${tt}</option>`).join('')}</select> <span class="pill vol">manual</span>`
      : `<span class="pill type">${t.type}</span>${flags}`;
    const pkgs=manual?'\u2014':t.items.length;
    const lenU=manual?'\u2014':`${inchesToFtIn(t.usedLen)} <span style="color:var(--muted);font-size:11px">/ ${inchesToFtIn(cfg.deckLen)}</span>`;
    const mw=manual?'\u2014':inchesToFtIn(t.maxW);
    const mh=manual?'\u2014':`${inchesToFtIn(t.maxH)} <span style="color:var(--muted);font-size:11px">(load ${inchesToFtIn(t.loadedH)})</span>`;
    const wt=manual?'\u2014':`${Math.round(t.weight).toLocaleString()} lbs`;
    return `<tr>
      <td><strong>${t.id}</strong></td>
      <td>${typeCell}</td>
      <td>${pkgs}</td>
      <td>${lenU}</td>
      <td>${mw}</td>
      <td>${mh}</td>
      <td>${wt}</td>
      <td><div style="display:flex;align-items:center;gap:4px">
        <span style="color:var(--muted)">$</span>
        <input type="number" min="0" step="0.01" class="mini-num" style="width:96px" value="${t.rate!==''&&t.rate!=null?t.rate:''}" placeholder="0.00" onchange="pcSetTruckRate('${p.id}','${t.id}',this.value)">
        <button class="rowbtn" title="Copy this rate to all ${t.type} trucks" onclick="pcCopyRateToType('${p.id}','${t.id}')">\u2398 type</button>
      </div></td>
      <td>${manual?`<button class="rowbtn del" title="Remove manual truck" onclick="pcTruckDel('${p.id}','${t.id}')">\u2715</button>`:''}</td>
    </tr>`;
  }).join('');
  const typeSum=pcTypeSummary(p).map(s=>{
    const uniform = s.rates.size===1 ? [...s.rates][0] : '';
    const inputId=pcTruckGroupSan(s.type,s.ow,s.oh);
    const flagPills=(s.ow?'<span class="pill loss" style="margin-left:4px">Over-width</span>':'')+(s.oh?'<span class="pill loss" style="margin-left:4px">Over-height</span>':'');
    return `<tr>
      <td><span class="pill type">${s.type}</span>${flagPills}</td>
      <td>${s.qty}</td>
      <td>${inchesToFtIn(s.len)}</td>
      <td>${inchesToFtIn(s.maxW)}</td>
      <td>${inchesToFtIn(s.maxH)} <span style="color:var(--muted);font-size:11px">(load ${inchesToFtIn(s.loadedH)})</span></td>
      <td>${s.amount?pcMoney(s.amount):'\u2014'}</td>
      <td><div class="copy-rate-wrap"><span style="color:var(--muted)">$</span>
        <input type="number" min="0" step="0.01" class="mini-num" id="${inputId}" value="${uniform!==''?uniform:''}" placeholder="rate / truck">
        <button class="rowbtn" onclick="pcApplyGroupRate('${p.id}','${s.type}',${s.ow?1:0},${s.oh?1:0})">Apply to all ${s.qty}</button>
        <button class="rowbtn" style="background:#e3f6e9;color:var(--green)" title="Use the pricing tool to price one ${s.type} truck, then apply to all ${s.qty}" onclick="openGetPriceTruckType('${p.id}','${jsq(s.type)}',${s.ow?1:0},${s.oh?1:0})">💲 Pricing Tool</button>
      </div></td>
    </tr>`;
  }).join('');
  return `
    <div class="card-sub">Height sets the trailer type (Flatbed \u2264 8'6\", Stepdeck \u2264 9'6\", Double Drop above); packages are packed by deck length and payload (Stepdeck maxes at 44,000 lb; Flatbed &amp; Double Drop at 48,000 lb). Enter a <strong>rate per truck</strong>, use <strong>Apply to all</strong>, or <strong>\uFF0B Add Truck</strong> to add one manually.</div>
    <div class="table-wrap"><table style="min-width:940px">
      <thead><tr><th>Truck</th><th>Type</th><th>Pkgs</th><th>Length Used</th><th>Max W</th><th>Max H</th><th>Weight</th><th style="width:230px">Rate / Truck</th><th></th></tr></thead>
      <tbody>${truckRows||'<tr><td colspan="9" class="empty">No trucks.</td></tr>'}</tbody>
    </table></div>
    <div style="text-align:right;margin-top:10px;font-weight:700;color:var(--ink)">Truck Subtotal (this page): ${pcMoney(pcTruckSubtotalPage(p))}</div>
    <div style="margin-top:16px"><h3 style="font-size:14px;color:var(--ink);margin-bottom:8px">Truck Type Summary &amp; Quick Pricing</h3>
      <div class="table-wrap"><table style="min-width:640px">
        <thead><tr><th>Type</th><th># Trucks</th><th>Total Length</th><th>Max W</th><th>Max H</th><th>Amount</th><th>Copy Rate to Group</th></tr></thead>
        <tbody>${typeSum||'<tr><td colspan="7" class="empty">\u2014</td></tr>'}</tbody>
      </table></div>
    </div>`;
}
function pcDrayageBody(p){
  if(!p.awarded) return pcDrayageQuoteBody(p);
  const list=pcSvc(p,'drayage');
  const past=list.filter(pcPastLFD);
  const banner = past.length? `<div class="alert-box danger"><h4>\u23F0 Past Last Free Day <span class="age-badge">${past.length}</span></h4>
      <div class="a-sub">These containers are past LFD and may be accruing per-diem / demurrage. Marking <strong>Pulled</strong> or <strong>Returned</strong> clears the flag.</div>
      ${past.map(c=>`<div style="font-size:13px">\u2022 <strong>${esc(c.containerNo||'(no #)')}</strong> at ${esc(c.portArrival||'port')} \u2014 LFD ${esc(c.lfd)} (${Math.abs(pcDaysToLFD(c.lfd))} day(s) over)${c.note?` \u2014 <em>${esc(c.note)}</em>`:''}</div>`).join('')}</div>` : '';
  const rows=list.map(c=>{
    const past=pcPastLFD(c); const d2=pcDaysToLFD(c.lfd);
    const lfdBadge = c.lfd ? (past?`<div><span class="lfd-alert">PAST LFD ${Math.abs(d2)}d</span></div>` : (d2!=null&&d2<=3?`<div><span class="hold-flag">LFD in ${d2}d</span></div>`:'')) : '';
    const holdBadge = c.hold?`<span class="hold-flag" title="Hold on container">\u2691 HOLD</span>`:'';
    const noteLine = c.note?`<div style="font-size:11px;color:var(--muted);margin-top:3px">\uD83D\uDCDD ${esc(c.note)}</div>`:'';
    const cls = (c.hold?'cont-hold ':'')+(past?'cont-lfd':'');
    const chk=(field,label)=>`<label class="chk-cell"><input type="checkbox" ${c[field]?'checked':''} onchange="pcDrayChk('${p.id}','${c.id}','${field}',this.checked)">${label}</label>`;
    return `<tr class="${cls}">
      <td style="min-width:150px"><input class="mini-input" value="${esc(c.containerNo||'')}" placeholder="Container #" onchange="pcDrayField('${p.id}','${c.id}','containerNo',this.value)">${holdBadge?('<div style="margin-top:4px">'+holdBadge+'</div>'):''}${noteLine}</td>
      <td><input class="mini-input" value="${esc(c.portArrival||'')}" placeholder="Port of arrival" onchange="pcDrayField('${p.id}','${c.id}','portArrival',this.value)"></td>
      <td><input class="mini-input" value="${esc(c.transloadFacility||'')}" placeholder="Transload facility" onchange="pcDrayField('${p.id}','${c.id}','transloadFacility',this.value)"></td>
      <td><input class="mini-input" value="${esc(c.mbl||'')}" placeholder="MBL #" onchange="pcDrayField('${p.id}','${c.id}','mbl',this.value)"></td>
      <td style="min-width:150px"><input type="date" class="mini-input" value="${esc(c.lfd||'')}" onchange="pcDrayField('${p.id}','${c.id}','lfd',this.value)">${lfdBadge}</td>
      <td>${chk('arrivedPort','Arr Port')}</td>
      <td>${chk('discharged','Disch')}</td>
      <td>${chk('hold','Hold')}</td>
      <td>${chk('pulled','Pulled')}</td>
      <td>${chk('returned','Return')}</td>
      <td><div style="display:flex;align-items:center;gap:4px"><span style="color:var(--muted)">$</span><input type="number" min="0" step="0.01" class="mini-num" style="width:96px" value="${c.rate!=null&&c.rate!==''?c.rate:''}" placeholder="0.00" onchange="pcDrayField('${p.id}','${c.id}','rate',this.value)"></div></td>
      <td><button class="rowbtn" title="Add / edit note" onclick="pcContainerNotePrompt('${p.id}','${c.id}')">\uD83D\uDCDD</button><button class="rowbtn del" onclick="pcDrayDel('${p.id}','${c.id}')">\u2715</button></td>
    </tr>`;
  }).join('');
  return `
    ${banner}
    <div class="card-sub">Live container tracking. Set port of arrival, transload facility, MBL &amp; <strong>LFD</strong>; check milestones as the container moves. <strong>Hold</strong> flags the line; past <strong>LFD</strong> raises an alert that clears once you mark <strong>Pulled</strong> or <strong>Returned</strong>. Use \uD83D\uDCDD to add a note.</div>
    <div class="table-wrap"><table style="min-width:1220px">
      <thead><tr><th>Container #</th><th>Port of Arrival</th><th>Transload Facility</th><th>MBL</th><th>Last Free Day</th><th>Arrival<br>to Port</th><th>Discharged</th><th>Hold</th><th>Pulled</th><th>Returned</th><th style="width:130px">Rate / Container</th><th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan="12" class="empty">No containers yet. Click \u201C\uFF0B Add Container\u201D.</td></tr>'}</tbody>
    </table></div>
    <div style="text-align:right;margin-top:10px;font-weight:700;color:var(--ink)">Drayage Subtotal: ${pcMoney(pcDrayageSubtotal(p))}</div>`;
}
function pcContainerOptions(p, sel){
  const nums=pcSvc(p,'drayage').map(c=>c.containerNo).filter(Boolean);
  const uniq=[...new Set(nums)]; if(sel && !uniq.includes(sel)) uniq.push(sel);
  return ['<option value="">— container —</option>'].concat(uniq.map(n=>`<option ${sel===n?'selected':''}>${esc(n)}</option>`)).join('');
}

      <td><div style="display:flex;align-items:center;gap:4px"><span style="color:var(--muted)">$</span><input type="number" min="0" step="0.01" class="mini-num" style="width:96px" value="${it.rate!=null&&it.rate!==''?it.rate:''}" placeholder="0.00" onchange="pcTransField('${p.id}',${idx},'rate',this.value)"></div></td>

      <thead><tr><th>Container #</th><th>Scope / Notes</th><th style="width:80px">Qty</th><th style="width:150px">Rate / Item</th><th style="width:120px">Line Total</th><th style="width:44px"></th></tr></thead>
      <tbody>${rows||'<tr><td colspan="6" class="empty">No transloading lines yet. Add one, or pull from Drayage.</td></tr>'}</tbody>

    <div style="text-align:right;margin-top:10px;font-weight:700;color:var(--ink)">Transloading Subtotal: ${pcMoney(pcTransSubtotal(p))}</div>`;

function pcCraneBody(p){
  const list=pcSvc(p,'craneRigging');
  const cards=list.map(it=>{
    if(!it.id) it.id=pcUID('cr');
    if(!it.kind) return pcCrLegacyCard(p,it);
    if(it.kind==='storage') return pcCrStorageCard(p,it);
    return pcCrCraneForkCard(p,it);
  }).join('');
  return `
    <div class="card-sub">Add a specialized-services line and choose its type: <strong>Crane &amp; Rigging</strong>, <strong>Forklift / Material Handling</strong>, or <strong>Storage</strong>. Each line has detailed cost inputs, a <strong>margin %</strong>, and a live finalized rate — only the finalized rate is shown to the customer.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      <button class="btn btn-primary" style="width:auto" onclick="pcCrAdd('${p.id}','crane')">\uD83C\uDFD7\uFE0F ＋ Crane &amp; Rigging</button>
      <button class="btn btn-primary" style="width:auto" onclick="pcCrAdd('${p.id}','forklift')">\uD83D\uDE9C ＋ Forklift / Material Handling</button>
      <button class="btn btn-primary" style="width:auto" onclick="pcCrAdd('${p.id}','storage')">\uD83D\uDCE6 ＋ Storage</button>
    </div>
    ${cards||'<div class="empty">No specialized-services lines yet. Add one above.</div>'}
    <div style="text-align:right;margin-top:12px;font-weight:700;color:var(--ink)">Specialized Services Subtotal: ${pcMoney(pcCraneSubtotal(p))}</div>`;
}
function pcCrMarginBlock(p,it){
  if(!it.kind) return '';
  const def=Number(it.margin)||0;
  const secs=pcCrActiveSections(it).filter(([k])=>pcCrSectionCost(it,k)>0);
  const rows=secs.map(([k,label])=>{
    const cost=pcCrSectionCost(it,k), pct=pcCrMarginFor(it,k), fin=cost*(1+pct/100);
    const o=it.margins||{}; const override=(o[k]!=null&&o[k]!=='');
    return `<tr>
      <td style="padding:5px 8px">${label}${override?'':' <span style="color:var(--muted);font-size:11px">(default)</span>'}</td>
      <td style="padding:5px 8px;text-align:right;color:var(--muted)">${pcMoney(cost)}</td>
      <td style="padding:5px 8px;text-align:center"><div style="display:inline-flex;align-items:center;gap:2px"><input type="number" min="0" step="any" inputmode="decimal" class="mini-num" style="width:72px" value="${override?o[k]:''}" placeholder="${def}" title="Blank = use the default ${def}%" onchange="pcCrSetSecMargin('${p.id}','${it.id}','${k}',this.value)"><span style="color:var(--muted);font-size:11px">%</span></div></td>
      <td style="padding:5px 8px;text-align:right;font-weight:700">${pcMoney(fin)}</td>
    </tr>`;
  }).join('');
  const cost=pcCrItemCost(it), fin=pcCrItemTotal(it);

/* ---- Crane/Rigging/Storage handlers ---- */
function pcCrAdd(id,kind){ const p=pcProject(id); if(!p)return;
  const base={ id:pcUID('cr'), kind, address:'', scope:'', startDate:'', products:[], days:'', mobIn:'', mobOut:'', margin:'',
    riggers:'', rigRate:'', rigMin:8, rigOtHours:'', rigOtRate:'', perDiemRate:'' };
  if(kind==='crane'){ Object.assign(base,{craneMode:'crane', craneType:'', pickRadius:'', contractRate:'', opRate:'', opMin:8, opOtHours:'', opOtRate:'', riggingFee:'', customs:[], margins:{}}); }
  if(kind==='forklift'){ Object.assign(base,{forklifts:[{size:'',count:'',opRate:'',opMin:8,otHours:'',otRate:''}]}); }
  if(kind==='storage'){ Object.assign(base,{ units:'', duration:'', storageType:'Indoor', location:'',
    arriveTrailer:'', arriveQty:'', departTrailer:'', departQty:'', ratePeriod:'monthly', storageRate:'', handleIn:'', handleOut:'' }); }
  pcSvc(p,'craneRigging').push(base); pcSaveProject(p); route(); toast(pcCrKindLabel(kind)+' line added'); }
function pcCrItem(p,itemId){ return pcSvc(p,'craneRigging').find(x=>x.id===itemId); }
const PC_CR_NUM=['days','mobilization','mobIn','mobOut','margin','contractRate','opRate','opMin','opOtHours','opOtRate','riggers','rigRate','rigMin','rigOtHours','rigOtRate','riggingFee','perDiemRate','duration','storageRate','handleIn','handleOut','units','arriveQty','departQty'];
function pcCrField(id,itemId,field,value){ const p=pcProject(id); if(!p)return; const it=pcCrItem(p,itemId); if(!it)return;
  it[field]= PC_CR_NUM.includes(field) ? (value===''?'':Number(value)) : value;
  pcSaveProject(p); route(); }
/* Margin — accept ANY percentage the rep types. Strips %/commas/spaces, keeps decimals, clamps ≥0. */
function pcCrSetMargin(id,itemId,value){ const p=pcProject(id); if(!p)return; const it=pcCrItem(p,itemId); if(!it)return;
  const raw=String(value==null?'':value).replace(/[%,\s]/g,'').trim();
  if(raw===''){ it.margin=''; } else { let n=parseFloat(raw); if(isNaN(n)) n=0; if(n<0) n=0; it.margin=n; }
  pcSaveProject(p); route(); toast('Default margin set to '+(it.margin===''?'0':it.margin)+'%'); }
/* Per-section margin — blank clears the override (section falls back to the item default). */
function pcCrSetSecMargin(id,itemId,mkey,value){ const p=pcProject(id); if(!p)return; const it=pcCrItem(p,itemId); if(!it)return;
  it.margins=it.margins||{};
  const raw=String(value==null?'':value).replace(/[%,\s]/g,'').trim();
  if(raw===''){ delete it.margins[mkey]; } else { let n=parseFloat(raw); if(isNaN(n)) n=0; if(n<0) n=0; it.margins[mkey]=n; }
  pcSaveProject(p); route(); }
/* ===== Per-service itemized breakdown (rep-facing) ===== */
function pcCrBreakdownText(it){
  const L=[]; L.push(pcCrKindLabel(it.kind)+(pcCrIsJackSlide(it)?' (Jack & Slide)':'')); if(it.address) L.push('Site: '+it.address);
  L.push('-------------------------------------------');
  const comps=pcCrComponentsFinal(it);
  if(!comps.length){ L.push('(no priced line items yet)'); }
  comps.forEach(c=>{ L.push(c.label); L.push('   cost '+pcMoney(c.cost)+'  +'+c.pct+'%  =  '+pcMoney(c.amount)); });
  L.push('-------------------------------------------');
  L.push('Internal Cost:   '+pcMoney(pcCrItemCost(it)));
  L.push('Margin:          '+pcMoney(pcCrItemMargin(it)));
  L.push('FINALIZED RATE:  '+pcMoney(pcCrItemTotal(it)));
  return L.join('\n');
}
function pcCrBreakdown(id,itemId){ const p=pcProject(id); if(!p)return; const it=pcCrItem(p,itemId); if(!it)return;

  box.innerHTML=`<h3>📋 ${esc(pcCrKindLabel(it.kind))} — Breakdown${pcCrIsJackSlide(it)?' <span class="pill" style="background:#fef3c7;color:#92400e">Jack &amp; Slide</span>':''}</h3>
    <div class="card-sub" style="margin-bottom:10px">${it.address?('Site: '+esc(it.address)+' · '):''}Every priced line item with its cost, margin, and finalized rate. The <strong>Finalized</strong> column is what appears on the customer summary.</div>

      <table style="width:100%;border-collapse:collapse;font-size:14px">
        <thead><tr style="background:#eef2f8;color:#0b2545"><th style="text-align:left;padding:7px 8px">Line Item</th><th style="text-align:right;padding:7px 8px">Cost</th><th style="text-align:center;padding:7px 8px">Margin</th><th style="text-align:right;padding:7px 8px">Finalized</th></tr></thead>

          <tr><td colspan="3" style="text-align:right;padding:6px 8px;color:var(--muted)">Total Margin</td><td style="text-align:right;padding:6px 8px;color:var(--muted)">${pcMoney(marg)}</td></tr>

    <div class="modal-actions">
      <button class="btn btn-ghost" style="width:auto" onclick="closeModal()">Close</button>
      <button class="btn btn-primary" style="width:auto" onclick="pcCrCopyBreakdown('${p.id}','${it.id}')">📋 Copy Breakdown</button>
    </div>`;
  document.getElementById('modalBg').classList.add('show');
}
function pcCrCopyBreakdown(id,itemId){ const p=pcProject(id); if(!p)return; const it=pcCrItem(p,itemId); if(!it)return;
  const txt=pcCrBreakdownText(it);
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>toast('Breakdown copied')); }
  else { const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Breakdown copied'); } }

/* ---------------- Handlers ---------------- */
function pcField(id,field,value){ const p=pcProject(id); if(!p)return; p[field]=value; pcSaveProject(p); if(field==='name')route(); toast('Saved'); }
function pcSetTruckRate(id,truckId,value){ const p=pcProject(id); if(!p)return; const t=(p.trucks||[]).find(x=>x.id===truckId); if(!t)return; t.rate=value===''?'':Number(value); pcSaveProject(p); route(); }
function pcApplyTypeRate(id,type){ const p=pcProject(id); if(!p)return; const el=document.getElementById('tr-'+type.replace(/\s/g,'')); const v=el?el.value:''; const rate=v===''?'':Number(v);
  (p.trucks||[]).forEach(t=>{ if(t.type===type) t.rate=rate; }); pcSaveProject(p); route(); toast('Applied to all '+type+' trucks'); }
function pcApplyGroupRate(id,type,ow,oh){ const p=pcProject(id); if(!p)return; ow=!!ow; oh=!!oh;
  const el=document.getElementById(pcTruckGroupSan(type,ow,oh)); const v=el?el.value:''; const rate=v===''?'':Number(v);
  let n=0; (p.trucks||[]).forEach(t=>{ const fl=Array.isArray(t.flags)?t.flags:[]; const tow=fl.indexOf('Over-width')>=0, toh=fl.indexOf('Over-height')>=0;
    if(t.type===type && tow===ow && toh===oh){ t.rate=rate; n++; } });
  pcSaveProject(p); route();
  const lbl=type+(ow?' Over-width':'')+(oh?' Over-height':'');
  toast('Applied to '+n+' '+lbl+' truck'+(n===1?'':'s')); }
function pcCopyRateToType(id,truckId){ const p=pcProject(id); if(!p)return; const src=(p.trucks||[]).find(t=>t.id===truckId); if(!src)return;
  if(src.rate===''||src.rate==null){ toast('Enter a rate on '+truckId+' first'); return; }
  let n=0; (p.trucks||[]).forEach(t=>{ if(t.type===src.type){ t.rate=src.rate; n++; } }); pcSaveProject(p); route(); toast('Copied '+pcMoney(src.rate)+' to '+n+' '+src.type+' trucks'); }

let PC_TRUCK_FILTER='all';
function pcTruckFlagsArr(t){ return Array.isArray(t.flags)?t.flags:[]; }
function pcTruckMatches(t){
  const f=PC_TRUCK_FILTER; if(f==='all') return true;
  if(f==='ow') return pcTruckFlagsArr(t).indexOf('Over-width')>=0;
  if(f==='oh') return pcTruckFlagsArr(t).indexOf('Over-height')>=0;
  if(f==='ol') return pcTruckFlagsArr(t).indexOf('Over-length')>=0;
  if(f==='manual') return !!t.manual;
  return t.type===f;
}

function pcAllTrucksRows(p){

  else { (p.trucks||[]).forEach(t=>out.push({page:{name:(p.sourceSheet||'Sheet 1')},lane:{label:''},t})); }

}

let PC_ADDPAGE_ID=null;
function pcAddPagePrompt(id){ PC_ADDPAGE_ID=id; const el=document.getElementById('pcAddPageFile'); if(el) el.click(); }
document.getElementById('pcAddPageFile').addEventListener('change', function(e){
  const f=e.target.files[0]; this.value=''; if(!f||!PC_ADDPAGE_ID) return;
  const pid=PC_ADDPAGE_ID; const r=new FileReader();
  r.onload=async ()=>{ try{
    const sheets=await readWorkbook(r.result,f.name);
    const p=pcProject(pid); if(!p){ return; } pcSyncActiveSheet(p);
    if(!Array.isArray(p.pkgSheets)) p.pkgSheets=[];
    let added=0;
    sheets.forEach(s=>{ const det=pcDetectAny(s.rows); if(!det) return; const pkgs=pcExtract2(s.rows,det); if(!pkgs.length) return;
      const trucks=pcBuildTrucks(pkgs); const totalWeight=pkgs.reduce((a,x)=>a+(x.weight||0)*(parseInt(x.qty)||1),0);
      const tgtLane=(p.activeLaneId&&p.activeLaneId!=='all')?p.activeLaneId:'base';
      const tln=(p.lanes||[]).find(l=>l.id===tgtLane);
      p.pkgSheets.push({ name:s.name, packages:pkgs, trucks, totalWeight, dimUnit:det.dimUnit, wtUnit:det.wtUnit, laneId:tgtLane, laneLabel:(tln&&tln.id!=='base')?(tln.label||''):'' }); added++; });
    if(!added){ alert('No packing-list pages with L\u00d7W\u00d7H found in that file.'); return; }
    p.activeSheet=p.pkgSheets.length-1; pcSyncActiveSheet(p); pcSaveProject(p); route();
    toast('Added '+added+' page'+(added>1?'s':'')+' from '+f.name);
  }catch(err){ console.error(err); alert('Could not read that file. ('+err.message+')'); } };
  r.readAsArrayBuffer(f);
});
function pcDeletePage(id){ const p=pcProject(id); if(!p)return;
  if(!Array.isArray(p.pkgSheets)||p.pkgSheets.length<=1){ toast('This project has only one page.'); return; }
  if(p.activeSheet==='all'){ toast('Pick a specific page tab to delete.'); return; }
  const a=parseInt(p.activeSheet)||0; const nm=(p.pkgSheets[a]||{}).name||('Page '+(a+1));
  if(!confirm('Delete page \u201C'+nm+'\u201D? Its trucks & packing list are removed from this project.')) return;
  p.pkgSheets.splice(a,1);
  if(Array.isArray(p.lanes)){ p.lanes=p.lanes.filter(l=> l.id==='base' || (p.pkgSheets||[]).some(s=>(s.laneId||'base')===l.id)); }
  p.activeSheet=Math.max(0,a-1); pcSyncActiveSheet(p); pcSaveProject(p); route(); toast('Page deleted'); }
function pcCopyPageForLane(id){ const p=pcProject(id); if(!p)return; pcEnsureLanes(p); pcSyncActiveSheet(p);
  if(!Array.isArray(p.pkgSheets)||!p.pkgSheets.length){ toast('Nothing to copy yet.'); return; }
  const srcLaneId=(p.activeLaneId&&p.activeLaneId!=='all')?p.activeLaneId:'base';
  const srcPages=pcPagesInLane(p,srcLaneId);
  if(!srcPages.length){ toast('No pages in the current lane to copy.'); return; }
  const o=prompt('New lane \u2014 ORIGIN (pickup city, ST):', p.origin||''); if(o===null) return;
  const d=prompt('New lane \u2014 DESTINATION (delivery city, ST):', p.destination||''); if(d===null) return;

  const laneId=pcUID('lane');

  const clones=srcPages.map(x=>{ const clone=JSON.parse(JSON.stringify(x.sheet));
    clone.laneId=laneId; clone.laneLabel=label;
    (clone.trucks||[]).forEach(t=>{ t.loaded=false; t.delivered=false; t.pickupDate=''; t.deliveryDate=''; t.lane=label; });
    return clone; });
  const insertAt=p.pkgSheets.length;
  p.pkgSheets.splice(insertAt,0,...clones);
  p.activeLaneId=laneId; p.activeSheet=insertAt; pcSyncActiveSheet(p); pcSaveProject(p); route();
  toast('New lane \u201C'+label+'\u201D created with '+clones.length+' page'+(clones.length>1?'s':''));
}

function pcBuildSummaryText(p,cfg){ cfg=cfg||PC_SUM_CFG||pcSumCfgDefault(p); pcEnsureLanes(p);
  const L=[]; if(cfg.header){ L.push(p.name); if(p.contract) L.push('Reference: '+p.contract); if(cfg.lane&&(p.origin||p.destination)) L.push('Lane: '+(p.origin||'\u2014')+'  \u2192  '+(p.destination||'\u2014')); L.push('==========================================='); }
  if(cfg.trucks!=='off'){ const tt=pcTruckSubtotal(p);
    if(cfg.trucks==='totals'){ if(pcAllTrucks(p).length||tt){ L.push(''); L.push('Transportation:      '+pcMoney(tt)); } }
    else if(cfg.trucks==='bylane' && Array.isArray(p.pkgSheets)&&p.pkgSheets.length>1){ L.push(''); L.push('TRANSPORTATION \u2014 BY LANE'); L.push('-------------------------------------------');
      (p.lanes||[]).forEach(l=>{ const trucks=pcLaneTrucks(p,l.id); if(!trucks.length) return; L.push('LANE: '+(l.label||'Base Lane')+'  ('+trucks.length+' truck'+(trucks.length===1?'':'s')+')');
        pcLaneTypeSummary(trucks).forEach(g=>{ const u=g.rates.size===1?[...g.rates][0]:null; L.push('   '+g.type+'  x'+g.qty+(u!=null?('  @ '+pcMoney(u)+'  =  '+pcMoney(g.amount)):(g.amount?('  =  '+pcMoney(g.amount)):'  (TBD)'))); });
        L.push('   Lane Total: '+pcMoney(pcLaneTruckSubtotal(trucks))); });
      L.push('Transportation Subtotal: '+pcMoney(tt)); }
    else { L.push(''); L.push('TRANSPORTATION \u2014 TRUCK BREAKDOWN'); L.push('-------------------------------------------');
      pcTypeSummaryAll(p).forEach(g=>{ const u=g.rates.size===1?[...g.rates][0]:null; const fl=pcFlagList(g);
        L.push('   '+g.type+(fl.length?(' ('+fl.join(', ')+')'):'')+'  x'+g.qty+(u!=null?('  @ '+pcMoney(u)+'  =  '+(g.amount?pcMoney(g.amount):'TBD')):(g.amount?('  =  '+pcMoney(g.amount)):'  (TBD)'))); });
      L.push('Transportation Subtotal: '+pcMoney(tt)); } }
  if(cfg.drayage!=='off' && pcSvc(p,'drayage').length){ if(cfg.drayage==='totals'){ L.push(''); L.push('Drayage:             '+pcMoney(pcDrayageSubtotal(p))); } else pcDetailDrayageText(p).forEach(x=>L.push(x)); }
  if(cfg.transloading!=='off' && pcSvc(p,'transloading').length){ if(cfg.transloading==='totals'){ L.push(''); L.push('Transloading:        '+pcMoney(pcTransSubtotal(p))); } else pcDetailTransText(p).forEach(x=>L.push(x)); }
  if(cfg.specialized!=='off' && pcSvc(p,'craneRigging').length){
    if(cfg.specialized==='totals'){ L.push(''); L.push('Specialized Services: '+pcMoney(pcCraneSubtotal(p))); }
    else if(cfg.specialized==='lineitems'){ L.push(''); L.push('SPECIALIZED SERVICES'); L.push('-------------------------------------------'); pcSvc(p,'craneRigging').forEach(it=>{ L.push('   \u25AA '+pcCrCustLabel(it)+':  '+pcMoney(pcCrItemTotal(it))); }); L.push('   Specialized Services Subtotal: '+pcMoney(pcCraneSubtotal(p))); }
    else pcDetailCraneText(p).forEach(x=>L.push(x)); }
  if(cfg.grandTotal){ L.push(''); L.push('==========================================='); L.push('PROJECT TOTAL:       '+pcMoney(pcGrand(p))); }
  if(cfg.notes){ const n=pcNoteText(p); if(n) L.push(n); }
  if(cfg.disclaimer){ L.push(''); L.push('Total price for all services as listed. Permits, escorts, and detention billed at cost unless otherwise noted.'); }
  return L.join('\n');
}

function pcTypeSummaryAll(p){
  const order={'Double Drop':0,'Stepdeck':1,'Flatbed':2}; const map={};
  pcAllTrucks(p).forEach(t=>{ const fl=Array.isArray(t.flags)?t.flags:[];
    const ow=fl.indexOf('Over-width')>=0, oh=fl.indexOf('Over-height')>=0, ol=fl.indexOf('Over-length')>=0;
    const key=t.type+(ow?'|OW':'')+(oh?'|OH':'')+(ol?'|OL':'');
    const g=(map[key]=map[key]||{key,type:t.type,ow,oh,ol,qty:0,amount:0,rates:new Set()});
    g.qty++; g.amount+=(Number(t.rate)||0); if(t.rate!==''&&t.rate!=null) g.rates.add(Number(t.rate)); });
  return Object.values(map).sort((a,b)=>{ const oa=order[a.type]==null?9:order[a.type], ob=order[b.type]==null?9:order[b.type];
    if(oa!==ob) return oa-ob; return (a.ow===b.ow)?((a.oh===b.oh)?((a.ol===b.ol)?0:(a.ol?1:-1)):(a.oh?1:-1)):(a.ow?1:-1); });
}

function extractAux(parsed){
  if(!parsed || typeof parsed!=='object' || Array.isArray(parsed)) return null;
  const aux={};
  if(Array.isArray(parsed.nses))      aux.nses=parsed.nses;
  if(Array.isArray(parsed.reps))      aux.reps=parsed.reps;

  if(parsed.repprospects && typeof parsed.repprospects==='object') aux.repprospects=parsed.repprospects;
  if(parsed.nsemeta   && typeof parsed.nsemeta==='object')   aux.nsemeta=parsed.nsemeta;
  if(parsed.customers && typeof parsed.customers==='object') aux.customers=parsed.customers;
  if(Array.isArray(parsed.projects)) aux.projects=parsed.projects;
  if(Array.isArray(parsed.opps)) aux.opps=parsed.opps;

function countAuxItems(aux){
  let n=0;
  if(Array.isArray(aux.nses)) n+=aux.nses.length;
  if(Array.isArray(aux.reps)) n+=aux.reps.length;

  if(aux.repprospects) Object.values(aux.repprospects).forEach(a=>{ n+=(Array.isArray(a)?a.length:0); });
  if(aux.nsemeta)   Object.values(aux.nsemeta).forEach(o=>{ n+=Object.keys(o||{}).length; });
  if(aux.customers) n+=Object.keys(aux.customers).length;
  if(Array.isArray(aux.projects)) n+=aux.projects.length;

/* ---- Fold one file's NSE Tools data into the staging accumulator (no DB writes) ---- */
function mergeAuxIntoStaging(aux){
  const A=IMPORT_PREVIEW.aux;
  (aux.nses||[]).forEach(n=>{ if(n && n.u) A.nses[n.u]=Object.assign({}, A.nses[n.u], n); });
  (aux.reps||[]).forEach(r=>{ if(r && r.u) A.reps[r.u]=Object.assign({}, A.reps[r.u], r); });
  if(aux.prospects) Object.keys(aux.prospects).forEach(nseU=>{
    A.prospects[nseU]=A.prospects[nseU]||{};
    (aux.prospects[nseU]||[]).forEach(p=>{ if(p && p.id) A.prospects[nseU][p.id]=p; });
  });
  if(aux.repprospects) Object.keys(aux.repprospects).forEach(repU=>{
    A.repprospects[repU]=A.repprospects[repU]||{};
    (aux.repprospects[repU]||[]).forEach(p=>{ if(p && p.id) A.repprospects[repU][p.id]=p; });
  });
  if(aux.nsemeta) Object.keys(aux.nsemeta).forEach(nseU=>{
    A.nsemeta[nseU]=Object.assign({}, A.nsemeta[nseU], aux.nsemeta[nseU]);
  });
  if(aux.customers) Object.assign(A.customers, aux.customers);
  (aux.projects||[]).forEach(pr=>{ if(pr && pr.id) A.projects[pr.id]=pr; });
  (aux.opps||[]).forEach(op=>{ if(op && op.id) A.opps[op.id]=op; });
  (aux.oppOffices||[]).forEach(off=>{ if(off) A.oppOffices[off]=true; });
}

/* ---- Normalize one JSON object into a clean quote record ---- */
function jsonToQuote(obj){
  const reps=DB.reps()||[];
  const repByName=n=>{ const r=reps.find(x=>x.name.toLowerCase()===(n||'').toLowerCase()); return r?r.u:''; };
  const s=v=>(v==null?undefined:String(v).trim());
  let rep=s(obj.rep); if((!rep || !reps.find(x=>x.u===rep)) && obj.repName) rep=repByName(s(obj.repName)) || rep || '';
  const patch={
    office:s(obj.office),
    customerName:s(obj.customerName), subject:s(obj.subject), origin:s(obj.origin), destination:s(obj.destination),
    dimensions:s(obj.dimensions), weight:s(obj.weight), volume:s(obj.volume), price:s(obj.price), quoteType:s(obj.quoteType),
    status:s(obj.status), dateReceived:s(obj.dateReceived), dateSent:s(obj.dateSent), followUpDate:s(obj.followUpDate)
  };
  Object.keys(patch).forEach(k=>{ if(patch[k]===undefined||patch[k]==='') delete patch[k]; });
  const base={ id:s(obj.id)||uid(), rep:'', status:'Pending Feedback', volume:'1', dateReceived:todayISO() };
  if(rep!==undefined && rep!=='') base.rep=rep;
  const out=Object.assign(base, patch);
  if(Array.isArray(obj.items) && obj.items.length){
    out.items=obj.items.map(it=>({ quoteType:(it&&it.quoteType)||out.quoteType||QUOTE_TYPES[0],
      origin:(it&&it.origin!=null)?String(it.origin):'', destination:(it&&it.destination!=null)?String(it.destination):'',
      dimensions:(it&&it.dimensions!=null)?String(it.dimensions):'', weight:(it&&it.weight!=null)?String(it.weight):'',
      volume:(it&&it.volume!=null&&String(it.volume).trim()!=='')?String(it.volume):'1', price:(it&&it.price!=null)?String(it.price):'' }));
  }
  return out;
}
/* ---- Stage all selected JSON files into IMPORT_PREVIEW (no DB writes yet) ---- */
function stageImport(files){
  IMPORT_PREVIEW={ additions:[], updates:[], duplicates:[], files:[], errors:[],
    aux:{ nses:{}, reps:{}, prospects:{}, repprospects:{}, nsemeta:{}, customers:{}, projects:{}, opps:{}, oppOffices:{} } };
  const existing=DB.quotes();
  const byId={}; existing.forEach(q=>byId[q.id]=q);
  // guard against duplicate ids appearing across multiple files in one batch
  const stagedIds=new Set();
  let filesDone=0;
  files.forEach(file=>{
    const r=new FileReader();
    r.onload=()=>{
      try{
        let parsed; try{ parsed=JSON.parse(r.result); }catch(pe){ parsed=undefined; }
        let added=0, updated=0, dups=0, auxItems=0;
        if(parsed===undefined){ IMPORT_PREVIEW.errors.push({fileName:file.name, msg:'invalid JSON'}); }
        else {
          const list=extractQuotes(parsed);
          const aux=extractAux(parsed);
          const hasQuotes=Array.isArray(list) && list.length>0;
          if(!hasQuotes && !aux){
            IMPORT_PREVIEW.errors.push({fileName:file.name, msg:'no quotes or NSE Tools data found'});
          } else {
            if(hasQuotes){
              list.forEach(obj=>{
                const q=jsonToQuote(obj);
                const idHit = q.id && (byId[q.id] || stagedIds.has(q.id));
                const dupHit = existing.find(x=>
                  x.customerName===q.customerName &&
                  (x.subject||'')===(q.subject||'') &&
                  (x.dateReceived||'')===(q.dateReceived||''));
                if(idHit){
                  IMPORT_PREVIEW.updates.push({existing:byId[q.id]||dupHit, incoming:q, fileName:file.name});
                  updated++;
                } else if(dupHit){
                  IMPORT_PREVIEW.duplicates.push({existing:dupHit, incoming:q, fileName:file.name, action:'new'});
                  dups++;
                } else {
                  IMPORT_PREVIEW.additions.push({incoming:q, fileName:file.name});
                  stagedIds.add(q.id);
                  added++;
                }
              });
            }
            if(aux){ auxItems=countAuxItems(aux); mergeAuxIntoStaging(aux); }
          }
        }
        IMPORT_PREVIEW.files.push({fileName:file.name, added, updated, duplicates:dups, aux:auxItems});
      }catch(err){
        console.error(err);
        IMPORT_PREVIEW.errors.push({fileName:file.name, msg:'could not process'});
        IMPORT_PREVIEW.files.push({fileName:file.name, added:0, updated:0, duplicates:0, aux:0});
      }
      filesDone++;
      if(filesDone===files.length) showImportReview();
    };
    r.onerror=()=>{ IMPORT_PREVIEW.errors.push({fileName:file.name, msg:'read error'});
      IMPORT_PREVIEW.files.push({fileName:file.name, added:0, updated:0, duplicates:0, aux:0});
      filesDone++; if(filesDone===files.length) showImportReview(); };
    r.readAsText(file);
  });
}

/* ---- Approve: writes staged changes, after saving an undo backup ---- */
function approveImport(){
  localStorage.setItem('hht_preImportBackup', JSON.stringify(snapshot()));
  const quotes=DB.quotes(); const byId={}; quotes.forEach(q=>byId[q.id]=q);
  let added=0, updated=0, skipped=0;
  IMPORT_PREVIEW.additions.forEach(a=>{ quotes.push(a.incoming); byId[a.incoming.id]=a.incoming; added++; });
  IMPORT_PREVIEW.updates.forEach(u=>{
    if(u.existing){ const {id,...rest}=u.incoming; Object.assign(u.existing,rest); updated++; }
    else { quotes.push(u.incoming); added++; }
  });
  IMPORT_PREVIEW.duplicates.forEach(d=>{
    if(d.action==='skip'){ skipped++; }
    else if(d.action==='replace'){ const {id,...rest}=d.incoming; Object.assign(d.existing,rest); updated++; }
    else { const q=Object.assign({}, d.incoming, {id:uid()}); quotes.push(q); added++; }
  });
  DB.saveQuotes(quotes);
  const auxTouched=applyAuxToDB();
  const auxSum=auxTouched.nses+auxTouched.reps+auxTouched.prospects+auxTouched.repprospects+auxTouched.nsemeta+auxTouched.customers+auxTouched.projects+(auxTouched.opps||0)+(auxTouched.oppOffices||0);
  IMPORT_LAST={ when:new Date().toISOString(), files:IMPORT_PREVIEW.files.slice(), added, updated, skipped, aux:auxTouched, auxSum, errors:IMPORT_PREVIEW.errors.slice() };
  localStorage.setItem('hht_lastImport', JSON.stringify(IMPORT_LAST));

  toast(`Import complete — ${added} added, ${updated} updated, ${skipped} skipped${auxSum?`, ${auxSum} NSE Tools updated`:''}`);
}

  function gpFeetFromToken(tok){
    tok=(tok||'').toString().trim().replace(/^[LWH]\s*[:]?\s*/i,'').trim(); if(!tok) return null;
    let m;
    if((m=tok.match(/(\d+(?:\.\d+)?)\s*['\u2032]\s*(\d+(?:\.\d+)?)\s*["\u2033]?/))) return parseFloat(m[1])+parseFloat(m[2])/12;
    if((m=tok.match(/(\d+(?:\.\d+)?)\s*['\u2032]/)))  return parseFloat(m[1]);
    if((m=tok.match(/(\d+(?:\.\d+)?)\s*["\u2033]/)))  return parseFloat(m[1])/12;
    if((m=tok.match(/(\d+(?:\.\d+)?)/)))              return parseFloat(m[1]);
    return null;
  }
  function gpRound2(n){ return Math.round(n*100)/100; }
  function gpParseDims(str){
    if(!str) return {L:'',W:'',H:''};
    const parts=String(str).replace(/[\u00d7*]/g,'x').split(/\s*x\s*/i);
    const n=parts.map(gpFeetFromToken);
    return { L:n[0]!=null?gpRound2(n[0]):'', W:n[1]!=null?gpRound2(n[1]):'', H:n[2]!=null?gpRound2(n[2]):'' };
  }

  /* Trailer auto-suggest — faithful port of the original autoTrailer.
     NOTE: every rule except the extendable block references the ORIGINAL input `trailer`,
     exactly like the source, so results match the pricing tool bit-for-bit. */
  function gpAutoTrailer(trailer, weight, width, height, loadLength){
    if(trailer==="Multi-Axle") return "Multi-Axle";
    let suggestedTrailer=trailer;
    const flatbedMax=48000, stepDeckMax=48000, triAxleMax=65000;
    const flatbedDeck=48, stepDeckLower=43;
    const overhangFlatbed=loadLength-flatbedDeck, overhangStepDeck=loadLength-stepDeckLower;
    const needsExtendable=loadLength>48, needsDoubleDrop=height>10.6, needsRGNForHeight=height>11.5;
    if(weight>triAxleMax && !trailer.includes("RGN")) suggestedTrailer="RGN";
    if(weight>flatbedMax && trailer.includes("Flatbed")) suggestedTrailer="Flatbed Tri-Axle";
    if(weight>stepDeckMax && trailer.includes("Step Deck")) suggestedTrailer="Step Deck Tri-Axle";
    if(needsDoubleDrop && !trailer.includes("RGN")) suggestedTrailer="Double Drop";
    if(needsRGNForHeight && !trailer.includes("RGN")) suggestedTrailer="RGN";
    if(needsExtendable){ if(suggestedTrailer.includes("Flatbed")) suggestedTrailer="Flatbed Extendable"; if(suggestedTrailer.includes("Step Deck")) suggestedTrailer="Step Deck Extendable"; if(suggestedTrailer.includes("RGN")) suggestedTrailer="RGN Extendable"; }
    if(overhangFlatbed>10 && trailer.includes("Flatbed")) suggestedTrailer="Flatbed Extendable";
    if(overhangStepDeck>10 && trailer.includes("Step Deck")) suggestedTrailer="Step Deck Extendable";
    if(weight>65000 && !trailer.includes("RGN")) suggestedTrailer="RGN";
    return suggestedTrailer;
  }

  /* Pure pricing engine — port of calcRate math (verified 0 mismatch vs original over 30k cases). */
  function gpComputeRate(inp){
    let {length,width,height,weight,trailer,miles,mode,adjPct,marginPct,states}=inp;
    length=+length||0; width=+width||0; height=+height||0; weight=+weight||0;
    miles=+miles||0; mode=+mode||1; const adj=(+adjPct||0)/100+1; const margin=(+marginPct||0)/100;
    states=Array.isArray(states)?states:[];
    trailer=gpAutoTrailer(trailer,weight,width,height,length);
    const recommendedAxles = weight<=48000?5 : weight<=65000?6 : weight<=85000?7 : weight<=100000?8 : 9;
    const western = states.some(s=>WESTERN.includes(s));
    const region = western?'west':'east';
    const hl = heightLimits[trailer]; const legalHeight = hl?hl[region]:null;
    const heightWarn = (legalHeight!=null && height>legalHeight) ? 'Load overheight for '+trailer : '';
    let rpm = baseRPM[trailer]||0;
    const isExt = trailer==="Flatbed Extendable"||trailer==="Step Deck Extendable"||trailer==="RGN Extendable";
    let extensionFeet=0;
    if(isExt){ const baseLen=deckLengths[trailer]; if(length>baseLen) extensionFeet=length-baseLen; }
    if(extensionFeet>0){ rpm += Math.ceil(extensionFeet/10)*0.30; }
    let deckLength=deckLengths[trailer]||0;
    let overhang=Math.max(0,length-deckLength);
    if(isExt && length<=deckLength+20) overhang=0;
    let overhangPermitRequired=false;
    states.forEach(st=>{ const allowed=overhangRules[st]||0; if(overhang>allowed) overhangPermitRequired=true; });
    let requiresPermit=false;
    states.forEach(st=>{ const legal=legalDims[st]||legalDims.default;
      if(width>legal.width) requiresPermit=true; if(height>legal.height) requiresPermit=true; if(weight>legal.weight) requiresPermit=true; });
    if(overhangPermitRequired) requiresPermit=true;
    let superload=false;
    states.forEach(st=>{ const s=superloadTable[st]; if(!s) return;
      if(width>=s.w) superload=true; if(height>=s.h) superload=true; if(length>=s.len) superload=true; if(weight>=s.wt) superload=true; });
    if(overhang>0) rpm+=0.20;
    if(weight>50000&&weight<=60000) rpm+=0.10;
    else if(weight>60000&&weight<=70000) rpm+=0.15;
    else if(weight>70000&&weight<=80000) rpm+=0.20;
    else if(weight>80000&&weight<=90000) rpm+=0.40;
    else if(weight>90000&&weight<=100000) rpm+=0.50;
    else if(weight>100000&&weight<=110000) rpm+=0.70;
    else if(weight>110000&&weight<=120000) rpm+=0.90;
    else if(weight>120000&&weight<=130000) rpm+=1.05;
    else if(weight>130000&&weight<=140000) rpm+=1.25;
    else if(weight>140000) rpm+=1.50;
    if(width>8.5&&width<=9) rpm+=0.10;
    else if(width>9&&width<=10) rpm+=0.12;
    else if(width>10&&width<=11) rpm+=0.15;
    else if(width>11&&width<12) rpm+=0.20;
    else if(width>=12) rpm+=0.30;
    if(height>13&&height<=14) rpm+=0.20;
    else if(height>14&&height<=15) rpm+=0.35;
    else if(height>15&&height<=16) rpm+=0.85;
    else if(height>16) rpm+=1.25;
    if(superload) rpm+=0.50;
    const defaultPermitFee=40; let permitCost=0;
    if(requiresPermit){ states.forEach(st=>{ const fee=permitFeeTable[st]; let cost=fee?fee.base:defaultPermitFee;
      if(fee){ if(width>=12&&width<14)cost+=fee.width12; if(width>=14)cost+=fee.width14; if(height>=14)cost+=fee.height14; if(weight>80000)cost+=fee.weight80k; if(superload)cost+=fee.superload; }
      if(overhangPermitRequired) cost+=25; permitCost+=cost; }); }
    let escortCount=0;
    if(requiresPermit){ states.forEach(st=>{ const e=escortTable[st]; if(!e) return;
      if(width>=e.w1&&width<e.w2) escortCount=Math.max(escortCount,1);
      if(width>=e.w2) escortCount=Math.max(escortCount,2);
      if(height>=e.h1) escortCount=Math.max(escortCount,1);
      if(length>=e.len1) escortCount=Math.max(escortCount,1);
      if(overhang>=e.oh1) escortCount=Math.max(escortCount,1); }); }
    const escortRPM=1.25;
    const escortCost=escortCount*miles*escortRPM;
    const truckPay=miles*rpm*adj*mode;
    const totalCost=truckPay+permitCost+escortCost;
    const customerPrice=totalCost*(1+margin);
    return {trailer,recommendedAxles,miles,rpm,truckPay,permitCost,escortCount,escortCost,totalCost,customerPrice,
      requiresPermit,superload,overhangPermitRequired,heightWarn,mode,adj,margin};
  }

      if(!o||!d){ if(st) st.innerHTML='<span style="color:var(--red)">Could not locate origin/destination.</span>'; return; }
      const url='https://api.mapbox.com/directions/v5/mapbox/driving/'+o[0]+','+o[1]+';'+d[0]+','+d[1]+'?geometries=geojson&overview=full&access_token='+GP_TOKEN;
      const res=await fetch(url); const data=await res.json();
      if(!data.routes||!data.routes[0]){ if(st) st.innerHTML='<span style="color:var(--red)">No route found.</span>'; return; }
      const coords=data.routes[0].geometry.coordinates;
      const miles=Math.round(data.routes[0].distance/1609.34);
      const mEl=document.getElementById('gpMiles'); if(mEl) mEl.value=miles;
      const set=new Set(); const step=Math.max(1,Math.floor(coords.length/50));
      for(let i=0;i<coords.length;i+=step){ const ab=await gpReverseState(coords[i][0],coords[i][1]); if(ab) set.add(ab); }
      const oS=await gpReverseState(o[0],o[1]), dS=await gpReverseState(d[0],d[1]); if(oS)set.add(oS); if(dS)set.add(dS);
      GP_STATES=[...set];
      if(st) st.innerHTML='<strong>'+miles+' mi</strong> · '+GP_STATES.length+' state(s): '+GP_STATES.map(s=>'<span class="tag">'+s+'</span>').join(' ');
      toast('Route: '+miles+' mi across '+GP_STATES.length+' state(s)');
    }catch(e){ console.error(e); if(st) st.innerHTML='<span style="color:var(--red)">Route lookup failed — enter miles manually.</span>'; }
  };
  window.gpOpenRoute = function(){
    const o=(document.getElementById('gpOrigin')||{}).value||'', d=(document.getElementById('gpDest')||{}).value||'';
    if(!o||!d){ toast('Enter origin and destination first'); return; }
    window.open('https://www.google.com/maps/dir/'+encodeURIComponent(o)+'/'+encodeURIComponent(d),'_blank');
  };
  window.gpAutoAxles = function(){
    let lbs=+document.getElementById('gpWeight').value||0; if(document.getElementById('gpWeightUnit').value==='kgs') lbs*=2.20462;
    const ax=gpAxlesFromWeight(lbs); const el=document.getElementById('gpAxles'); if(el) el.value=ax;
  };

  window.gpCalcRate = function(){
    let lbs=+document.getElementById('gpWeight').value||0;
    if((document.getElementById('gpWeightUnit')||{}).value==='kgs') lbs*=2.20462;
    const inp={
      length:document.getElementById('gpLength').value, width:document.getElementById('gpWidth').value,
      height:document.getElementById('gpHeight').value, weight:lbs,
      trailer:document.getElementById('gpTrailer').value||'',
      miles:document.getElementById('gpMiles').value,
      mode:document.getElementById('gpMode').value,
      adjPct:document.getElementById('gpAdjust').value,
      marginPct:document.getElementById('gpMargin').value,
      states:GP_STATES
    };
    const out=document.getElementById('gpBreakdown');
    if(!inp.trailer){ out.innerHTML='<div style="color:var(--red)">Select a trailer to calculate.</div>'; return; }
    if(!(+inp.miles>0)){ out.innerHTML='<div style="color:var(--red)">Enter miles (or click Calculate Miles) first.</div>'; return; }
    const r=gpComputeRate(inp);
    GP_LAST_PRICE=r.customerPrice; GP_LAST_TRAILER=r.trailer;

    const noStates = !GP_STATES.length ? '<div class="alert-box warn" style="margin:0 0 10px"><h4>⚠️ No route states detected</h4><div class="a-sub">Permits, escorts &amp; superload flags need the state list — click <strong>Calculate Miles</strong> so those costs are included.</div></div>' : '';
    out.innerHTML = noStates + row('Trailer Used', esc(r.trailer)) + row('Recommended Axles', r.recommendedAxles)
      + row('Miles', r.miles.toFixed(0)) + row('RPM', '$'+r.rpm.toFixed(2))
      + row('Truck Pay', fmtMoney(r.truckPay)) + row('Permit Cost', fmtMoney(r.permitCost))
      + row('Escort Count', r.escortCount) + row('Escort Cost', fmtMoney(r.escortCost))
      + row('Total Internal Cost', fmtMoney(r.totalCost))
      + row('Customer Price', fmtMoney(r.customerPrice), true)
      + '<div style="font-size:12px;color:var(--muted);margin-top:8px">Mode: '+r.mode.toFixed(2)+' · Adjustment: '+((r.adj*100)-100).toFixed(1)+'% · Margin: '+(r.margin*100).toFixed(1)+'%</div>'
      + '<div style="font-size:12px;color:var(--muted);margin-top:2px">Permit Required: '+(r.requiresPermit?'Yes':'No')+' · Superload: '+(r.superload?'Yes':'No')+' · Overhang Permit: '+(r.overhangPermitRequired?'Yes':'No')+'</div>'
      + (r.heightWarn?'<div style="font-size:12px;color:var(--red);font-weight:600;margin-top:4px">⚠️ '+esc(r.heightWarn)+'</div>':'');
    const ap=document.getElementById('gpApplyBtn'); if(ap) ap.disabled=false;

    const price=Math.round(GP_LAST_PRICE*100)/100;

    q.items[GP_ITEM_IDX]=Object.assign({}, q.items[GP_ITEM_IDX], patch);
    if(GP_ITEM_IDX===0){ q.price=String(price); if(GP_LAST_TRAILER) q.equipment=GP_LAST_TRAILER; }

/* =====================================================================
   CUSTOMER QUOTE GENERATOR
   Builds a customer-facing OVERSIZE LINEHAUL quote from a saved quote,
   using the standard template. Fields in () are pulled from the quote;
   fields marked editable have sensible defaults the rep can change.
   Reachable from: Quote Log row button, and the Get Price pop-up.
   ===================================================================== */
(function(){
  const CQ_DEFAULTS = {
    commodity: '',
    leadTime: '2-3 Days',
    tarping: '$250',
    detention: '$100/hr. (after 3 hours)',
    layover: '$500/day',
    tonu: '$750 plus cost of permits'
  };

  function cq2(n){ return (n<10?'0':'')+n; }
  function cqTodayPlus(days){
    const d=new Date(); d.setDate(d.getDate()+days);
    return d.getFullYear()+'-'+cq2(d.getMonth()+1)+'-'+cq2(d.getDate());
  }
  function cqFmtDate(iso){
    if(!iso) return '';
    const p=String(iso).split('-'); if(p.length!==3) return iso;
    return p[1]+'/'+p[2]+'/'+p[0].slice(2);   // MM/DD/YY
  }
  /* Split a free dimension string into L / W / H display tokens. */
  function cqSplitDims(str){
    if(!str) return {L:'',W:'',H:''};
    const parts=String(str).replace(/[\u00d7*]/g,'x').split(/\s*x\s*/i)
      .map(s=>s.replace(/^\s*[LWH]\s*[:=]?\s*/i,'').trim());
    return {L:parts[0]||'', W:parts[1]||'', H:parts[2]||''};
  }
  function cqFmtWeight(w){
    if(!w) return '';
    const s=String(w).trim();
    if(/[a-z]/i.test(s)) return s;                       // already has a unit
    const num=s.replace(/[^0-9.]/g,'');
    if(!num) return s;
    return Number(num).toLocaleString('en-US')+' lbs.';
  }
  function cqFmtRate(price){
    const n=(typeof priceNum==='function')?priceNum(price):parseFloat(String(price||'').replace(/[^0-9.-]/g,''));
    if(!n) return '';
    return (typeof fmtMoney==='function')?fmtMoney(n):'$'+Number(n).toFixed(2);
  }

  function cqVal(id){ const e=document.getElementById(id); return e?e.value:''; }

  /* Build the formatted quote (HTML) from the current field values. */
  function cqBuildHTML(){
    const v={
      pickup:cqVal('cqPickup'), delivery:cqVal('cqDelivery'),
      L:cqVal('cqL'), W:cqVal('cqW'), H:cqVal('cqH'),
      weight:cqVal('cqWeight'), commodity:cqVal('cqCommodity'),
      equipment:cqVal('cqEquipment'), rate:cqVal('cqRate'),
      exp:cqFmtDate(cqVal('cqExp')), leadTime:cqVal('cqLead'),
      tarping:cqVal('cqTarp'), detention:cqVal('cqDet'),
      layover:cqVal('cqLay'), tonu:cqVal('cqTonu')
    };
    const E=esc;
    return ''
      + '<div>Pickup: <strong>'+E(v.pickup)+'</strong></div>'
      + '<div>Delivery: <strong>'+E(v.delivery)+'</strong></div>'
      + '<div style="height:8px"></div>'
      + '<div><strong>OVERSIZE LINEHAUL QUOTE</strong></div>'
      + '<div>Total Dims Quoted: L: '+E(v.L)+' x W: '+E(v.W)+' x H: '+E(v.H)+'</div>'
      + '<div>Weight: '+E(v.weight)+'</div>'
      + '<div>Commodity: '+E(v.commodity)+'</div>'
      + '<div>Equipment needed: '+E(v.equipment)+'</div>'
      + '<div style="height:8px"></div>'
      + '<div><strong>OVERSIZE LINEHAUL RATE: '+E(v.rate)+'</strong></div>'
      + '<div style="height:8px"></div>'
      + '<div><em>Cargo value must be provided prior to booking*</em></div>'
      + '<div><em>Rate includes oversize permits/ fuel surcharge/ Tolls. Standard carrier cargo coverage is $100,000.</em></div>'
      + '<div><em>Additional Shipper&#39;s Interest Insurance is available at $0.20 per $100 of declared cargo value.</em></div>'
      + '<div style="height:8px"></div>'

/* =====================================================================
   DAILY IDENTITY  —  "Who's working today?"
   Once per day each user picks their name. When a specific rep is chosen,
   all AR Tools (New Quote, Rep Dashboard, Rep Prospecting) lock to that rep
   and their offices (pulled from Manage Reps). "Manager / view everyone"
   restores full access. Switch anytime via the top-bar badge.
   ===================================================================== */
let ACTIVE_REP='all';
const IDENTITY_KEY='tvIdentity';
/* default rep for AR Tools inputs: the active identity, else the first rep */
function arDefaultRep(){ const reps=DB.reps()||[]; if(ACTIVE_REP!=='all' && reps.find(r=>r.u===ACTIVE_REP)) return ACTIVE_REP; return reps[0]?reps[0].u:''; }
function buildIdentityBadge(){
  const el=document.getElementById('identityBadge'); if(!el) return;
  if(ACTIVE_REP==='all'){ el.innerHTML='👤 Manager (all reps) ▾'; }
  else { el.innerHTML='👤 '+esc(repName(ACTIVE_REP))+(isART(ACTIVE_REP)?' (ART)':'')+' ▾'; }
}
/* apply a chosen identity, persist for today, and scope AR Tools to it */
function applyIdentity(rep, persist){
  ACTIVE_REP=rep;
  if(persist!==false){ try{ localStorage.setItem(IDENTITY_KEY, JSON.stringify({date:todayISO(), rep})); }catch(e){} }
  if(rep!=='all'){ RP_REP=rep; DASH_REP=rep; RP_OFFICE='all'; RP_BROKER='all'; }
  else { RP_REP='all'; }
  buildIdentityBadge();
}
/* load today's saved identity, or return null if none set yet for today */
function loadIdentity(){
  try{ const raw=localStorage.getItem(IDENTITY_KEY); if(!raw) return null;
    const o=JSON.parse(raw); if(o && o.date===todayISO() && o.rep!=null) return o.rep; }catch(e){}
  return null;
}
function openIdentityModal(force){
  const reps=DB.reps()||[];
  const box=document.getElementById('modalBox');
  box.parentElement.querySelector('.modal').classList.remove('xwide');box.parentElement.querySelector('.modal').classList.remove('wide');
  const opts=reps.map(r=>`<option value="${r.u}" ${ACTIVE_REP===r.u?'selected':''}>${esc(r.name)}${r.role==='ART'?' (ART)':''}</option>`).join('');
  box.innerHTML=`<h3>👋 Who's working today?</h3>
    <div class="card-sub" style="margin:-4px 0 14px">Pick your name so <strong>AR Tools</strong> shows only your customers, prospects, and offices. Choose <strong>Manager</strong> to see everyone.</div>
    <div class="field"><label>Your name</label>
      <select id="identSel" style="width:100%">
        <option value="all" ${ACTIVE_REP==='all'?'selected':''}>👥 Manager / view everyone</option>
        ${opts}
      </select></div>
    <div class="modal-actions" style="justify-content:${force?'space-between':'flex-end'}">
      ${force?'<button class="btn btn-ghost" style="width:auto" onclick="closeModal()">Cancel</button>':''}
      <button class="btn btn-primary" style="width:auto" onclick="confirmIdentity()">Start my day →</button>
    </div>`;
  document.getElementById('modalBg').classList.add('show');
}
function confirmIdentity(){
  const sel=val('identSel')||'all';
  applyIdentity(sel, true);
  closeModal(); buildSidebar(); route(); window.scrollTo(0,0);
  toast(sel==='all'?'Manager view — showing all reps':'Working as '+repName(sel));
}
function initIdentity(){
  const reps=DB.reps()||[];
  const saved=loadIdentity();
  if(saved!=null && (saved==='all' || reps.find(r=>r.u===saved))){ applyIdentity(saved, false); return true; }
  applyIdentity('all', false);   /* provisional until they choose */
  return false;                  /* signal: prompt needed */
}
(function init(){
  applyDarkPref();
  const haveIdentity=initIdentity();
  buildIdentityBadge();
  buildSidebar();
  route();
  if(!haveIdentity && (DB.reps()||[]).length){ openIdentityModal(false); }
})();
</script>

/* ---- storage ---- */
DB.opps        = function(){ return JSON.parse(localStorage.getItem('hht_opps')||'null'); };
DB.saveOpps    = function(o){ localStorage.setItem('hht_opps', JSON.stringify(o)); };
DB.oppOffices  = function(){ return JSON.parse(localStorage.getItem('hht_oppOffices')||'null'); };
DB.saveOppOffices = function(o){ localStorage.setItem('hht_oppOffices', JSON.stringify(o)); };

/* ---- seed on first run ---- */
(function seedOpps(){
  if(DB.opps()) return;
  const out=[]; const data=(OPP_SEED&&OPP_SEED.data)||{};
  Object.keys(data).forEach(office=>{
    (data[office]||[]).forEach(r=>{
      out.push(Object.assign({ id:'op'+Date.now().toString(36)+Math.random().toString(36).slice(2,7), office, wonCustomer:false, notesLog:[] }, r));
    });
  });
  DB.saveOpps(out);
  if(!DB.oppOffices()){
    const offs=(OPP_SEED&&OPP_SEED.meta&&OPP_SEED.meta.offices)?OPP_SEED.meta.offices.slice():['Charlotte'];
    DB.saveOppOffices(offs);
  }
})();

/* ---- constants ---- */
const OPP_STATUSES=['1 - No Communication','2 - Broker Outreach','3 - NSE Conversation','4 - Ready to Quote'];
const OPP_TIERS=['Tier 1 - Hot','Tier 2 - High','Tier 3 - Medium','Tier 4 - Low'];
const OPP_REF=(OPP_SEED&&OPP_SEED.reference)||{};
const FUNNEL=[
  {key:'prequalified', label:'Pre-Qualified Opp',        sub:'No Communication',                         color:'#c0392b'},
  {key:'qualifying',   label:'Qualifying in Progress',   sub:'Broker Outreach',                          color:'#e8830c'},
  {key:'quoting',      label:'Qualified / Quoting',      sub:'NSE Outreach · Ready to Quote · Quote In', color:'#c77c00'},
  {key:'customer',     label:'Prospect Turned Customer', sub:'Shipment Won',                             color:'#1b873f'}
];
const FUNNEL_MAP={prequalified:FUNNEL[0],qualifying:FUNNEL[1],quoting:FUNNEL[2],customer:FUNNEL[3]};

/* ---- state ---- */
let OPP_OFF='all', OPP_BRK='all', OPP_SEARCH='', OPP_VIEW='funnel';
let OPP_PARSE=[], OPP_PARSE_REL='Prospect', OPP_EDIT=null, OPP_DETAIL=null;

/* ---- helpers ---- */
function oppList(){ return DB.opps()||[]; }
function oppSave(arr){ DB.saveOpps(arr); }
function oppOfficeList(){
  const s=new Set((DB.oppOffices()||[]));
  oppList().forEach(o=>{ if(o.office) s.add(o.office); });
  (DB.reps()||[]).forEach(r=>(r.offices||[]).forEach(x=>s.add(x)));
  return [...s].sort((a,b)=>a.localeCompare(b));
}
function oppBrokerList(){
  const s=new Set(); oppList().forEach(o=>{ if(o.broker&&o.broker.trim()) s.add(o.broker.trim()); });
  return [...s].sort((a,b)=>a.localeCompare(b));
}
function normName(s){ return (s||'').toString().trim().toLowerCase(); }
/* quotes that match a company (case-insensitive on customer name) */
function oppQuotesFor(company){ const n=normName(company); if(!n) return []; return DB.quotes().filter(q=>normName(q.customerName)===n); }
function oppHasQuote(company){ return oppQuotesFor(company).length>0; }
function oppHasWon(company){ return oppQuotesFor(company).some(q=>q.status==='Won'); }
/* funnel stage */
function oppStage(o){
  if(o.wonCustomer || oppHasWon(o.company)) return 'customer';
  if(oppHasQuote(o.company)) return 'quoting';
  if(o.readyToQuote || o.nseConversation) return 'quoting';
  if(o.brokerContacted) return 'qualifying';
  return 'prequalified';
}
function oppStatusNum(s){ const m=String(s||'').match(/^\s*(\d)/); return m?+m[1]:1; }
function oppTierNum(t){ const m=String(t||'').match(/Tier\s*(\d)/i); return m?+m[1]:9; }
function oppTierFromLike(L){ L=+L; return L>=8.5?'Tier 1 - Hot':L>=8?'Tier 2 - High':L>=7?'Tier 3 - Medium':'Tier 4 - Low'; }
function oppDeriveStatus(o){
  if(o.readyToQuote) return '4 - Ready to Quote';
  if(o.nseConversation) return '3 - NSE Conversation';
  if(o.brokerContacted) return '2 - Broker Outreach';
  return '1 - No Communication';
}
function oppFiltered(){
  let list=oppList();
  if(OPP_OFF!=='all') list=list.filter(o=>(o.office||'')===OPP_OFF);
  if(OPP_BRK!=='all') list=list.filter(o=>(o.broker||'').trim()===OPP_BRK);
  const q=OPP_SEARCH.toLowerCase().trim();
  if(q) list=list.filter(o=>[o.company,o.broker,o.industry,o.notes,o.equipment,o.why].join(' ').toLowerCase().includes(q));
  return list;
}
function oppById(id){ return oppList().find(o=>o.id===id); }
