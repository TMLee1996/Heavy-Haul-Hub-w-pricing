<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Vest Demo — Quote Tracker</title>
<style>
:root{
  --navy:#0b2545; --blue:#13315c; --accent:#e07a00; --accent2:#134074;
  --green:#1b873f; --red:#c0392b; --amber:#c77c00; --gray:#5a6a7a;
  --bg:#f4f6f9; --card:#ffffff; --line:#e2e8f0; --text:#1a2733; --muted:#6b7a8d;
  --input-bg:#ffffff; --th-bg:#f7f9fc; --hover:#fafcff; --ink:#0b2545;
}
/* ---- Dark mode ---- */
body.dark{
  --navy:#0d1a2b; --blue:#1b3a63; --accent:#f08a1d; --accent2:#4a86d0;
  --green:#2fb457; --red:#e5604f; --amber:#e0a53a; --gray:#9fb0c0;
  --bg:#0f1720; --card:#182430; --line:#2a3a4a; --text:#e6edf3; --muted:#9fb0c0;
  --input-bg:#0f1a24; --th-bg:#1c2a38; --hover:#1c2a38; --ink:#e6edf3;
}
body.dark input,body.dark select,body.dark textarea{background:var(--input-bg);color:var(--text);}
body.dark input:focus,body.dark select:focus,body.dark textarea:focus{box-shadow:0 0 0 3px rgba(74,134,208,.22);}
body.dark .sidebar{background:var(--card);}
body.dark .nav-item:hover{background:#1c2a38;color:#fff;}
body.dark th{background:var(--th-bg);}
body.dark tr:hover td{background:var(--hover);}
body.dark .modal{background:var(--card);}
body.dark .note-item,body.dark .kpi,body.dark .card,body.dark .chip{background:var(--card);}
body.dark .chip{color:var(--muted);}
body.dark .rowbtn{background:#243444;color:#dbe6f0;}
body.dark .rowbtn:hover{background:#2d4152;}
body.dark .btn-ghost{background:#243444;color:#dbe6f0;}
body.dark .btn-ghost:hover{background:#2d4152;}
body.dark .pill.type{background:#22344a;color:#8fb6e6;}
body.dark .pill.vol{background:#2b2a52;color:#b9b4ff;}
body.dark .tag{background:#22344a;color:#8fb6e6;}
body.dark .pill.lost{background:#2a3644;color:#aebccb;}
body.dark .alert-box.warn{background:#33290f;border-color:#5a4a1e;}
body.dark .alert-box.danger{background:#3a1a17;border-color:#5e2a24;}
body.dark tr.cont-hold td{background:#3a300f!important;}
body.dark .page-sub,body.dark .card .card-sub{color:var(--muted);}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
body{background:var(--bg);color:var(--text);font-size:14px;}
button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(19,64,116,.12);}
label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:5px;}
.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;height:60px;position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.15);}
.topbar .brand{display:flex;align-items:center;gap:11px;font-weight:700;}
.topbar .brand .mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#b85e00);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;}
.topbar .right{display:flex;align-items:center;gap:12px;}
.role-badge{font-size:10px;text-transform:uppercase;letter-spacing:.05em;background:rgba(255,255,255,.16);
  padding:4px 10px;border-radius:20px;font-weight:700;}
.topbtn{background:rgba(255,255,255,.12);color:#fff;border:none;padding:7px 13px;border-radius:7px;font-size:13px;}
.topbtn:hover{background:rgba(255,255,255,.22);}
.layout{display:flex;}
.sidebar{width:224px;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 60px);padding:16px 12px;
  position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:9px;color:var(--gray);
  font-weight:600;font-size:14px;margin-bottom:3px;border:none;background:none;width:100%;text-align:left;}
.nav-item .ic{width:20px;text-align:center;}
.nav-item:hover{background:#f1f5f9;color:var(--ink);}
.nav-item.active{background:var(--navy);color:#fff;}
.nav-section{font-size:10px;text-transform:uppercase;color:#9aa7b5;font-weight:700;letter-spacing:.06em;
  margin:16px 13px 7px;}
/* ---- Collapsible sidebar menu groups ---- */
.nav-group{margin-bottom:5px;}
.nav-group-head{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;text-align:left;
  padding:11px 12px;border-radius:9px;cursor:pointer;color:var(--ink);font-weight:700;font-size:13px;
  text-transform:uppercase;letter-spacing:.04em;}
.nav-group-head:hover{background:#f1f5f9;}
.nav-group-head .ic{width:20px;text-align:center;font-size:15px;}
.nav-group-head .lbl{flex:1;}
.nav-group-head.has-active{color:var(--accent);}
.nav-chev{transition:transform .2s;font-size:12px;color:var(--muted);}
.nav-group.closed .nav-chev{transform:rotate(-90deg);}
.nav-group.closed .nav-group-body{display:none;}
.nav-group-body{padding:3px 0 4px 0;margin:2px 0 2px 15px;border-left:2px solid var(--line);}
.nav-group-body .nav-item{font-size:13px;padding:9px 12px;}
body.dark .nav-group-head{color:var(--text);}
body.dark .nav-group-head:hover{background:#1c2a38;}
.main{flex:1;padding:26px 30px;max-width:calc(100vw - 224px);}
.page-title{font-size:22px;color:var(--ink);font-weight:700;margin-bottom:3px;}
.page-sub{color:var(--muted);font-size:13px;margin-bottom:22px;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:15px;margin-bottom:24px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px 19px;position:relative;overflow:hidden;}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.kpi .val{font-size:31px;font-weight:800;color:var(--ink);margin-top:6px;}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:5px;}
.kpi.b-blue .bar{background:var(--accent2);} .kpi.b-green .bar{background:var(--green);}
.kpi.b-red .bar{background:var(--red);} .kpi.b-amber .bar{background:var(--amber);}
.kpi.b-orange .bar{background:var(--accent);} .kpi.b-navy .bar{background:var(--navy);}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:4px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:20px 22px;margin-bottom:22px;}
.card h3{font-size:16px;color:var(--ink);margin-bottom:4px;}
.card .card-sub{font-size:12px;color:var(--muted);margin-bottom:16px;}
.card-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
.card-head h3{margin:0;}
.filterbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;align-items:center;}
.chip{background:#fff;border:1px solid var(--line);color:var(--gray);padding:8px 14px;border-radius:20px;
  font-size:13px;font-weight:600;}
.chip:hover{border-color:var(--accent2);color:var(--ink);}
.chip.active{background:var(--accent2);color:#fff;border-color:var(--accent2);}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:11px;}
table{width:100%;border-collapse:collapse;min-width:820px;}
th{background:#f7f9fc;text-align:left;padding:11px 13px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:11px 13px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#fafcff;}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.pill.won{background:#e3f6e9;color:var(--green);} .pill.loss{background:#fdeaea;color:var(--red);}
.pill.pending{background:#fef3e0;color:var(--amber);}
.pill.type{background:#eef2f8;color:var(--accent2);}
.pill.vol{background:#ecebff;color:#4b3fb0;}
.mini-input{padding:5px 7px;font-size:12px;min-width:118px;}
.mini-num{padding:5px 7px;font-size:12px;width:64px;min-width:0;text-align:center;}
.rowbtn{border:none;background:#eef2f7;color:var(--ink);padding:5px 9px;border-radius:6px;font-size:12px;font-weight:600;margin-right:4px;}
.rowbtn:hover{background:#e2e8f0;}
.rowbtn.del{background:#fdeaea;color:var(--red);} .rowbtn.del:hover{background:#f9d5d5;}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:14px;}
.alert-box{border-radius:11px;padding:16px 18px;margin-bottom:18px;border:1px solid;}
.alert-box.warn{background:#fff8ec;border-color:#f0d090;}
.alert-box.danger{background:#fdf0ef;border-color:#f0b8b3;}
.alert-box h4{font-size:14px;margin-bottom:3px;display:flex;align-items:center;gap:8px;}
.alert-box.warn h4{color:var(--amber);} .alert-box.danger h4{color:var(--red);}
.alert-box .a-sub{font-size:12px;color:var(--muted);margin-bottom:11px;}
.age-badge{background:var(--red);color:#fff;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;}
.age-badge.warn{background:var(--amber);}
.parse-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
@media(max-width:900px){.parse-grid{grid-template-columns:1fr;}}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:14px;}
.form-row.one{grid-template-columns:1fr;}
.form-row.three{grid-template-columns:1fr 1fr 1fr;}
.form-row .field-c{margin:0;}
textarea.email-in{min-height:230px;resize:vertical;font-size:13px;line-height:1.5;}
.parse-actions{display:flex;gap:10px;margin-top:12px;}
.detected{font-size:11px;color:var(--green);font-weight:600;margin-top:4px;min-height:14px;}
.btn{border:none;border-radius:8px;padding:11px 16px;font-weight:600;font-size:14px;transition:.15s;}
.btn-primary{background:var(--accent);color:#fff;width:100%;} .btn-primary:hover{background:#c96d00;}
.btn-ghost{background:#eef2f7;color:var(--ink);} .btn-ghost:hover{background:#e2e8f0;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(11,37,69,.55);z-index:60;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;padding:26px;max-height:90vh;overflow-y:auto;}
.modal h3{color:var(--ink);margin-bottom:16px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.field{margin-bottom:16px;}
.note-item{background:#f7f9fc;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:9px;}
.note-item .meta{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
.note-item .body{font-size:13px;line-height:1.5;white-space:pre-wrap;}
.prog-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.modal.wide{max-width:600px;}
.modal.xwide{max-width:1240px;}
/* ---- Customer Quote layout: two columns that always fit, no inner scroll ---- */
.cq-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start;}
.cq-grid .cq-preview{font-size:13.5px;line-height:1.55;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:18px 20px;}
@media(max-width:900px){ .cq-grid{grid-template-columns:1fr;} }
/* ---- Quote Log: fit to screen, no horizontal scroll ---- */
.table-wrap.qlog{overflow-x:visible;}
table.qlog-table{min-width:0;width:100%;table-layout:fixed;font-size:12.5px;}
table.qlog-table th,table.qlog-table td{padding:10px 8px;overflow-wrap:break-word;word-break:normal;vertical-align:top;}
table.qlog-table tbody tr:nth-child(even) td{background:rgba(0,0,0,.025);}
body.dark table.qlog-table tbody tr:nth-child(even) td{background:rgba(255,255,255,.03);}
table.qlog-table tbody tr:hover td{background:rgba(37,99,235,.06);}
table.qlog-table .mini-input,table.qlog-table .mini-num,table.qlog-table select,table.qlog-table input{width:100%;min-width:0;max-width:100%;box-sizing:border-box;}
table.qlog-table select.mini-input{text-overflow:ellipsis;}
table.qlog-table td .pill{font-size:10px;}
/* stacked Dates cell */
.qlog-dates{display:flex;flex-direction:column;gap:4px;}
.qlog-dates .dl{display:flex;align-items:center;gap:5px;}
.qlog-dates .dl b{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);width:30px;flex:none;}
.qlog-dates .dl input{padding:3px 4px;font-size:11px;}
.qlog-dates .dl .dtxt{font-size:11.5px;}
/* icon action buttons */
.qlog-acts{display:flex;gap:4px;flex-wrap:wrap;}
.icon-btn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);
  background:var(--card);border-radius:7px;cursor:pointer;font-size:14px;line-height:1;padding:0;transition:.15s;}
.icon-btn:hover{background:var(--bg);transform:translateY(-1px);}
.icon-btn.cq{border-color:var(--green);}
.icon-btn.del{border-color:#f3c6c6;}
.icon-btn.del:hover{background:#fdecec;}
@media(max-width:1100px){ .table-wrap.qlog{overflow-x:auto;} table.qlog-table{min-width:1040px;} }
.note-del{border:none;background:none;color:var(--red);font-size:11px;font-weight:700;cursor:pointer;}
.note-list{max-height:280px;overflow-y:auto;margin-top:6px;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:13px 20px;border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:80;font-weight:600;font-size:14px;opacity:0;transform:translateY(20px);
  transition:.25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.tag{display:inline-block;background:#eef2f8;color:var(--accent2);padding:2px 9px;border-radius:6px;font-size:11px;font-weight:700;margin-right:5px;}
.rank-cell{display:flex;align-items:center;gap:6px;}
.rank-num{width:44px;text-align:center;font-weight:800;color:var(--accent);font-size:16px;}
.hidden{display:none!important;}
/* ---- Project Center: collapsible sections ---- */
.collap .collap-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;gap:12px;}
.collap .collap-head:hover h3{color:var(--accent2);}
.collap .chev{transition:transform .2s;font-size:13px;color:var(--muted);margin-left:8px;}
.collap.closed .chev{transform:rotate(-90deg);}
.collap.closed .collap-body{display:none;}
.collap-head .head-right{display:flex;align-items:center;gap:8px;}
/* ---- Drayage container status ---- */
tr.cont-hold td{background:#fff3cd!important;}
tr.cont-lfd td{box-shadow:inset 4px 0 0 var(--red);}
.chk-cell{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
.chk-cell input{width:auto;}
.lfd-alert{display:inline-block;background:var(--red);color:#fff;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:800;animation:lfdpulse 1.2s infinite;}
@keyframes lfdpulse{0%,100%{opacity:1}50%{opacity:.55}}
.hold-flag{display:inline-block;background:var(--amber);color:#fff;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:800;}
.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#cbd5e1;margin-right:4px;}
.status-dot.on{background:var(--green);}
.copy-rate-wrap{display:flex;align-items:center;gap:6px;}
.copy-rate-wrap input{width:110px;}
/* ---- Project Center: awarded/progress/mapper/tracking ---- */
.pbar{background:#eef2f7;border-radius:20px;height:14px;overflow:hidden}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#2fb457)}
.mini-pbar{background:#eef2f7;border-radius:20px;height:8px;overflow:hidden;min-width:120px}
.mini-pbar>i{display:block;height:100%;background:var(--accent2)}
.mstep{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#eef2f7;color:var(--muted);margin:2px 0}
.mstep.on{background:#e3f6e9;color:var(--green)}
.pillbar{display:flex;gap:6px;flex-wrap:wrap}
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.map-grid{grid-template-columns:1fr}}
tr.trk-load td{background:#fff6e6}
tr.trk-del td{background:#e8f7ee}
tr.tl-prog td{background:#fff6e6}
tr.tl-done td{background:#e8f7ee}
.statechk{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.statechk input{width:auto}
.statechk.on-load{color:var(--amber)} .statechk.on-del{color:var(--green)}
.state-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#cbd5e1}
.state-dot.load{background:var(--amber)} .state-dot.del{background:var(--green)}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.sum-grid{grid-template-columns:1fr}}
@media(max-width:900px){.pc-sum-grid{grid-template-columns:1fr !important;}}
.sum-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;font-size:13px}
.sum-item .ico{width:20px;text-align:center;font-weight:800}
.sum-item.done{background:#f2fbf5;border-color:#bfe8cd}
.sum-item.todo{background:#fff9f0;border-color:#f0d9a8}
.flag-card{border:1px solid #f0b8b3;background:#fdf0ef;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.flag-card h5{font-size:13px;color:var(--red);margin-bottom:6px;display:flex;align-items:center;gap:8px}
/* ---- Project Center: compact detail view ---- */
.pc-compact .card{padding:12px 15px;margin-bottom:12px}
.pc-compact .kpi{padding:12px 14px}
.pc-compact .kpi .val{font-size:23px;margin-top:3px}
.pc-compact .kpi-grid{gap:10px;margin-bottom:14px}
.pc-compact .card-sub{margin-bottom:10px}
.pc-compact .collap-body{margin-top:10px!important}
.pc-compact th{padding:7px 10px}
.pc-compact td{padding:7px 10px}
.pc-compact .page-sub{margin-bottom:12px}
.pc-compact .mini-input{padding:4px 6px}
.pc-compact .mini-num{padding:4px 6px}
.pill.lost{background:#e9edf2;color:#64748b}
tr.proj-lost td{opacity:.6}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="mark">TV</div><span>Team Vest Demo</span></div>
  <div class="right">
    <span class="role-badge" id="identityBadge" onclick="openIdentityModal(true)" style="cursor:pointer" title="Switch who's working">Manager / Admin Access</span>
    <button class="topbtn" id="darkToggle" onclick="toggleDark()" title="Toggle dark mode">🌙 Dark</button>
  </div>
</div>
<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" class="hidden">
<input type="file" id="importCsvFile" accept=".csv,text/csv" class="hidden">
<input type="file" id="importJsonFile" accept=".json,application/json" multiple class="hidden">
<input type="file" id="projectXlsxFile" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" class="hidden">
<input type="file" id="pcAddPageFile" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" class="hidden">
<input type="file" id="utilXlsxFile" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" class="hidden">
<input type="file" id="agingXlsxFile" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" class="hidden">
<input type="file" id="closeXlsxFile" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" class="hidden">
<script>
/* =====================================================================
   TEAM VEST DEMO — QUOTE TRACKER  —  single combined sheet, no logins.
   Everyone operates at Manager/Admin level. Data persists locally.
   ===================================================================== */
/* ---------------- STORAGE ---------------- */

const US_STATES = {'AL':1,'AK':1,'AZ':1,'AR':1,'CA':1,'CO':1,'CT':1,'DE':1,'FL':1,'GA':1,'HI':1,'ID':1,'IL':1,'IN':1,'IA':1,'KS':1,'KY':1,'LA':1,'ME':1,'MD':1,'MA':1,'MI':1,'MN':1,'MS':1,'MO':1,'MT':1,'NE':1,'NV':1,'NH':1,'NJ':1,'NM':1,'NY':1,'NC':1,'ND':1,'OH':1,'OK':1,'OR':1,'PA':1,'RI':1,'SC':1,'SD':1,'TN':1,'TX':1,'UT':1,'VT':1,'VA':1,'WA':1,'WV':1,'WI':1,'WY':1,'DC':1};
function parseEmail(text){
  const out = {customerName:'',subject:'',origin:'',destination:'',dimensions:'',weight:'',volume:'',dateReceived:todayISO()};
  if(!text || !text.trim()) return out;
  let m = text.match(/^\s*subject\s*:\s*(.+)$/im);
  if(m) out.subject = m[1].trim().replace(/^(re|fw|fwd)\s*:\s*/i,'').trim();
  m = text.match(/^\s*from\s*:\s*(.+)$/im);
  if(m){
    let f = m[1].trim();
    const nameMatch = f.match(/^"?([^"<@]+?)"?\s*[<(][\w.\-]+@/);
    if(nameMatch){ out.customerName = nameMatch[1].trim(); }
    else { const em = f.match(/([\w.\-]+)@([\w.\-]+)/);
      if(em){ out.customerName = titleCase(em[1].replace(/[._\-]+/g,' ')); }
      else out.customerName = f.replace(/[<>]/g,'').trim(); }
  }
  let cm = text.match(/^\s*company\s*:\s*(.+)$/im) || text.match(/^\s*customer\s*:\s*(.+)$/im);
  if(cm) out.customerName = cm[1].trim();
  m = text.match(/^\s*(?:date|sent|received)\s*:\s*(.+)$/im);
  if(m){ const d = new Date(m[1].trim()); if(!isNaN(d)) out.dateReceived = d.toISOString().slice(0,10); }
  out.weight = parseWeight(text);
  out.dimensions = parseDimensions(text);
  out.volume = parseVolume(text);
  const lane = extractLane(text);
  out.origin = lane.origin; out.destination = lane.destination;
  return out;
}
function parseVolume(text){
  let m;
  if((m=text.match(/(?:qty|quantity|#\s*of\s*(?:shipments?|loads?|trucks?|units?|pieces?)|no\.?\s*of\s*(?:shipments?|loads?))\D{0,6}?(\d{1,4})/i))) return m[1];
  if((m=text.match(/(\d{1,4})\s*(?:shipments?|loads?|truck\s*loads?|truckloads?|trailers?|units?|pieces?|pcs|skids?|containers?|moves?)\b/i))) return m[1];
  if((m=text.match(/\(\s*x\s*(\d{1,4})\s*\)/i))) return m[1];
  return '';
}
function extractLane(text){
  const re=/([A-Z][A-Za-z.'\-]+(?:\s+[A-Z][A-Za-z.'\-]+){0,3})\s*,\s*([A-Za-z]{2})\b(?:\s(\d{5})(?!\d))?/g;
  const locs=[]; let m;
  while((m=re.exec(text))!==null){
    if(US_STATES[m[2].toUpperCase()])
      locs.push({t:m[1].trim()+', '+m[2].toUpperCase()+(m[3]?' '+m[3]:''), i:m.index});
  }
  if(!locs.length){
    const z=text.match(/\b(\d{5})\b/g);
    if(z) return {origin:z[0]||'', destination:z[1]||''};
    return {origin:'',destination:''};
  }
  const ORIG=/(pick\s*-?\s*up|pick\w*\s*up|pickup|origin|ship\s*from|\bfrom\b|shipper|loading|p\/u)/ig;
  const DEST=/(deliver\w*|destination|ship\s*to|drop\s*off|drop|consignee|receiver|d\/o|\bto\b)/ig;
  function labelOf(loc){
    const pre=text.slice(Math.max(0,loc.i-48), loc.i);
    let oPos=-1,dPos=-1,mm;
    ORIG.lastIndex=0; while((mm=ORIG.exec(pre))!==null) oPos=mm.index;
    DEST.lastIndex=0; while((mm=DEST.exec(pre))!==null) dPos=mm.index;
    if(oPos<0 && dPos<0) return '';
    return dPos>oPos ? 'dest' : 'orig';
  }
  const labeled=locs.map(l=>({...l,lab:labelOf(l)}));
  let origin='',destination='';
  const o=labeled.find(l=>l.lab==='orig'); if(o) origin=o.t;
  const d=labeled.find(l=>l.lab==='dest' && l.t!==origin); if(d) destination=d.t;
  if(!origin){ const f=labeled.find(l=>l.t!==destination); if(f) origin=f.t; }
  if(!destination){ const f=labeled.find(l=>l.t!==origin); if(f) destination=f.t; }
  return {origin,destination};
}
function titleCase(s){ return s.replace(/\w\S*/g,t=>t[0].toUpperCase()+t.slice(1).toLowerCase()); }
function parseWeight(text){
  const num=s=>parseFloat(s.replace(/,/g,''));
  let m;
  if((m=text.match(/([\d,]+(?:\.\d+)?)\s*(?:lbs?|pounds?)\b/i)))          return Math.round(num(m[1]))+' lbs';
  if((m=text.match(/([\d,]+(?:\.\d+)?)\s*#/)))                            return Math.round(num(m[1]))+' lbs';
  if((m=text.match(/([\d,]+(?:\.\d+)?)\s*(?:kgs?|kilo(?:gram)?s?)\b/i)))    return Math.round(num(m[1])*2.20462)+' lbs';
  if((m=text.match(/([\d,]+(?:\.\d+)?)\s*(?:metric\s*tons?|tonnes?|\bmt\b)\b/i))) return Math.round(num(m[1])*2204.62)+' lbs';
  if((m=text.match(/([\d,]+(?:\.\d+)?)\s*(?:short\s*tons?|tons?|\bt\b)\b/i)))return Math.round(num(m[1])*2000)+' lbs';
  if((m=text.match(/(?:weight|weighs?|gross\s*weight|gvw|gw)\D{0,12}?([\d,]{3,}(?:\.\d+)?)/i))) return Math.round(num(m[1]))+' lbs';
  return '';
}
const UNIT_RE = "(millimet(?:er|re)s?|mm|centimet(?:er|re)s?|cm|meters?|metres?|ft\\.?|feet|foot|inch(?:es)?|in\\.?|['\u2032\"\u2033]|m)";
function unitToInches(v,u){
  if(v==null||isNaN(v)) return null;
  if(!u) return v*12;
  u=u.toLowerCase().replace(/\.$/,'').trim();
  if(u==='"'||u==='\u2033'||u==='in'||u.startsWith('inch'))  return v;
  if(u==="'"||u==="''"||u==='\u2032'||u==='ft'||u==='feet'||u==='foot') return v*12;
  if(u==='mm'||u.startsWith('milli'))                        return v*0.0393700787;
  if(u==='cm'||u.startsWith('centi'))                        return v*0.393700787;
  if(u==='m'||u==='meter'||u==='meters'||u==='metre'||u==='metres') return v*39.3700787;
  return v*12;
}
function inchesToFtIn(inches){
  if(inches==null||isNaN(inches)) return null;
  let ft=Math.floor(inches/12), inch=Math.round(inches-ft*12);
  if(inch===12){ ft++; inch=0; }
  return ft+"'"+inch+'"';
}
function parseDimToken(tok, glob){
  tok=(tok||'').trim(); if(!tok) return null;
  let m;
  if((m=tok.match(/^(\d+(?:\.\d+)?)\s*['\u2032]\s*(\d+(?:\.\d+)?)\s*["\u2033]?$/)))
      return parseFloat(m[1])*12 + parseFloat(m[2]);
  if((m=tok.match(/^(\d+(?:\.\d+)?)\s*['\u2032]$/)))  return parseFloat(m[1])*12;
  if((m=tok.match(/^(\d+(?:\.\d+)?)\s*["\u2033]$/)))  return parseFloat(m[1]);
  if((m=tok.match(/^(\d+(?:\.\d+)?)\s*([a-zA-Z]+)?\.?$/)))
      return unitToInches(parseFloat(m[1]), (m[2]||glob||'')||null);
  return null;
}
function parseDimensions(text){
  let t=text.replace(/[\u00d7*]/g,'x').replace(/\s+by\s+/gi,' x ').replace(/(\d)\s*X\s*(\d)/g,'$1 x $2');
  const P="(\\d+(?:\\.\\d+)?(?:\\s*['\u2032]\\s*\\d+(?:\\.\\d+)?\\s*[\"\u2033]?)?\\s*"+UNIT_RE+"?)";
  const SEP="\\s*x\\s*";
  const GLOB="(?:\\s*\\(?\\s*"+UNIT_RE+"\\s*\\)?)?";
  const re=new RegExp(P+SEP+P+"(?:"+SEP+P+")?"+GLOB,"i");
  const m=t.match(re);
  if(m){
    const glob=m[7];
    const toks=[m[1],m[3],m[5]].filter(Boolean);
    const parts=toks.map(tk=>inchesToFtIn(parseDimToken(tk,glob))).filter(Boolean);
    if(parts.length>=2) return parts.join(' x ');
  }
  const lwh=t.match(new RegExp("\\bL\\b\\s*:?\\s*(\\d+(?:\\.\\d+)?)\\s*"+UNIT_RE+"?[\\s\\S]{0,20}?\\bW\\b\\s*:?\\s*(\\d+(?:\\.\\d+)?)\\s*"+UNIT_RE+"?[\\s\\S]{0,20}?\\bH\\b\\s*:?\\s*(\\d+(?:\\.\\d+)?)\\s*"+UNIT_RE+"?","i"));
  if(lwh){
    const L=unitToInches(parseFloat(lwh[1]),lwh[2]),W=unitToInches(parseFloat(lwh[3]),lwh[4]),H=unitToInches(parseFloat(lwh[5]),lwh[6]);
    const p=[L,W,H].map(inchesToFtIn).filter(Boolean);
    if(p.length>=2) return p.join(' x ');
  }
  const grab=(words)=>{
    let a=t.match(new RegExp("(\\d+(?:\\.\\d+)?)\\s*"+UNIT_RE+"?\\s*(?:"+words+")","i"));
    if(a) return unitToInches(parseFloat(a[1]),a[2]);
    let b=t.match(new RegExp("(?:"+words+")\\D{0,6}?(\\d+(?:\\.\\d+)?)\\s*"+UNIT_RE+"?","i"));
    if(b) return unitToInches(parseFloat(b[1]),b[2]);
    return null;
  };
  const L=grab('long|length'),W=grab('wide|width'),H=grab('high|tall|height');
  const parts=[L!=null&&('L '+inchesToFtIn(L)),W!=null&&('W '+inchesToFtIn(W)),H!=null&&('H '+inchesToFtIn(H))].filter(Boolean);
  return parts.length? parts.join(' x '):'';
}

function inPeriod(dateISO, period){
  if(!dateISO) return false;
  const d=new Date(dateISO+'T00:00:00'), now=new Date();
  const y=d.getFullYear();
  if(period==='overall') return true;
  if(period.startsWith('year:')) return y===parseInt(period.split(':')[1]);
  if(period==='day'){ return d.toDateString()===now.toDateString(); }
  if(period==='week'){ const s=new Date(now); s.setDate(now.getDate()-now.getDay()); s.setHours(0,0,0,0);
    const e=new Date(s); e.setDate(s.getDate()+7); return d>=s && d<e; }
  if(period==='month'){ return y===now.getFullYear() && d.getMonth()===now.getMonth(); }
  if(period.startsWith('Q')){ const q=parseInt(period[1]); const mo=d.getMonth();
    const qs={1:[0,2],2:[3,5],3:[6,8],4:[9,11]}[q]; return y===now.getFullYear() && mo>=qs[0] && mo<=qs[1]; }
  return true;
}

function priceNum(v){ if(v==null||v==='') return 0; const n=parseFloat(String(v).replace(/[^0-9.-]/g,'')); return isNaN(n)?0:n; }
function itemPrice(it){ return priceNum(it&&it.price); }
function quotePriceTotal(q){ const items=quoteItems(q); let s=items.reduce((a,it)=>a+itemPrice(it),0); if(!s) s=priceNum(q&&q.price); return s; }
function fmtMoney(n){ n=Number(n)||0; return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function vol(q){ const items=quoteItems(q); return items.reduce((a,it)=>a+itemVol(it),0); }
function metrics(list){
  const won=list.filter(q=>q.status==='Won').length;
  const loss=list.filter(q=>q.status==='Loss').length;
  const pending=list.filter(q=>q.status==='Pending Feedback').length;
  const total=list.length;
  const shipments=list.reduce((a,q)=>a+vol(q),0);
  const winPct = total? Math.round((won/total)*100) : 0;
  const decidedPct = (won+loss)? Math.round((won/(won+loss))*100) : 0;
  return {total,won,loss,pending,winPct,decidedPct,shipments};
}
function needToSend(list, dayThreshold){
  return list.filter(q=> !q.dateSent && q.dateReceived && hoursSince(q.dateReceived) > dayThreshold*24);
}
function needFollowUp(list, dayThreshold){
  return list.filter(q=> !q.followUpDate && q.status==='Pending Feedback' &&
    (q.dateSent? daysSince(q.dateSent) : daysSince(q.dateReceived)) > dayThreshold);
}

function utilTeamAvg(w,region,office){

function utilStripSuffix(name){

/* ---- Parser: ESD / GSM / Team / LAE Headcount / Heavy Haul ---- */
function parseUtilization(sheets){
  const num=v=>{ if(v==null||v==='')return null; if(typeof v==='number')return isNaN(v)?null:v; const n=parseFloat(String(v).replace(/[,%\s]/g,'')); return isNaN(n)?null:n; };
  const norm=v=>String(v==null?'':v).trim();
  for(const sh of sheets){
    const rows=sh.rows||[]; if(!rows.length) continue;
    let hdr=-1,esdC=-1,gsmC=-1,teamC=-1,hcC=-1,metricC=-1;
    for(let i=0;i<Math.min(rows.length,20);i++){
      const low=(rows[i]||[]).map(c=>norm(c).toLowerCase());
      const ei=low.indexOf('esd');
      if(ei>=0){ hdr=i; esdC=ei; gsmC=low.indexOf('gsm'); teamC=low.indexOf('team');
        hcC=low.findIndex(x=>x.includes('headcount'));
        metricC=low.findIndex(x=>x.includes('heavy haul')); if(metricC<0) metricC=(rows[i]||[]).length-1;
        break; }
    }
    if(hdr<0) continue;
    const regions={}, offices={}, teams={}; let total=null, curR='', curO='';
    for(let i=hdr+1;i<rows.length;i++){
      const r=rows[i]||[];
      const esd=norm(r[esdC]), gsm=gsmC>=0?norm(r[gsmC]):'', team=teamC>=0?norm(r[teamC]):'';
      const esdL=esd.toLowerCase(), gsmL=gsm.toLowerCase(), teamL=team.toLowerCase();
      const metric=num(r[metricC]); const hc=hcC>=0?num(r[hcC]):null;
      if(esd && esdL!=='total'){ curR=esd; curO=''; }
      if(esdL==='total'){ if(metric!=null) total={util:metric,headcount:hc}; continue; }
      if(gsmL==='total'){ if(curR && metric!=null) regions[curR]={util:metric,headcount:hc}; curO=''; continue; }
      if(gsm && gsmL!=='total') curO=gsm;
      if(teamL==='total'){ if(curR && curO && metric!=null){ (offices[curR]=offices[curR]||{})[curO]={util:metric,headcount:hc}; } continue; }
      if(team && teamL!=='total'){ if(curR && curO && metric!=null){ teams[curR]=teams[curR]||{}; (teams[curR][curO]=teams[curR][curO]||{})[team]={util:metric,headcount:hc}; } }
    }
    if(Object.keys(regions).length) return {regions,offices,teams,total};
  }
  return null;
}
function detectUtilWeek(sheets){
  let year=null,week=null;
  sheets.forEach(sh=>(sh.rows||[]).forEach(r=>(r||[]).forEach(c=>{
    if(typeof c==='string'){ const y=c.match(/FiscalYear\s+is\s+(\d{4})/i); if(y)year=+y[1];
      const w=c.match(/FiscalWeek[^\d]*(\d{1,2})/i); if(w)week=+w[1]; } })));
  return {year,week};
}

function toTitle(s){ return String(s||'').toLowerCase().replace(/\b([a-z])/g,(m,c)=>c.toUpperCase()).replace(/\b(Llc|Ll|Oh|La|Wv|Usa|Dba|Ii|Iii|Iv|Vi|Vii)\b/g,x=>x.toUpperCase()); }

function fmtUSDk(v){ if(v==null||isNaN(v))return '—'; if(Math.abs(v)>=1000) return '$'+(Math.round(v/100)/10).toLocaleString('en-US')+'k'; return '$'+Math.round(v).toLocaleString('en-US'); }

function parseAging(sheets){
  const num=v=>{ if(v==null||v==='')return null; if(typeof v==='number')return isNaN(v)?null:v; const n=parseFloat(String(v).replace(/[,$%\s]/g,'')); return isNaN(n)?null:n; };
  const norm=v=>String(v==null?'':v).trim();
  for(const sh of sheets){ const rows=sh.rows||[]; if(!rows.length) continue;
    let bucketRow=-1, repRow=-1;
    for(let i=0;i<Math.min(rows.length,15);i++){ const c0=norm((rows[i]||[])[0]).toLowerCase();
      if(c0.includes('invoice age')) bucketRow=i;
      if(c0==='account rep') repRow=i; }
    if(repRow<0 && bucketRow<0) continue;
    if(repRow<0) repRow=bucketRow+1;
    const brow=(bucketRow>=0?rows[bucketRow]:rows[repRow])||[];
    const labels=[]; for(let c=1;c<brow.length;c++){ const l=norm(brow[c]); if(l) labels.push({c,l}); }
    if(!labels.length) continue;
    const totalIdx=labels.findIndex(x=>x.l.toLowerCase()==='total');
    const bkts=labels.filter((x,i)=>i!==totalIdx);
    const buckets=bkts.map(x=>x.l), bucketCols=bkts.map(x=>x.c);

    const reps=[]; const totals={}; buckets.forEach(b=>totals[b]=0); let grand=0;
    for(let i=repRow+1;i<rows.length;i++){ const r=rows[i]||[]; const name=norm(r[0]);

      buckets.forEach((b,k)=>{ const v=num(r[bucketCols[k]])||0; vals[b]=v; totals[b]+=v; rowSum+=v; });
      const total= totalCol!=null? (num(r[totalCol])||rowSum) : rowSum;

function parseClose(sheets){
  const num=v=>{ if(v==null||v==='')return null; if(typeof v==='number')return isNaN(v)?null:v; const n=parseFloat(String(v).replace(/[,$%\s]/g,'')); return isNaN(n)?null:n; };
  const norm=v=>String(v==null?'':v).trim();
  for(const sh of sheets){ const rows=sh.rows||[]; if(!rows.length) continue;
    let hdr=-1, map={};
    for(let i=0;i<Math.min(rows.length,10);i++){ const low=(rows[i]||[]).map(c=>norm(c).toLowerCase());
      if(low.includes('customer name') && low.includes('rep name')){ hdr=i;
        const find=names=>{ for(const n of names){ const idx=low.indexOf(n); if(idx>=0)return idx; } return -1; };
        map={ year:find(['fiscal year']), week:find(['fiscal week']), rate:find(['rate type']), event:find(['event type']),
          team:find(['sales team']), customer:find(['customer name']), rep:find(['rep name']), sup:find(['ar supervisor']),
          teus:find(['t52 dnb teus','teus']), lastob:find(['last ob call']), ytd:find(['ytd shipments']),
          brtd:find(['br to date']), br:find(['br']) };
        break; } }
    if(hdr<0) continue;
    const out=[]; const fill={year:'',week:'',rate:'',event:''};
    for(let i=hdr+1;i<rows.length;i++){ const r=rows[i]||[];
      if(norm(r[0]).toLowerCase().startsWith('applied filter')) break;
      const cust=map.customer>=0?norm(r[map.customer]):''; if(!cust) continue;
      const gv=k=>{ const idx=map[k]; return idx>=0?r[idx]:null; };
      ['year','week','rate','event'].forEach(k=>{ const v=norm(gv(k)); if(v) fill[k]=v; });
      out.push({ year:fill.year, week:fill.week, rateType:fill.rate, eventType:fill.event,
        team:norm(gv('team')), customer:cust, rep:norm(gv('rep')), supervisor:norm(gv('sup')),
        teus:num(gv('teus')), lastOB:norm(gv('lastob')), ytd:num(gv('ytd')), br:num(gv('br')), brToDate:num(gv('brtd')) });
    }
    if(out.length) return {rows:out};
  }
  return null;
}

function inferType(seg){
  const s=(seg||'').toLowerCase();

  if(/rig(ging)?/.test(s) && /(oog|out[\s-]*of[\s-]*gauge|over[\s-]*dimensional|oversize)/.test(s)) return 'Rigging + OOG';
  if(/rig(ging)?/.test(s) && /line\s*haul/.test(s)) return 'Rigging + LH';
  if(/rig(ging)?|crane/.test(s)) return 'Rigging';
  if(/(oog|out[\s-]*of[\s-]*gauge|over[\s-]*dimensional|oversize)/.test(s) && /line\s*haul/.test(s)) return 'OOG + LH';
  if(/(oog|out[\s-]*of[\s-]*gauge|over[\s-]*dimensional|oversize)/.test(s)) return 'OOG';
  if(/\brfq\b|\bbid\b|multiple\s+lanes/.test(s)) return 'RFQ';
  if(/line\s*haul|flatbed|step\s*deck|\brgn\b|dry\s*van|reefer|\bvan\b/.test(s)) return 'Line Haul';
  return '';
}
function cleanLoc(s){ s=(s||'').trim().replace(/\s+/g,' ').replace(/,\s*([A-Za-z]{2})\b/, function(x,st){ return ', '+st.toUpperCase(); }); return s; }
function parseEmailItems(text){
  if(!text || !text.trim()) return [];
  const items=[]; const seen=new Set(); let m;
  const laneRe=/([A-Z][A-Za-z.'\-]+(?:\s+[A-Z][A-Za-z.'\-]+){0,3},\s*[A-Za-z]{2}(?:\s+\d{5})?)\s*(?:->|=>|\u2192|\bto\b|\bthru\b|\bvia\b)\s*([A-Z][A-Za-z.'\-]+(?:\s+[A-Z][A-Za-z.'\-]+){0,3},\s*[A-Za-z]{2}(?:\s+\d{5})?)/g;
  const marks=[];
  while((m=laneRe.exec(text))!==null){
    const st1=(m[1].match(/,\s*([A-Za-z]{2})/)||[])[1], st2=(m[2].match(/,\s*([A-Za-z]{2})/)||[])[1];
    if(st1 && st2 && US_STATES[st1.toUpperCase()] && US_STATES[st2.toUpperCase()])
      marks.push({i:m.index, end:laneRe.lastIndex, o:cleanLoc(m[1]), d:cleanLoc(m[2])});
  }
  if(marks.length){
    for(let k=0;k<marks.length;k++){
      const seg=text.slice(marks[k].i, (k+1<marks.length?marks[k+1].i:Math.min(text.length, marks[k].end+240)));
      const it={ quoteType:inferType(seg), origin:marks[k].o, destination:marks[k].d,
        dimensions:parseDimensions(seg), weight:parseWeight(seg), volume:parseVolume(seg)||'1', price:'' };
      const key=(it.origin+'|'+it.destination+'|'+it.dimensions+'|'+it.weight).toLowerCase();
      if(!seen.has(key)){ seen.add(key); items.push(it); }
    }
    if(items.length) return items;
  }
  const segRe=/(?:^|\n)\s*(?:(?:load|shipment|lane|item|unit)s?\s*#?\s*\d+|\(?\d{1,2}[\).\]]\s)/ig;
  const idxs=[]; while((m=segRe.exec(text))!==null){ idxs.push(m.index); }
  if(idxs.length>=2){
    for(let k=0;k<idxs.length;k++){
      const seg=text.slice(idxs[k], k+1<idxs.length?idxs[k+1]:text.length);
      const lane=extractLane(seg); const dims=parseDimensions(seg), wt=parseWeight(seg), vv=parseVolume(seg);
      if(lane.origin||lane.destination||dims||wt){
        items.push({ quoteType:inferType(seg), origin:lane.origin, destination:lane.destination,
          dimensions:dims, weight:wt, volume:vv||'1', price:'' });
      }
    }
    if(items.length) return items;
  }
  return items;
}

function saveEditQuote(){

  if(a.enteredBy){ q.rep=a.rep; q.enteredBy=a.enteredBy; }

  q.office=val('eqOffice');

  q.dateReceived=val('eqReceived')||todayISO(); q.dateSent=val('eqSent');

let DASH_SEARCH='';
function quoteMatches(q, term){
  term=(term||'').toLowerCase().trim(); if(!term) return true;
  const items=quoteItems(q);
  const hay=[q.customerName,q.subject,q.office,q.status,q.quoteType,q.dateReceived,q.dateSent,q.followUpDate,
    items.map(it=>[it.origin,it.destination,it.quoteType,it.dimensions,it.weight].join(' ')).join(' ')
  ].join(' ').toLowerCase();
  return term.split(/\s+/).every(t=>hay.indexOf(t)>=0);
}

function quotesTable(list, editable, showRep){
  if(!list.length) return `<div class="card"><div class="empty">No quotes match. Adjust your search or add one from New Quote.</div></div>`;
  const rows=list.map(q=>{
    const items=quoteItems(q); const first=items[0]||{}; const more=items.length>1;
    const laneBadge=more?` <span class="pill vol" title="${items.length} line items / lanes">+${items.length-1}</span>`:'';
    const lane=(first.origin||first.destination)? `${esc(first.origin||'?')} → ${esc(first.destination||'?')}`:'—';
    const total=quotePriceTotal(q);
    const repCell = showRep? (editable
        ? `<td><select class="mini-input" onchange="assignRep('${q.id}',this.value)">${repOptions(q.rep)}</select></td>`
        : `<td>${esc(repName(q.rep))}</td>`):'';
    const officeCell = editable
        ? `<td><select class="mini-input" onchange="updateField('${q.id}','office',this.value)">${officeOptions(q.rep, q.office||'')}</select></td>`
        : `<td>${q.office?esc(q.office):'—'}</td>`;
    const volCell = (editable && !more)
        ? `<td><input type="number" min="1" class="mini-num" value="${vol(q)}" onchange="updateField('${q.id}','volume',this.value)"></td>`
        : `<td><span class="pill vol">×${vol(q)}</span></td>`;
    const typeCell = `<td><span class="pill type">${esc(first.quoteType||q.quoteType||'')}</span>${more?` <span class="pill type" title="mixed types">+${items.length-1}</span>`:''}</td>`;
    const priceCell = editable
        ? (more
            ? `<td><strong>${total?fmtMoney(total):'—'}</strong></td>`
            : `<td><div style="display:flex;align-items:center;gap:3px"><span style="color:var(--muted)">$</span><input type="number" min="0" step="0.01" class="mini-num" style="width:92px" value="${(first.price!==''&&first.price!=null)?esc(String(first.price)):''}" placeholder="0.00" onchange="updateField('${q.id}','price',this.value)"></div></td>`)
        : `<td>${total?fmtMoney(total):'—'}</td>`;
    return `<tr>
      ${repCell}
      ${officeCell}
      <td><strong>${esc(q.customerName)}</strong>${artBadge(q)}<div style="font-size:11px;color:var(--muted)">${esc(q.subject||'')}</div></td>
      <td>${lane}${laneBadge}</td>
      <td>${esc(first.dimensions||'—')}<div style="font-size:11px;color:var(--muted)">${esc(first.weight||'')}</div></td>
      ${volCell}
      ${typeCell}
      ${editable
        ? `<td><div class="qlog-dates">
             <div class="dl"><b>Recv</b><span class="dtxt">${fmtDate(q.dateReceived)}</span></div>
             <div class="dl"><b>Sent</b><input type="date" class="mini-input" value="${q.dateSent||''}" onchange="updateField('${q.id}','dateSent',this.value)"></div>
             <div class="dl"><b>F/U</b><input type="date" class="mini-input" value="${q.followUpDate||''}" onchange="updateField('${q.id}','followUpDate',this.value)"></div>
           </div></td>`
        : `<td><div class="qlog-dates">
             <div class="dl"><b>Recv</b><span class="dtxt">${fmtDate(q.dateReceived)}</span></div>
             <div class="dl"><b>Sent</b><span class="dtxt">${fmtDate(q.dateSent)}</span></div>
             <div class="dl"><b>F/U</b><span class="dtxt">${fmtDate(q.followUpDate)}</span></div>
           </div></td>`}
      ${editable?`<td><select class="mini-input" onchange="updateField('${q.id}','status',this.value)">${STATUSES.map(s=>`<option ${s===q.status?'selected':''}>${s}</option>`).join('')}</select></td>`:`<td>${statusPill(q.status)}</td>`}
      ${priceCell}
      ${editable?`<td><div class="qlog-acts"><button class="icon-btn" title="Edit quote" onclick="openEditQuote('${q.id}')">✏️</button><button class="icon-btn cq" title="Generate customer quote" onclick="openCustomerQuote('${q.id}')">📄</button><button class="icon-btn del" title="Delete quote" onclick="deleteQuote('${q.id}')">🗑️</button></div></td>`:''}
    </tr>`;
  }).join('');
  return `
  <div class="card">
    <div class="card-head"><h3>Quote Log <span style="color:var(--muted);font-weight:500;font-size:13px">(${list.length})</span></h3></div>
    <div class="table-wrap qlog"><table class="qlog-table">
      <colgroup>
        ${showRep?'<col style="width:9%">':''}
        <col style="width:8%"><col style="width:18%"><col style="width:15%"><col style="width:11%"><col style="width:4%"><col style="width:7%">
        <col style="width:12%"><col style="width:9%"><col style="width:7%">${editable?'<col style="width:9%">':''}
      </colgroup>
      <thead><tr>
        ${showRep?'<th>Rep</th>':''}
        <th>Office</th><th>Customer / Subject</th><th>Lane</th><th>Dims / Weight</th><th>Vol</th><th>Type</th>
        <th>Dates</th><th>Status</th><th>Price</th>${editable?'<th>Actions</th>':''}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}
function updateField(id,field,value){
  const all=DB.quotes(); const q=all.find(x=>x.id===id); if(!q)return;
  q[field]=value;
  const ITEMF=['quoteType','origin','destination','dimensions','weight','volume','price'];
  if(ITEMF.indexOf(field)>=0){ if(!Array.isArray(q.items)||!q.items.length){ q.items=quoteItems(q); } q.items[0][field]=value; }
  DB.saveQuotes(all);
  route(); toast('Updated');
}
/* Assign a rep to a quote — routes ART selections to their mentor AR and preserves the ART tag. */
function assignRep(id,selU){
  const all=DB.quotes(); const q=all.find(x=>x.id===id); if(!q)return;
  const prev=q.rep; const a=resolveAssign(selU);
  if(a.enteredBy){ q.rep=a.rep; q.enteredBy=a.enteredBy; }
  else { q.rep=a.rep; if(a.rep!==prev) q.enteredBy=''; }
  DB.saveQuotes(all); route(); toast('Rep updated');
}
function deleteQuote(id){
  if(!confirm('Delete this quote? This cannot be undone.'))return;
  DB.saveQuotes(DB.quotes().filter(x=>x.id!==id)); route(); toast('Quote deleted');
}

let RP_REP='all', RP_OFFICE='all', RP_BROKER='all', RP_VIEW='list';
/* flat list of every rep prospect, each tagged with its owner rep (__rep) */
function allRepProspects(){
  const store=DB.repprospects()||{}; const out=[];
  Object.keys(store).forEach(repU=>{ (store[repU]||[]).forEach(p=>out.push(Object.assign({__rep:repU},p))); });
  return out;
}
function repProspectsFor(repU){ const all=DB.repprospects(); return all[repU]||[]; }
function setRepProspectsFor(repU,arr){ const all=DB.repprospects(); all[repU]=arr; DB.saveRepProspects(all); }
/* locate a prospect by id across all reps → {repU, arr, p} (arr & p are live refs to save) */
function findRepProspect(id){ const store=DB.repprospects()||{};
  for(const repU of Object.keys(store)){ const arr=store[repU]||[]; const p=arr.find(x=>x.id===id); if(p) return {repU,arr,p,store}; } return null; }
function rpOffices(){ const s=new Set(); (DB.reps()||[]).forEach(r=>(r.offices||[]).forEach(o=>{ if(o)s.add(o); }));
  allRepProspects().forEach(p=>{ if(p.office)s.add(p.office); }); return [...s].sort((a,b)=>a.localeCompare(b)); }
function rpBrokers(){ const s=new Set(); allRepProspects().forEach(p=>{ if(p.broker)s.add(p.broker); }); return [...s].sort((a,b)=>a.localeCompare(b)); }
function rpFiltered(){
  let list=allRepProspects();
  if(RP_REP!=='all')    list=list.filter(p=>p.__rep===RP_REP);
  if(RP_OFFICE!=='all') list=list.filter(p=>(p.office||'')===RP_OFFICE);
  if(RP_BROKER!=='all') list=list.filter(p=>(p.broker||'')===RP_BROKER);
  return list;
}
/* Offices a given rep is attached to (their own; an ART with none inherits their mentor AR's). */
function rpRepOffices(repU){
  if(!repU) return [];
  let offs=repOffices(repU);
  if(!offs.length && isART(repU)){ const m=repMentor(repU); if(m) offs=repOffices(m); }
  return offs;
}
/* Office dropdown. When a rep is given, show ONLY that rep's offices (as set in Manage Reps).
   If the rep has no offices attached, the list is empty — only "— No office —" shows.
   The currently-saved office is always kept as an option so nothing is silently lost. */
function rpOfficeSelectOptions(sel, repU){
  let list;
  if(repU!=null && repU!==''){ list=rpRepOffices(repU); }   /* strictly this rep's offices; empty if none */
  else { list=rpOffices(); }                                 /* no rep context -> all known offices */
  if(sel && !list.includes(sel)) list=[sel,...list];
  const opts=[`<option value="" ${!sel?'selected':''}>— No office —</option>`]
    .concat(list.map(o=>`<option value="${esc(o)}" ${sel===o?'selected':''}>${esc(o)}</option>`)); return opts.join(''); }

function saveRepProspectEdit(id){
  const hit=findRepProspect(id); if(!hit) return; const p=hit.p; const newRep=val('rpeRep');
  const prevProg=p.progress;
  p.broker=val('rpeBroker'); p.customer=val('rpeCustomer')||'(Unnamed)'; p.office=val('rpeOffice');
  p.service=val('rpeService'); p.volume=val('rpeVolume'); p.frequency=val('rpeFreq'); p.progress=val('rpeProgress');
  const newProg=p.progress;
  if(newRep && newRep!==hit.repU){
    setRepProspectsFor(hit.repU, repProspectsFor(hit.repU).filter(x=>x.id!==id));
    const {__rep, ...clean}=p; const arr=repProspectsFor(newRep); arr.push(clean); setRepProspectsFor(newRep,arr);
    closeModal(); route();
    if(newProg==='Turning to customer' && prevProg!=='Turning to customer'){ promptPromoteRepProspect(id); }
    else toast('Prospect moved to '+repName(newRep));
    return;
  }
  setRepProspectsFor(hit.repU,hit.arr); closeModal(); route();
  if(newProg==='Turning to customer' && prevProg!=='Turning to customer'){ promptPromoteRepProspect(id); }
  else toast('Prospect updated');
}
function updateRepProspect(id,field,value){
  const hit=findRepProspect(id); if(!hit) return;
  const prev=hit.p[field];
  hit.p[field]=value; setRepProspectsFor(hit.repU,hit.arr);
  if(field==='progress' && value==='Turning to customer' && prev!=='Turning to customer'){ route(); promptPromoteRepProspect(id); return; }
  if(field==='progress'||field==='office'||field==='broker'){ route(); }
  toast('Prospect updated');
}

  const addCust=chk('rppCust'), closed=chk('rppClosed'), mkQuote=chk('rppQuote'), remove=chk('rppRemove');
  if(!addCust && !mkQuote && !remove){ toast('Pick at least one action'); return; }
  const done=[];
  if(addCust){
    const c=DB.customers(); const key=(p.customer||'(Unnamed)').trim();
    c[key]=Object.assign({}, c[key], {
      manual:true, closed:!!closed, service:p.service, volume:p.volume,
      fromBroker:p.broker, office:p.office||'',
      notes:((c[key]&&c[key].notes)||[]).concat(p.notes||[])
    });
    if(closed) c[key].closedAt=new Date().toISOString();
    DB.saveCustomers(c);
    done.push(closed?'Closed Account':'Customer');
  }
  if(mkQuote){
    const a=resolveAssign(hit.repU);
    const item={ quoteType:(p.service||QUOTE_TYPES[0]), origin:'', destination:'', dimensions:'', weight:'',
      volume:(String(p.volume||'1').trim()||'1'), price:'' };
    const q={ id:uid(), rep:a.rep, enteredBy:a.enteredBy, office:p.office||'',
      customerName:(p.customer||'(Unnamed)'), subject:'Promoted from prospect'+(p.broker?(' — '+p.broker):''),
      origin:'', destination:'', dimensions:'', weight:'', volume:item.volume, price:'', quoteType:item.quoteType,
      dateReceived:todayISO(), dateSent:'', status:'Pending Feedback', followUpDate:'', items:[item] };
    const all=DB.quotes(); all.push(q); DB.saveQuotes(all);
    done.push('Quote');
  }
  if(remove){ setRepProspectsFor(hit.repU, repProspectsFor(hit.repU).filter(x=>x.id!==id)); }
  else { hit.p.progress='Turning to customer'; setRepProspectsFor(hit.repU,hit.arr); }
  closeModal(); route();
  toast(done.length? ('Promoted → '+done.join(' + ')) : 'Kept in pipeline');
}

function parseWeightLbs(w){ if(!w)return 0; const m=w.match(/([\d.]+)/); return m?Math.round(parseFloat(m[1])):0; }
function buildCustomerData(sourceList, period, metaStore){
  const src = sourceList || DB.quotes();
  const per = period || CUST_FILTER;
  const all = src.filter(q=>inPeriod(q.dateReceived,per));
  const map={};
  all.forEach(q=>{
    const key=(q.customerName||'(Unknown)').trim();
    if(!map[key]) map[key]={name:key,total:0,won:0,loss:0,pending:0,shipments:0,weightLbs:0,lanes:new Set(),types:{}};
    const c=map[key]; c.total++;
    quoteItems(q).forEach(it=>{
      const iv=itemVol(it); c.shipments+=iv;
      c.weightLbs+=parseWeightLbs(it.weight)*iv;
      if(it.origin||it.destination) c.lanes.add((it.origin||'?')+' → '+(it.destination||'?'));
      const t=it.quoteType||q.quoteType; if(t) c.types[t]=(c.types[t]||0)+1;
    });
    if(q.status==='Won')c.won++; else if(q.status==='Loss')c.loss++; else c.pending++;
  });
  const custMeta = metaStore || DB.customers();
  const result = Object.values(map).map(c=>{
    c.winPct=c.total?Math.round((c.won/c.total)*100):0;
    c.laneCount=c.lanes.size;
    c.topType=Object.entries(c.types).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';
    const meta=custMeta[c.name]||{};
    c.desc=meta.desc||''; c.rank=(meta.rank!=null&&meta.rank!=='')?parseInt(meta.rank):null;
    c.fav=!!meta.fav; c.notes=meta.notes||[]; c.manual=!!meta.manual; c.closed=!!meta.closed;
    c.service=meta.service||''; c.fromBroker=meta.fromBroker||'';
    return c;
  });
  /* Merge in manually-added customers (incl. Closed Accounts moved from prospects) that have no quotes yet.
     Only for the real customer store — not when aggregating an NSE's quote-derived board. */
  if(!metaStore){
    Object.keys(custMeta).forEach(name=>{
      const meta=custMeta[name]; if(!meta||!meta.manual) return;
      if(map[name]) return;
      result.push({ name, total:0, won:0, loss:0, pending:0, shipments:0, weightLbs:0,
        laneCount:0, topType:'—', winPct:0,
        desc:meta.desc||'', rank:(meta.rank!=null&&meta.rank!=='')?parseInt(meta.rank):null,
        fav:!!meta.fav, notes:meta.notes||[], manual:true, closed:!!meta.closed,
        service:meta.service||'', volume:meta.volume||'', fromBroker:meta.fromBroker||'', office:meta.office||'' });
    });
  }
  return result;
}

   Produces a single self-contained HTML file with the current data
   embedded. When a teammate opens it, the data auto-loads once. */
function shareApp(){
  try{
    const token=String(Date.now())+Math.random().toString(36).slice(2,6);
    const dataStr=JSON.stringify(snapshot()).replace(/</g,'\\u003c');
    const inject='<script>window.__SHARE_TOKEN__="'+token+'";window.__SHARE_DATA__='+dataStr+';\x3c/script>\n';
    const clone=document.documentElement.cloneNode(true);
    ['sidebar','main','modalBox','toast'].forEach(id=>{ const el=clone.querySelector('#'+id); if(el) el.innerHTML=''; });
    const mb=clone.querySelector('#modalBg'); if(mb) mb.className='modal-bg';
    // remove any PRIOR embedded share snapshot (DOM-based so it can't match code literals):
    // an injected script's text STARTS with window.__SHARE_TOKEN__ ; the main script starts with a comment.
    clone.querySelectorAll('script').forEach(s=>{
      if((s.textContent||'').replace(/^\s+/,'').indexOf('window.__SHARE_TOKEN__')===0) s.remove();
    });
    let html='<!DOCTYPE html>\n'+clone.outerHTML;
    const idx=html.indexOf('<script>');   // now the first <script> is the main app script
    if(idx===-1){ alert('Could not build the share file.'); return; }
    html=html.slice(0,idx)+inject+html.slice(idx);
    const qn=DB.quotes().length;
    download('Team Vest Demo - SHARED '+todayISO()+'.html', html, 'text/html');
    toast('Share file created ('+qn+' quotes embedded)');
  }catch(e){ console.error(e); alert('Could not create the share file.'); }
}
const CSV_COLS=['id','rep','repName','nse','office','customerName','subject','origin','destination',
  'dimensions','weight','volume','price','quoteType','status','dateReceived','dateSent','followUpDate'];
function csvEscape(v){ v=(v==null?'':String(v));
  return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function exportCSV(){
  const reps=DB.reps()||[];
  const nseOf=u=>{ const r=reps.find(x=>x.u===u); return r?repNses(r).map(nseName).join(' | '):''; };
  const lines=[CSV_COLS.join(',')];
  DB.quotes().forEach(q=>{
    const row={...q, repName:repName(q.rep), nse:nseOf(q.rep)};
    lines.push(CSV_COLS.map(c=>csvEscape(row[c])).join(','));
  });

function importCSV(){ document.getElementById('importCsvFile').click(); }
function parseCSV(text){
  const rows=[]; let row=[], field='', i=0, inQ=false; text=text.replace(/^\uFEFF/,'');
  while(i<text.length){ const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQ=false; i++; continue; } field+=ch; i++; continue; }
    if(ch==='"'){ inQ=true; i++; continue; }
    if(ch===','){ row.push(field); field=''; i++; continue; }
    if(ch==='\r'){ i++; continue; }
    if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
    field+=ch; i++;
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.length && !(r.length===1 && r[0].trim()===''));
}
document.getElementById('importCsvFile').addEventListener('change',function(e){
  const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ applyCSV(r.result); }catch(err){ console.error(err); alert('Could not read that CSV.'); } };
  r.readAsText(f); this.value='';
});
function applyCSV(text){
  const rows=parseCSV(text); if(rows.length<2){ alert('CSV appears empty.'); return; }
  const header=rows[0].map(h=>h.trim());
  const idx={}; header.forEach((h,i)=>idx[h]=i);
  if(!('id' in idx) && !('customerName' in idx)){ alert('CSV must include at least a customerName column (an id column is recommended for updates).'); return; }
  const reps=DB.reps()||[];
  const repByName=n=>{ const r=reps.find(x=>x.name.toLowerCase()===(n||'').toLowerCase()); return r?r.u:''; };
  const quotes=DB.quotes(); const byId={}; quotes.forEach(q=>byId[q.id]=q);
  let updated=0, added=0;
  rows.slice(1).forEach(cols=>{
    const g=k=>{ const i=idx[k]; return i==null?undefined:(cols[i]!=null?cols[i].trim():''); };
    let rep=g('rep'); if((!rep || !reps.find(x=>x.u===rep)) && g('repName')) rep=repByName(g('repName')) || rep || '';
    const patch={
      office:g('office'),
      customerName:g('customerName'), subject:g('subject'), origin:g('origin'), destination:g('destination'),
      dimensions:g('dimensions'), weight:g('weight'), volume:g('volume'), price:g('price'), quoteType:g('quoteType'),
      status:g('status'), dateReceived:g('dateReceived'), dateSent:g('dateSent'), followUpDate:g('followUpDate')
    };
    Object.keys(patch).forEach(k=>{ if(patch[k]===undefined) delete patch[k]; });
    if(rep!==undefined && rep!=='') patch.rep=rep;
    const id=g('id');
    if(id && byId[id]){ Object.assign(byId[id],patch); updated++; }
    else { const q=Object.assign({id:id||uid(), rep:'', status:'Pending Feedback', volume:'1', dateReceived:todayISO()}, patch);
      quotes.push(q); byId[q.id]=q; added++; }
  });
  DB.saveQuotes(quotes); route();
  toast('CSV applied — '+updated+' updated, '+added+' added');
}

/* ---------- Tiny dependency-free XLSX reader (native DecompressionStream) ---------- */
(function(global){

      const localOff=u32(dv,off+42);
      const name=dec.decode(bytes.subarray(off+46,off+46+nameLen));
      const lNameLen=u16(dv,localOff+26), lExtraLen=u16(dv,localOff+28);

  const include=sheets.map(s=>{ const dd=pcDetectAny(s.rows); return dd? (pcExtract2(s.rows,dd).length>0):false; });
  return { fileName, sheets, sheetIdx:idx, include, headerRow:d.headerRow,
    map:Object.assign(pcBlankMap(), d.map), dimMode:d.dimMode, dimUnit:d.dimUnit, wtUnit:d.wtUnit };

function pcDetFromMap(m){ return {headerRow:m.headerRow, map:m.map, dimMode:m.dimMode, dimUnit:m.dimUnit, wtUnit:m.wtUnit}; }
function pcMapMaxCols(){ const rows=PC_MAP.sheets[PC_MAP.sheetIdx].rows; return rows.reduce((mx,r)=>Math.max(mx,r.length),0); }
function pcColOptions(sel){

  let opts=`<option value="-1" ${(sel==-1||sel==null)?'selected':''}>\u2014 none \u2014</option>`;
  for(let c=0;c<maxC;c++){ let raw=(hdr[c]!=null&&String(hdr[c]).trim()!=='')?hdr[c]:((hdr2[c]!=null&&String(hdr2[c]).trim()!=='')?hdr2[c]:''); const label=esc(raw!==''?String(raw).replace(/\s+/g,' ').trim():'(blank)');
    opts+=`<option value="${c}" ${String(sel)===String(c)?'selected':''}>${pcColLetter(c)} \u2014 ${label}</option>`; }
  return opts;
}
function pcUnitOptions(sel){ return ['in','ft','mm','cm','m'].map(u=>`<option ${sel===u?'selected':''}>${u}</option>`).join(''); }
function pcWtUnitOptions(sel){ return ['lbs','kg'].map(u=>`<option ${sel===u?'selected':''}>${u}</option>`).join(''); }
function pcMapSheet(v){ PC_MAP.sheetIdx=parseInt(v)||0; const d=pcDetectAny(PC_MAP.sheets[PC_MAP.sheetIdx].rows);

  else { PC_MAP.headerRow=0; PC_MAP.map=pcBlankMap(); } pcRenderMapper(); }

function pcMapMode(v){ PC_MAP.dimMode=v; pcRenderMapper(); }
function pcMapCol(field,v){ PC_MAP.map[field]=parseInt(v); pcRenderMapper(); }
function pcMapUnit(kind,v){ if(kind==='dim') PC_MAP.dimUnit=v; else PC_MAP.wtUnit=v; pcRenderMapper(); }

      <td>${(p.weight||0).toLocaleString()} lbs</td></tr>`).join('');
  const box=document.getElementById('modalBox');
  box.innerHTML=`<h3>\uD83E\uDDED Map Packing-List Columns</h3>
    <div class="card-sub" style="margin-bottom:14px">Confirm which columns the parser should use. We auto-detected them from your file \u2014 adjust anything that looks off, then build the project. Dimensions convert to feet-inches using the unit you pick.</div>
    <div class="map-grid">
      ${sheetSel}
      <div class="field-c"><label>Header row (row #)</label><input type="number" min="1" class="mini-input" value="${m.headerRow+1}" onchange="pcMapHeader(this.value-1)"></div>
    </div>
    <div class="map-grid" style="margin-top:12px">
      <div class="field-c"><label>Description / Item</label><select class="mini-input" onchange="pcMapCol('desc',this.value)">${pcColOptions(m.map.desc)}</select></div>
      <div class="field-c"><label>Pkg / ID</label><select class="mini-input" onchange="pcMapCol('pkg',this.value)">${pcColOptions(m.map.pkg)}</select></div>

    </div>
    <div style="margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:10px">

        <div style="margin-left:auto;display:flex;align-items:center;gap:6px"><span style="font-size:12px;color:var(--muted)">Unit</span><select class="mini-input" style="max-width:90px" onchange="pcMapUnit('dim',this.value)">${pcUnitOptions(m.dimUnit)}</select></div>

      <button class="btn btn-primary" style="width:auto" onclick="pcBuildFromMapper()">Build Project (${m.sheets.length>1?(selPages+' page'+(selPages>1?'s':'')):(pkgs.length+' pkgs')})</button>

function pcBuildFromMapper(){
  const M=PC_MAP; const sheets=M.sheets;
  const include = Array.isArray(M.include)? M.include : sheets.map((s,i)=> i===M.sheetIdx);
  const chosen=[];
  sheets.forEach((s,i)=>{
    if(sheets.length>1 && !include[i]) return;
    let det = (i===M.sheetIdx) ? pcDetFromMap(M) : pcDetectAny(s.rows);
    if(!det) return;
    const pkgs=pcExtract2(s.rows, det);
    if(!pkgs.length) return;
    const trucks=pcBuildTrucks(pkgs);
    const totalWeight=pkgs.reduce((a,p)=>a+(p.weight||0)*(parseInt(p.qty)||1),0);
    chosen.push({ name:s.name, packages:pkgs, trucks, totalWeight, dimUnit:det.dimUnit, wtUnit:det.wtUnit });
  });
  if(!chosen.length){ alert('No packages parsed from the selected page(s). Check the Header row and your dimension columns, and make sure at least one page is included.'); return; }
  const proj={ id:pcUID('prj'), name:(M.fileName||'Project').replace(/\.(xlsx|xls|csv)$/i,''), contract:'', origin:'', destination:'',
    createdAt:new Date().toISOString(), sourceSheet:chosen[0].name, dimUnit:chosen[0].dimUnit, wtUnit:chosen[0].wtUnit,
    rep:(PC_REP&&PC_REP!=='all')?PC_REP:'', lost:false, awarded:false, pkgSheets:chosen, activeSheet:0, services:{ drayage:[], transloading:[], craneRigging:[] } };
  pcSyncActiveSheet(proj);
  const all=DB.projects(); all.unshift(proj); DB.saveProjects(all);
  closeModal(); PC_OPEN=proj.id; go('projectcenter');
  const totPk=chosen.reduce((a,c)=>a+c.packages.length,0), totTk=chosen.reduce((a,c)=>a+c.trucks.length,0);
  toast(chosen.length+' page'+(chosen.length>1?'s':'')+' \u00b7 '+totPk+' packages \u2192 '+totTk+' trucks');
}

function pcProgress(p){
  const steps=['arrivedPort','discharged','pulled','returned'];
  const cs=pcSvc(p,'drayage');
  const per=cs.map(c=>{ const done=steps.filter(s=>c[s]).length; return {c,done,pct:Math.round(done/steps.length*100)}; });
  const done=per.reduce((a,x)=>a+x.done,0), total=cs.length*steps.length;
  return { steps, per, done, total, pct: total?Math.round(done/total*100):0,
    holds: cs.filter(c=>c.hold).length, past: cs.filter(pcPastLFD).length,
    containers: cs.length, returned: cs.filter(c=>c.returned).length };
}
function pcProgressBody(p){
  const pr=pcProgress(p);
  const stepLabels={arrivedPort:'Arrived Port',discharged:'Discharged',pulled:'Pulled',returned:'Returned'};
  const rows=pr.per.map(x=>{
    const chips=pr.steps.map(s=>`<span class="mstep ${x.c[s]?'on':''}">${x.c[s]?'\u2713':'\u25CB'} ${stepLabels[s]}</span>`).join(' ');
    const past=pcPastLFD(x.c);
    return `<tr>
      <td><strong>${esc(x.c.containerNo||'(no #)')}</strong>${x.c.hold?' <span class="hold-flag">\u2691 HOLD</span>':''}${past?' <span class="lfd-alert">PAST LFD</span>':''}</td>
      <td style="min-width:150px"><div class="mini-pbar"><i style="width:${x.pct}%"></i></div></td>

      <td><div class="pillbar">${chips}</div></td>
    </tr>`;
  }).join('');
  return `
    <div class="card-sub">Live milestone tracking across every container. Tick the checkboxes in the <strong>Drayage</strong> section below \u2014 these bars advance automatically.${p.awardedAt?(' Awarded '+fmtDateTime(p.awardedAt)+'.'):''}</div>
    <div style="margin:6px 0 14px"><div class="pbar"><i style="width:${pr.pct}%"></i></div>
      <div style="text-align:right;font-size:12px;color:var(--muted);margin-top:4px">${pr.done} of ${pr.total} milestones complete \u00b7 ${pr.pct}%</div></div>
    <div class="kpi-grid">
      ${kpi('Overall Complete', pr.pct+'%','b-green')}
      ${kpi('Containers', pr.containers,'b-blue')}
      ${kpi('Delivered / Returned', pr.returned,'b-navy')}
      ${kpi('Holds', pr.holds,'b-amber')}
      ${kpi('Past LFD', pr.past,'b-red')}
    </div>
    <div class="table-wrap"><table style="min-width:680px">
      <thead><tr><th>Container</th><th>Progress</th><th>Steps</th><th>Milestones</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="4" class="empty">No containers yet. Add one in the Drayage section to begin tracking.</td></tr>'}</tbody>
    </table></div>`;
}
function pcTruckLaneDefault(p,t){
  if(t.lane!=null && t.lane!=='') return t.lane;

  return (o||d)? (o||'?')+' \u2192 '+(d||'?') : '';
}

}

      <td><label class="statechk ${loaded?'on-load':''}"><input type="checkbox" ${loaded?'checked':''} onchange="pcTruckChk('${p.id}','${t.id}','loaded',this.checked)"><span class="state-dot ${loaded?'load':''}"></span>${loaded?'Loaded':'Not loaded'}</label></td>
      <td><label class="statechk ${delivered?'on-del':''}"><input type="checkbox" ${delivered?'checked':''} onchange="pcTruckChk('${p.id}','${t.id}','delivered',this.checked)"><span class="state-dot ${delivered?'del':''}"></span>${delivered?'Delivered':'In transit'}</label></td>
      <td>${t.manual?`<button class="rowbtn del" onclick="pcTruckDel('${p.id}','${t.id}')">\u2715</button>`:''}</td>

  const n=trucks.length, ld=trucks.filter(t=>t.loaded).length, dl=trucks.filter(t=>t.delivered).length;

  return `
    <div class="card-sub">Live truck status. Set each truck's <strong>lane</strong> and <strong>pickup / delivery</strong> dates, then check <strong>Loaded</strong> and <strong>Delivered</strong> \u2014 rows turn amber when loaded and green when delivered. Use <strong>\uFF0B Add Truck</strong> to add one manually.</div>

    </div>
    <div style="margin:2px 0 14px"><div class="pbar"><i style="width:${pct}%"></i></div></div>
    <div class="table-wrap"><table style="min-width:880px">
      <thead><tr><th>Truck #</th><th>Lane Details</th><th>Pickup Date</th><th>Delivery Date</th><th>Loaded</th><th>Delivered</th><th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan="7" class="empty">No trucks. Use \uFF0B Add Truck.</td></tr>'}</tbody>
    </table></div>`;
}
function pcTruckTrack(id,truckId,field,value){ const p=pcProject(id); if(!p)return; const t=(p.trucks||[]).find(x=>x.id===truckId); if(!t)return; t[field]=value; pcSaveProject(p); }
function pcTruckChk(id,truckId,field,checked){ const p=pcProject(id); if(!p)return; const t=(p.trucks||[]).find(x=>x.id===truckId); if(!t)return; t[field]=!!checked;
  if(field==='delivered'&&checked){ t.loaded=true; } if(field==='loaded'&&!checked){ t.delivered=false; }
  pcSaveProject(p); route(); toast(field==='loaded'?(checked?'Truck marked loaded':'Loaded cleared'):(checked?'Truck marked delivered':'Delivered cleared')); }
function pcTruckAdd(id){ const p=pcProject(id); if(!p)return; const trucks=p.trucks||(p.trucks=[]);
  let k=1; while(trucks.some(t=>t.id==='M'+k)) k++;
  trucks.push({ id:'M'+k, type:'Flatbed', manual:true, items:[], usedLen:0, weight:0, maxW:0, maxH:0, loadedH:0, flags:[], rate:'', lane:'', pickupDate:'', deliveryDate:'', loaded:false, delivered:false });

function pcOverallPct(p){
  const parts=[]; const trucks=pcAllTrucks(p);
  if(trucks.length) parts.push(trucks.filter(t=>t.delivered).length/trucks.length);
  const dr=pcSvc(p,'drayage'); if(dr.length) parts.push(dr.filter(c=>c.returned).length/dr.length);
  const tl=pcSvc(p,'transloading'); if(tl.length) parts.push(tl.filter(x=>x.loadedTruck).length/tl.length);
  if(!parts.length) return 0;
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100);
}

/* ---------------- Truck engine (conversions + packing) ---------------- */
const PC_TRUCKS={
  'Double Drop':{deckLen:29*12, deckH:24, cap:48000},
  'Stepdeck':   {deckLen:41*12, deckH:40, cap:44000},
  'Flatbed':    {deckLen:48*12, deckH:60, cap:48000}
};
const PC_LEGAL_H=162, PC_LEGAL_W=102;
function pcClassify(hIn){ if(hIn>120) return 'Double Drop'; if(hIn>102) return 'Stepdeck'; return 'Flatbed'; }
function pcNum(v){ if(v===''||v==null) return null; if(typeof v==='number') return isNaN(v)?null:v;
  const n=parseFloat(String(v).replace(/[, ]/g,'')); return isNaN(n)?null:n; }
function pcMoney(n){ return '$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pcUID(pref){ return (pref||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function pcBuildTrucks(packages){
  const pieces=[];
  packages.forEach(p=>{ const q=Math.max(1,parseInt(p.qty)||1); for(let i=0;i<q;i++) pieces.push({pkg:p.pkg,desc:p.desc,weight:p.weight,L:p.L,W:p.W,H:p.H}); });
  const byType={'Double Drop':[],'Stepdeck':[],'Flatbed':[]};
  pieces.forEach(p=>byType[pcClassify(p.H)].push(p));
  const trucks=[]; const cnt={'Double Drop':0,'Stepdeck':0,'Flatbed':0}; const pre={'Double Drop':'DD','Stepdeck':'SD','Flatbed':'FB'};
  Object.keys(byType).forEach(type=>{ const cfg=PC_TRUCKS[type]; let cur=null;
    byType[type].forEach(p=>{ const need=p.L||0;
      const fits=cur && (cur.usedLen+need<=cfg.deckLen) && (cur.weight+(p.weight||0)<=cfg.cap);
      if(!fits){ cnt[type]++; cur={id:pre[type]+cnt[type], type, items:[], usedLen:0, weight:0, maxW:0, maxH:0, rate:''}; trucks.push(cur); }
      cur.items.push(p); cur.usedLen+=need; cur.weight+=(p.weight||0);
      cur.maxW=Math.max(cur.maxW,p.W||0); cur.maxH=Math.max(cur.maxH,p.H||0);
    });
  });
  trucks.forEach(t=>{ const cfg=PC_TRUCKS[t.type]; t.loadedH=cfg.deckH+t.maxH; t.flags=[];
    if(t.maxW>PC_LEGAL_W) t.flags.push('Over-width');
    if(t.loadedH>PC_LEGAL_H) t.flags.push('Over-height');
    if(t.usedLen>cfg.deckLen) t.flags.push('Over-length'); });
  return trucks;
}

/* ---------------- Column detection + extraction ---------------- */
function pcNorm(s){ return (s==null?'':String(s)).replace(/[\r\n]+/g,' ').replace(/\s+/g,' ').trim().toLowerCase(); }
function pcDetect(rows){
  let best=null, bestScore=0;
  const kw=['pkg','description','q\'ty','qty','quantity','weight','dimension','length','width','height','unit','l x w x h'];
  const scan=Math.min(rows.length,40);
  for(let i=0;i<scan;i++){ const cells=rows[i]||[]; let score=0;
    cells.forEach(c=>{ const n=pcNorm(c); if(!n)return; kw.forEach(k=>{ if(n.includes(k)) score++; }); });
    if(score>bestScore){ bestScore=score; best=i; } }
  if(best==null||bestScore<2) return null;
  const hdr=rows[best].map(pcNorm);
  const find=pred=>{ for(let c=0;c<hdr.length;c++){ if(pred(hdr[c],c)) return c; } return -1; };
  let cL=-1,cW=-1,cH=-1,dimUnit='in';
  const cLen=find(h=>h==='length'||h==='l'||/\blength\b/.test(h));
  const cWid=find(h=>h==='width'||h==='w'||/\bwidth\b/.test(h));
  const cHei=find(h=>h==='height'||h==='h'||/\bheight\b/.test(h));
  if(cLen>=0&&cWid>=0&&cHei>=0){ cL=cLen; cW=cWid; cH=cHei;
    const uh=hdr[cLen]+' '+hdr[cWid]+' '+hdr[cHei];
    dimUnit=/\bmm\b/.test(uh)?'mm':/\bcm\b/.test(uh)?'cm':/\bft\b|feet|'/.test(uh)?'ft':/\bm\b/.test(uh)?'m':'in';
  } else {
    const cDim=find(h=>h.includes('dimension')||h.includes('l x w x h')||h.includes('lxwxh'));
    if(cDim>=0){ cL=cDim; cW=cDim+1; cH=cDim+2;
      const uh=hdr[cDim]||''; dimUnit=/\bmm\b/.test(uh)?'mm':/\bcm\b/.test(uh)?'cm':/\bft\b|feet|'/.test(uh)?'ft':/\bm\b/.test(uh)?'m':'in'; }
  }
  if(cL<0) return null;
  let cWeight=find(h=>h.includes('gross')&&h.includes('weight'));
  if(cWeight<0) cWeight=find(h=>h.includes('weight'));
  const wtUnit=(cWeight>=0 && /\bkg|kgs|kilogram/.test(hdr[cWeight]))?'kg':'lbs';
  const cQty=find(h=>h.includes("q'ty")||h.includes('qty')||h.includes('quantity'));
  let cPkg=find(h=>h.includes('pkg')&&h.includes('no')); if(cPkg<0) cPkg=find(h=>h.includes('pkg')); if(cPkg<0) cPkg=0;
  const cDesc=find(h=>h.includes('description'));
  const cGroup=find(h=>h==='group'||/\bgroup\b/.test(h));
  return {headerRow:best, cPkg, cDesc, cGroup, cQty, cWeight, cL, cW, cH, dimUnit, wtUnit};
}
function pcExtract(rows, det){
  const out=[];
  for(let i=det.headerRow+1;i<rows.length;i++){
    const r=rows[i]||[];
    const L=pcNum(r[det.cL]), W=pcNum(r[det.cW]), H=pcNum(r[det.cH]);
    if(L==null||W==null||H==null||L<=0||W<=0||H<=0) continue;
    const qty=Math.max(1, parseInt(pcNum(r[det.cQty])||1)||1);
    let wt=pcNum(det.cWeight>=0?r[det.cWeight]:0)||0; if(det.wtUnit==='kg') wt=wt*2.20462;
    const grp=det.cGroup>=0?String(r[det.cGroup]||'').trim():'';
    const itm=det.cDesc>=0?String(r[det.cDesc]||'').trim():'';
    let desc=[grp,itm].filter(Boolean).join(' – ') || itm || grp || 'Item';
    const pkg=r[det.cPkg]!=null && r[det.cPkg]!==''?r[det.cPkg]:(out.length+1);
    out.push({ pkg, group:grp, desc, qty, weight:Math.round(wt),
      L:unitToInches(L,det.dimUnit), W:unitToInches(W,det.dimUnit), H:unitToInches(H,det.dimUnit) });
  }
  return out;
}

/* ---------------- Upload ---------------- */
let PC_OPEN=null;
let PC_REP='all';
let PC_STATUS='active';
const PC_COLLAPSE={};
function pcUpload(){ document.getElementById('projectXlsxFile').click(); }
document.getElementById('projectXlsxFile').addEventListener('change', function(e){
  const f=e.target.files[0]; this.value=''; if(!f) return;
  const r=new FileReader();
  r.onload=async ()=>{
    try{
      const sheets=await readWorkbook(r.result, f.name);
      { let bestIdx=0,bestPk=[]; sheets.forEach((s,idx)=>{ const d=pcDetectAny(s.rows); if(!d) return; const pk=pcExtract2(s.rows,d); if(pk.length>bestPk.length){ bestPk=pk; bestIdx=idx; } }); PC_MAP=pcInitMap(sheets,bestIdx,f.name); pcOpenMapper(); return; }
      let chosen=null, chosenPkgs=[];
      sheets.forEach(s=>{ const det=pcDetect(s.rows); if(!det) return; const pkgs=pcExtract(s.rows,det);
        if(pkgs.length>chosenPkgs.length){ chosen={sheet:s,det}; chosenPkgs=pkgs; } });
      if(!chosen || !chosenPkgs.length){ alert('Could not find a packing list with L x W x H dimension columns in that file.'); return; }
      const trucks=pcBuildTrucks(chosenPkgs);
      const totalWeight=chosenPkgs.reduce((s,p)=>s+(p.weight||0)*(parseInt(p.qty)||1),0);
      const proj={
        id:pcUID('prj'), name:f.name.replace(/\.xlsx$/i,''), contract:'', origin:'', destination:'',
        createdAt:new Date().toISOString(), sourceSheet:chosen.sheet.name, dimUnit:chosen.det.dimUnit, wtUnit:chosen.det.wtUnit,
        rep:(typeof PC_REP!=='undefined'&&PC_REP&&PC_REP!=='all')?PC_REP:'', lost:false,
        packages:chosenPkgs, trucks, totalWeight,
        services:{ drayage:[], transloading:[], craneRigging:[] }
      };
      const all=DB.projects(); all.unshift(proj); DB.saveProjects(all);
      PC_OPEN=proj.id; go('projectcenter');
      toast(chosenPkgs.length+' packages → '+trucks.length+' trucks');
    }catch(err){ console.error(err); alert('Sorry — could not read that Excel file. ('+err.message+')'); }
  };
  r.readAsArrayBuffer(f);
});

/* ---------------- Helpers ---------------- */
function pcProject(id){ return DB.projects().find(p=>p.id===id); }
function pcSaveProject(p){
  if(p && Array.isArray(p.pkgSheets) && p.pkgSheets.length){
    if(p.activeSheet!=='all'){
      let a=parseInt(p.activeSheet); if(isNaN(a)||a<0||a>=p.pkgSheets.length) a=0;
      p.pkgSheets[a].trucks = p.trucks||[];
      if(p.packages!=null) p.pkgSheets[a].packages = p.packages;
      if(p.totalWeight!=null) p.pkgSheets[a].totalWeight = p.totalWeight;
    }
  }
  const all=DB.projects(); const i=all.findIndex(x=>x.id===p.id); if(i>=0){ all[i]=p; DB.saveProjects(all); }

function pcParseLaneLabel(s){ s=String(s||''); const parts=s.split(/\s*(?:\u2192|->|\bto\b)\s*/i); return {o:(parts[0]||'').trim(), d:(parts[1]||'').trim()}; }

function pcSvc(p,key){ p.services=p.services||{drayage:[],transloading:[],craneRigging:[]}; p.services[key]=p.services[key]||[]; return p.services[key]; }
function pcTruckSubtotalPage(p){ return (p.trucks||[]).reduce((s,t)=>s+(Number(t.rate)||0),0); }
function pcTruckSubtotal(p){ return pcAllTrucks(p).reduce((s,t)=>s+(Number(t.rate)||0),0); }
