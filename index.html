/* ---------- Customer detail drawer ---------- */
function openCustomerDetail(name){
  const data=buildCustomerData(null,'overall').find(c=>c.name===name) || {name, total:0,won:0,shipments:0,weightLbs:0,winPct:0,laneCount:0,topType:'—'};
  const meta=v5CustMeta(name);
  const office=coppCustomerOffice(name), last=coppLastActivity(name);
  const fromFunnel=!!meta.fromFunnel;
  const box=document.getElementById('modalBox');
  const modal=box.parentElement.querySelector('.modal');
  modal.classList.remove('wide'); modal.classList.add('xwide');

  /* per-customer QoQ */
  const series=v5QuarterSeries(name);
  const g=v5GrowthStat(series,'ships');

  /* action items */
  const acts=(meta.actionItems||[]);
  const actList = acts.length ? acts.map((a,i)=>`<label style="display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--card)">
      <input type="checkbox" style="width:auto" ${a.done?'checked':''} onchange="custToggleAction('${jsq(name)}',${i},this.checked)">
      <span style="flex:1;font-size:13px;${a.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(a.text)}</span>
      <button class="rowbtn del" onclick="custDelAction('${jsq(name)}',${i})">✕</button>
    </label>`).join('') : `<div style="font-size:12px;color:var(--muted);margin-bottom:6px">No action items yet.</div>`;
  const actDone=acts.filter(a=>a.done).length;

  /* new opportunities */
  const nops=(meta.newOpps||[]);
  const nopList = nops.length ? nops.map((o,i)=>`<div class="note-item"><div class="meta"><span>🕒 ${fmtDateTime(o.ts)}</span><button class="note-del" onclick="custDelNewOpp('${jsq(name)}',${i})">Delete</button></div><div class="body">${esc(o.text)}</div></div>`).join('') : `<div style="font-size:12px;color:var(--muted)">No new opportunities logged yet.</div>`;

  /* notes */
  const notes=(meta.notes||[]).slice().reverse();
  const noteList = notes.length ? notes.map((n,ri)=>{ const realIdx=(meta.notes.length-1)-ri;
      return `<div class="note-item"><div class="meta"><span>🕒 ${fmtDateTime(n.ts)}</span><button class="note-del" onclick="custDelNote('${jsq(name)}',${realIdx})">Delete</button></div><div class="body">${esc(n.text)}</div></div>`;
    }).join('') : `<div style="font-size:12px;color:var(--muted)">No notes yet.</div>`;

  const stat=(lbl,val)=>`<div style="text-align:center;min-width:78px"><div style="font-size:19px;font-weight:800;color:var(--ink)">${val}</div><div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em">${lbl}</div></div>`;
  const sec=(t)=>`<div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent2);font-weight:700;margin-bottom:8px">${t}</div>`;

  box.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
      <div><h3 style="margin:0">🏢 ${esc(name)}</h3>
        <div style="margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          ${office?`<span class="tag">${esc(office)}</span>`:''}
          <span class="tag">Top type: ${esc(data.topType||'—')}</span>
          ${fromFunnel?'<span class="pill won">🎉 From Prospect Funnel</span>':''}
          <span style="font-size:12px;color:var(--muted)">Last activity: ${fmtDate(last)}</span>
        </div>
      </div>
      <button class="btn ${meta.fav?'btn-primary':'btn-ghost'}" style="width:auto;white-space:nowrap" onclick="toggleCustFav('${jsq(name)}');openCustomerDetail('${jsq(name)}')">${meta.fav?'★ Top Customer':'☆ Mark Top Customer'}</button>
    </div>

    <div class="card" style="margin:14px 0 0;padding:12px 16px;display:flex;gap:18px;flex-wrap:wrap;justify-content:space-around">
      ${stat('Quotes',data.total)}${stat('Shipments',data.shipments)}${stat('Won',data.won)}${stat('Win %',data.winPct+'%')}${stat('Volume',(data.weightLbs||0).toLocaleString())}${stat('Lanes',data.laneCount||0)}
    </div>

    <div class="dsec" style="margin-top:16px">
      ${sec('📈 Growth — Quarter over Quarter '+v5GrowthChip(g))}
      ${v5LineSVG(series,'ships',{w:1080,h:190})}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px">
      <div class="dsec">
        ${sec('✅ Action Item Checklist '+(acts.length?('· '+actDone+'/'+acts.length):''))}
        ${actList}
        <div style="display:flex;gap:8px;margin-top:8px">
          <input id="custActInput" placeholder="Add an action item…" onkeydown="if(event.key==='Enter')custAddAction('${jsq(name)}')">
          <button class="btn btn-primary" style="width:auto" onclick="custAddAction('${jsq(name)}')">＋ Add</button>
        </div>
      </div>
      <div class="dsec">
        ${sec('📅 Customer Visit Date')}
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <input id="custVisitInput" type="date" style="max-width:200px" value="${esc(meta.visitDate||'')}" onchange="custSetVisit('${jsq(name)}',this.value)">
          ${meta.visitDate?`<span class="tag">${fmtDate(meta.visitDate)}</span><button class="rowbtn" onclick="custSetVisit('${jsq(name)}','')">Clear</button>`:'<span style="font-size:12px;color:var(--muted)">No visit scheduled</span>'}
        </div>
        ${sec('💡 New Opportunities')}
        <div style="display:flex;gap:8px;margin-bottom:10px">
          <input id="custOppInput" placeholder="e.g. New lane / added service…" onkeydown="if(event.key==='Enter')custAddNewOpp('${jsq(name)}')">
          <button class="btn btn-primary" style="width:auto" onclick="custAddNewOpp('${jsq(name)}')">＋ Add</button>
        </div>
        <div class="note-list" style="max-height:180px">${nopList}</div>
      </div>
    </div>

    <div class="dsec" style="margin-top:16px">
      ${sec('📝 Notes')}
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <textarea id="custNoteInput" style="flex:1;min-height:52px" placeholder="Add an update on this customer…"></textarea>
        <button class="btn btn-primary" style="width:auto" onclick="custAddNote('${jsq(name)}')">＋ Add</button>
      </div>
      <div class="note-list">${noteList}</div>
    </div>

    <div class="dsec" style="margin-top:16px">
      ${sec('🗒️ Description')}
      <textarea id="custDescInput" style="width:100%;min-height:60px" placeholder="Short description / relationship summary…" onblur="custSaveDesc('${jsq(name)}',this.value)">${esc(meta.desc||'')}</textarea>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" style="width:auto" onclick="closeModal()">Close</button>
      <button class="btn btn-ghost del" style="width:auto;background:#fdeaea;color:var(--red)" onclick="deleteCustomer('${jsq(name)}')">🗑️ Delete Customer</button>
    </div>`;
  document.getElementById('modalBg').classList.add('show');
}

/* mutators */
function custSetVisit(name, date){ v5CustSet(name,{visitDate:date||''}); openCustomerDetail(name); route(); toast(date?('Visit set for '+fmtDate(date)):'Visit date cleared'); }
function custAddAction(name){
  const el=document.getElementById('custActInput'); const t=el?el.value.trim():''; if(!t){ toast('Type an action item first'); return; }
  const m=v5CustMeta(name); const a=(m.actionItems||[]).slice(); a.push({text:t,done:false,ts:new Date().toISOString()});
  v5CustSet(name,{actionItems:a}); openCustomerDetail(name); route(); toast('Action item added');
}
function custToggleAction(name, idx, checked){
  const m=v5CustMeta(name); const a=(m.actionItems||[]).slice(); if(!a[idx]) return; a[idx]=Object.assign({},a[idx],{done:checked});
  v5CustSet(name,{actionItems:a}); openCustomerDetail(name); route();
}
function custDelAction(name, idx){
  const m=v5CustMeta(name); const a=(m.actionItems||[]).slice(); a.splice(idx,1);
  v5CustSet(name,{actionItems:a}); openCustomerDetail(name); route(); toast('Action item removed');
}
function custAddNewOpp(name){
  const el=document.getElementById('custOppInput'); const t=el?el.value.trim():''; if(!t){ toast('Describe the opportunity first'); return; }
  const m=v5CustMeta(name); const a=(m.newOpps||[]).slice(); a.push({text:t,ts:new Date().toISOString()});
  v5CustSet(name,{newOpps:a}); openCustomerDetail(name); route(); toast('New opportunity logged');
}
function custDelNewOpp(name, idx){
  const m=v5CustMeta(name); const a=(m.newOpps||[]).slice(); a.splice(idx,1);
  v5CustSet(name,{newOpps:a}); openCustomerDetail(name); route(); toast('Opportunity removed');
}
function custAddNote(name){
  const el=document.getElementById('custNoteInput'); const t=el?el.value.trim():''; if(!t){ toast('Type a note first'); return; }
  const m=v5CustMeta(name); const a=(m.notes||[]).slice(); a.push({ts:new Date().toISOString(), text:t});
  v5CustSet(name,{notes:a}); openCustomerDetail(name); route(); toast('Note added');
}
function custDelNote(name, idx){
  const m=v5CustMeta(name); const a=(m.notes||[]).slice(); a.splice(idx,1);
  v5CustSet(name,{notes:a}); openCustomerDetail(name); route(); toast('Note deleted');
}
function custSaveDesc(name, desc){ v5CustSet(name,{desc:desc}); toast('Description saved'); }

/* --- move to / from whale --- */
function oppToggleWhale(id){
  const arr=oppList(); const o=arr.find(x=>x.id===id); if(!o) return;
  o.whale=!o.whale; oppSave(arr);
  if(typeof OPP_DETAIL!=='undefined' && OPP_DETAIL===id) openOppDetail(id);
  route(); toast(o.whale?'🐋 Moved to the Whale category':'Removed from Whales');
}

      ${st==='quoting'?`<button class="rowbtn" style="background:#e3f6e9;color:var(--green)" onclick="oppMarkWon('${o.id}')">🎉 Won → Customer</button>`:''}
      <button class="rowbtn" style="background:#eaf2fb;color:#0b5cad" onclick="oppToggleWhale('${o.id}')">🐋 Remove from Whales</button>

function whaleExpandedPage(){

<script>
/* ===================================================================
   NSE TOOLS UPGRADE v6
   -------------------------------------------------------------------
   1) DASHBOARD: combine the two prospect panels into ONE; rename the
      customer panel to "Top Customer".
   2) CUSTOMER OPPORTUNITIES  ->  "Top Customer" — a manually-entered
      spreadsheet modeled on the reference grid (Customer, CID,
      AssociatedCustomerIDs, Mode, NSEName, NSEStart, NSEEnd,
      CloseStartDate, CloseEndDate, quarterly $ columns, NSE Total).
      No longer pulls from the quote log. Prospects won in the funnel
      are added here automatically.
   3) MANAGER SUMMARY for the Top 5 Customers + Top Prospects, styled
      like the Office Summary Report, with an optional Group-by-Tier.
   All data rides on DB.customers()/DB.opps() so it round-trips through
   JSON backups and the Import Center automatically.
   =================================================================== */

/* =====================================================================
   SHARED TOP-CUSTOMER HELPERS
   ===================================================================== */
function tcDefaultNSE(){
  const n=(DB.nses()||[]); return n.length? n[0].name : 'Tyler Lee';
}
function tcMoney(n){ n=Number(n)||0; return '$'+Math.round(n).toLocaleString('en-US'); }
function tcQuarterListStored(){
  try{ const a=JSON.parse(localStorage.getItem('hht_tc_quarters')||'null'); if(Array.isArray(a)&&a.length) return a; }catch(e){}
  return ['Q2-26','Q3-26'];
}
function tcSaveQuarters(a){ try{ localStorage.setItem('hht_tc_quarters', JSON.stringify(a)); }catch(e){} }
function tcParseQ(label){ const m=String(label||'').match(/Q?\s*(\d)\D+(\d{2,4})/i); if(!m) return {q:0,y:0}; let y=+m[2]; if(y<100) y+=2000; return {q:+m[1], y}; }
function tcQCmp(a,b){ const pa=tcParseQ(a), pb=tcParseQ(b); return (pa.y-pb.y)||(pa.q-pb.q); }
/* every top-customer record = a DB.customers() entry flagged topCust */
function tcList(){
  const c=DB.customers()||{};
  return Object.keys(c).filter(k=>c[k]&&c[k].topCust).map(k=>({name:k, meta:c[k]}));
}
function tcAllQuarterCols(){
  const set=new Set(tcQuarterListStored());
  tcList().forEach(c=>Object.keys(c.meta.quarters||{}).forEach(k=>set.add(k)));
  return [...set].sort(tcQCmp);
}
function tcTotal(meta){ const q=meta.quarters||{}; return Object.keys(q).reduce((s,k)=>s+(Number(q[k])||0),0); }
function tcSet(name, patch){ const c=DB.customers()||{}; c[name]=Object.assign({}, c[name], patch); DB.saveCustomers(c); }
function tcSetQuarter(name, col, val){
  const c=DB.customers()||{}; const m=Object.assign({}, c[name]); m.quarters=Object.assign({}, m.quarters);
  const n=String(val).replace(/[^0-9.\-]/g,''); if(n==='') delete m.quarters[col]; else m.quarters[col]=Number(n)||0;
  c[name]=m; DB.saveCustomers(c);
}
function tcAddQuarterCol(){
  let lbl=prompt('New quarter column label (e.g. Q4-26):',''); if(lbl==null) return;
  lbl=lbl.trim().toUpperCase().replace(/\s+/g,''); if(!/^Q\d-\d{2,4}$/.test(lbl)){ toast('Use a format like Q4-26'); return; }
  const list=tcQuarterListStored(); if(list.indexOf(lbl)<0){ list.push(lbl); list.sort(tcQCmp); tcSaveQuarters(list); }
  route(); toast('Added column '+lbl);
}
function tcQuarterSeries(){
  const cols=tcAllQuarterCols(); const list=tcList();
  return cols.map(col=>({label:col, rev:list.reduce((s,c)=>s+(Number((c.meta.quarters||{})[col])||0),0)}));
}
/* top 5 = starred first, then by NSE Total */
function tcTop5(){
  return tcList().slice().sort((a,b)=>((b.meta.fav?1:0)-(a.meta.fav?1:0)) || (tcTotal(b.meta)-tcTotal(a.meta))).slice(0,5);
}

/* =====================================================================
   1) TOP CUSTOMER PAGE  (spreadsheet, manual entry)
   ===================================================================== */
window.pageCustomerOpps = function(){
  const list0=tcList();
  const cols=tcAllQuarterCols();
  const search=((typeof COPP_SEARCH!=='undefined')?COPP_SEARCH:'').toLowerCase().trim();
  const sort=(typeof COPP_SORT!=='undefined')?COPP_SORT:'total';
  let list=list0.slice();
  if(search) list=list.filter(c=>[c.name,c.meta.cid,c.meta.associatedIds,c.meta.nseName,c.meta.mode].join(' ').toLowerCase().includes(search));
  if(sort==='total') list.sort((a,b)=>tcTotal(b.meta)-tcTotal(a.meta));
  else if(sort==='top') list.sort((a,b)=>((b.meta.fav?1:0)-(a.meta.fav?1:0))||tcTotal(b.meta)-tcTotal(a.meta));
  else if(sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sort==='cid') list.sort((a,b)=>String(a.meta.cid||'').localeCompare(String(b.meta.cid||'')));

  /* KPIs */
  const grand=list0.reduce((s,c)=>s+tcTotal(c.meta),0);
  const tops=list0.filter(c=>c.meta.fav).length;
  const fromFunnel=list0.filter(c=>c.meta.fromFunnel).length;
  const kpis=`<div class="kpi-grid">
    ${kpi('Top Customers',list0.length,'b-blue')}
    ${kpi('NSE Total (All)',tcMoney(grand),'b-green')}
    ${kpi('⭐ Starred',tops,'b-amber','shown on dashboard')}
    ${kpi('From Prospect Funnel',fromFunnel,'b-navy','auto-added')}
  </div>`;

  /* QoQ growth from the quarter columns */
  const series=tcQuarterSeries();
  const g=(function(){ if(series.length<2) return {pct:null}; const last=series[series.length-1].rev||0, prev=series[series.length-2].rev||0; let pct=prev>0?Math.round((last-prev)/prev*100):(last>0?100:0); return {pct,last,prev}; })();
  const growthChip=g.pct==null?`<span class="tag">— add another quarter to compare —</span>`
    :`<span style="font-weight:800;color:${g.pct>=0?'var(--green)':'var(--red)'}">${g.pct>=0?'▲ +':'▼ '}${g.pct}%</span> <span style="color:var(--muted);font-size:12px">QoQ (${tcMoney(g.prev)}→${tcMoney(g.last)})</span>`;
  const chartSeries=series.map(s=>({label:s.label, ships:s.rev}));   /* reuse v5 chart on 'ships' key */
  const growthCard=`<div class="card">
    <div class="card-head"><h3>📈 Growth — Quarter over Quarter</h3><span style="font-size:13px">${growthChip}</span></div>
    <div class="card-sub">Total NSE revenue booked each quarter across all Top Customers. Values come straight from the quarter columns below.</div>
    ${(typeof v5LineSVG==='function' && series.length)? v5LineSVG(chartSeries,'ships') : '<div class="empty" style="padding:20px">Add quarter revenue below to chart growth.</div>'}
  </div>`;

  const sortSel=`<select style="max-width:190px" onchange="COPP_SORT=this.value;route()">
      <option value="total" ${sort==='total'?'selected':''}>Sort: NSE Total ↓</option>
      <option value="top" ${sort==='top'?'selected':''}>Sort: Top Customers First</option>
      <option value="name" ${sort==='name'?'selected':''}>Sort: Customer A→Z</option>
      <option value="cid" ${sort==='cid'?'selected':''}>Sort: CID</option>
    </select>`;

  /* spreadsheet */
  const qHeads=cols.map(c=>`<th style="text-align:right;white-space:nowrap">${esc(c)}</th>`).join('');
  const rows=list.map(c=>{ const m=c.meta; const nm=jsq(c.name);
    const qCells=cols.map(col=>{ const v=(m.quarters||{})[col]; return `<td style="text-align:right;white-space:nowrap;color:${v?'var(--ink)':'#c9d2dc'}">${v?tcMoney(v):''}</td>`; }).join('');
    return `<tr style="cursor:pointer;${m.fav?'background:#fff8ec':''}" onclick="openCustomerDetail('${nm}')">
      <td onclick="event.stopPropagation();toggleCustFav('${nm}')" title="${m.fav?'Remove Top Customer':'Mark as Top Customer'}" style="text-align:center;font-size:16px;color:${m.fav?'var(--accent)':'#c9d2dc'}">${m.fav?'★':'☆'}</td>
      <td style="white-space:nowrap"><strong>${esc(c.name)}</strong>${m.fromFunnel?' <span class="pill won" title="Converted from Prospect Funnel">🎉</span>':''}</td>
      <td style="white-space:nowrap;color:var(--muted)">${esc(m.cid||'')}</td>
      <td style="white-space:nowrap;color:var(--muted)">${esc(m.associatedIds||'')}</td>
      <td style="white-space:nowrap"><span class="pill type">${esc(m.mode||'OSOW')}</span></td>
      <td style="white-space:nowrap">${esc(m.nseName||'')}</td>
      <td style="white-space:nowrap;font-size:12px">${m.nseStart?fmtDate(m.nseStart):'—'}</td>
      <td style="white-space:nowrap;font-size:12px">${m.nseEnd?fmtDate(m.nseEnd):'—'}</td>
      <td style="white-space:nowrap;font-size:12px">${m.closeStart?fmtDate(m.closeStart):'—'}</td>
      <td style="white-space:nowrap;font-size:12px">${m.closeEnd?fmtDate(m.closeEnd):'—'}</td>
      ${qCells}
      <td style="text-align:right;white-space:nowrap"><strong>${tcMoney(tcTotal(m))}</strong></td>
    </tr>`;
  }).join('');
  const totalsRow=(function(){
    const qTot=cols.map(col=>{ const t=list.reduce((s,c)=>s+(Number((c.meta.quarters||{})[col])||0),0); return `<td style="text-align:right;font-weight:800">${t?tcMoney(t):''}</td>`; }).join('');
    const grandShown=list.reduce((s,c)=>s+tcTotal(c.meta),0);
    return `<tr style="background:var(--th-bg);font-weight:800"><td></td><td>Total</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>${qTot}<td style="text-align:right">${tcMoney(grandShown)}</td></tr>`;
  })();
  const body = list.length ? `<div class="card">
      <div class="card-head"><h3>Top Customers <span style="color:var(--muted);font-weight:500;font-size:13px">(${list.length})</span></h3>
        <span style="font-size:12px;color:var(--muted)">Click any row to open &amp; edit the full record</span></div>
      <div class="table-wrap"><table style="min-width:${1080+cols.length*90}px">
        <thead><tr><th style="width:34px">★</th><th>Customer</th><th>CID</th><th>AssociatedCustomerIDs</th><th>Mode</th><th>NSEName</th><th>NSEStart</th><th>NSEEnd</th><th>CloseStartDate</th><th>CloseEndDate</th>${qHeads}<th style="text-align:right">NSE Total</th></tr></thead>
        <tbody>${rows}${totalsRow}</tbody>
      </table></div></div>`
    : `<div class="card"><div class="empty">No Top Customers yet. Click <strong>＋ Add Customer</strong> to enter one, or win a prospect in the Prospect Funnel and it lands here automatically.</div></div>`;

  return `
  <div class="page-title">🏢 Top Customer</div>
  <div class="page-sub">Your book of Top Customers — <strong>manually entered</strong> (no longer pulled from the quote log). Track CID, mode, NSE window, close dates, and quarterly NSE revenue. Prospects won in the <strong>Prospect Funnel</strong> are added here automatically. Star up to five for the dashboard.</div>
  ${growthCard}
  ${kpis}
  <div class="card" style="padding:14px 18px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap">
    <div style="flex:1;min-width:200px"><label style="margin-bottom:6px">Search</label><input placeholder="Customer, CID, NSE, mode…" value="${esc((typeof COPP_SEARCH!=='undefined')?COPP_SEARCH:'')}" oninput="COPP_SEARCH=this.value;coppSearchDebounce()"></div>
    <div><label style="margin-bottom:6px">Sort</label>${sortSel}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost" style="width:auto" onclick="tcAddQuarterCol()">＋ Quarter</button>
      <button class="btn btn-ghost" style="width:auto" onclick="tcManagerSummary()">📋 Manager Summary</button>
      <button class="btn btn-primary" style="width:auto" onclick="openAddTopCustomer()">＋ Add Customer</button>
    </div>
  </div>
  ${body}`;
};

/* ---------- Add Customer ---------- */
function openAddTopCustomer(){
  const box=document.getElementById('modalBox');
  box.parentElement.querySelector('.modal').classList.remove('xwide'); box.parentElement.querySelector('.modal').classList.add('wide');
  box.innerHTML=`<h3>＋ Add Top Customer</h3>
    <div class="card-sub" style="margin-bottom:14px">Enter a customer manually. You can fill quarterly NSE revenue after saving by clicking the row.</div>
    <div class="form-row"><div class="field-c" style="grid-column:1/-1"><label>Customer Name</label><input id="tc_name" placeholder="Company name"></div></div>
    <div class="form-row"><div class="field-c"><label>CID</label><input id="tc_cid" placeholder="e.g. 2969454"></div>
      <div class="field-c"><label>Associated Customer IDs</label><input id="tc_assoc" placeholder="comma separated"></div></div>
    <div class="form-row"><div class="field-c"><label>Mode</label><input id="tc_mode" value="OSOW"></div>
      <div class="field-c"><label>NSE Name</label><input id="tc_nse" value="${esc(tcDefaultNSE())}"></div></div>
    <div class="form-row"><div class="field-c"><label>NSE Start</label><input id="tc_nsestart" type="date"></div>
      <div class="field-c"><label>NSE End</label><input id="tc_nseend" type="date"></div></div>
    <div class="form-row"><div class="field-c"><label>Close Start Date</label><input id="tc_closestart" type="date"></div>
      <div class="field-c"><label>Close End Date</label><input id="tc_closeend" type="date"></div></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" style="width:auto" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="width:auto" onclick="saveNewTopCustomer()">Add Customer</button>
    </div>`;
  document.getElementById('modalBg').classList.add('show');
}
function saveNewTopCustomer(){
  const name=val('tc_name'); if(!name){ toast('Customer name required'); return; }
  const c=DB.customers()||{};
  if(c[name] && c[name].topCust){ toast('That customer already exists'); return; }
  c[name]=Object.assign({}, c[name], {
    topCust:true, manual:true,
    cid:val('tc_cid'), associatedIds:val('tc_assoc'), mode:val('tc_mode')||'OSOW', nseName:val('tc_nse')||tcDefaultNSE(),
    nseStart:val('tc_nsestart'), nseEnd:val('tc_nseend'), closeStart:val('tc_closestart'), closeEnd:val('tc_closeend'),
    quarters:(c[name]&&c[name].quarters)||{}
  });
  DB.saveCustomers(c); closeModal(); route(); toast('Customer added');
}

/* ---------- Detail drawer (spreadsheet fields + action items / visit / notes / new opps) ---------- */
function openCustomerDetail(name){
  const meta=(DB.customers()||{})[name]||{};
  const cols=tcAllQuarterCols();
  const box=document.getElementById('modalBox');
  const modal=box.parentElement.querySelector('.modal'); modal.classList.remove('wide'); modal.classList.add('xwide');
  const sec=(t)=>`<div style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent2);font-weight:700;margin-bottom:8px">${t}</div>`;
  const fld=(lbl,id,val,type)=>`<div class="field-c"><label>${lbl}</label><input id="${id}" ${type?('type="'+type+'"'):''} value="${esc(val||'')}" onchange="tcDetailField('${jsq(name)}','${id}',this.value)"></div>`;

  /* quarter revenue inputs */
  const qInputs=cols.map(col=>`<div class="field-c"><label>${esc(col)} ($)</label><input type="number" min="0" value="${(meta.quarters||{})[col]!=null?(meta.quarters||{})[col]:''}" placeholder="0" onchange="tcSetQuarter('${jsq(name)}','${col}',this.value);openCustomerDetail('${jsq(name)}')"></div>`).join('');

  /* action items */
  const acts=(meta.actionItems||[]);
  const actList = acts.length ? acts.map((a,i)=>`<label style="display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--card)">
      <input type="checkbox" style="width:auto" ${a.done?'checked':''} onchange="custToggleAction('${jsq(name)}',${i},this.checked)">
      <span style="flex:1;font-size:13px;${a.done?'text-decoration:line-through;color:var(--muted)':''}">${esc(a.text)}</span>
      <button class="rowbtn del" onclick="custDelAction('${jsq(name)}',${i})">✕</button></label>`).join('') : `<div style="font-size:12px;color:var(--muted);margin-bottom:6px">No action items yet.</div>`;
  const actDone=acts.filter(a=>a.done).length;
  /* new opps */
  const nops=(meta.newOpps||[]);
  const nopList = nops.length ? nops.map((o,i)=>`<div class="note-item"><div class="meta"><span>🕒 ${fmtDateTime(o.ts)}</span><button class="note-del" onclick="custDelNewOpp('${jsq(name)}',${i})">Delete</button></div><div class="body">${esc(o.text)}</div></div>`).join('') : `<div style="font-size:12px;color:var(--muted)">No new opportunities logged yet.</div>`;
  /* notes */
  const notes=(meta.notes||[]).slice().reverse();
  const noteList = notes.length ? notes.map((n,ri)=>{ const realIdx=(meta.notes.length-1)-ri;
      return `<div class="note-item"><div class="meta"><span>🕒 ${fmtDateTime(n.ts)}</span><button class="note-del" onclick="custDelNote('${jsq(name)}',${realIdx})">Delete</button></div><div class="body">${esc(n.text)}</div></div>`;
    }).join('') : `<div style="font-size:12px;color:var(--muted)">No notes yet.</div>`;

  box.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
      <div><h3 style="margin:0">🏢 ${esc(name)}</h3>
        <div style="margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <span class="tag">${esc(meta.mode||'OSOW')}</span>
          <span class="tag">NSE: ${esc(meta.nseName||tcDefaultNSE())}</span>
          ${meta.fromFunnel?'<span class="pill won">🎉 From Prospect Funnel</span>':''}
          ${meta.tier?`<span class="tag">${esc(meta.tier)}</span>`:''}
          <span style="font-weight:800;color:var(--green)">NSE Total ${tcMoney(tcTotal(meta))}</span>
        </div>
      </div>
      <button class="btn ${meta.fav?'btn-primary':'btn-ghost'}" style="width:auto;white-space:nowrap" onclick="toggleCustFav('${jsq(name)}');openCustomerDetail('${jsq(name)}')">${meta.fav?'★ Top Customer':'☆ Mark Top Customer'}</button>
    </div>

    <div class="dsec" style="margin-top:16px">
      ${sec('🧾 Customer Record')}
      <div class="form-row">${fld('CID','tc_d_cid',meta.cid)}${fld('Associated Customer IDs','tc_d_assoc',meta.associatedIds)}</div>
      <div class="form-row">${fld('Mode','tc_d_mode',meta.mode||'OSOW')}${fld('NSE Name','tc_d_nse',meta.nseName||tcDefaultNSE())}</div>
      <div class="form-row">${fld('NSE Start','tc_d_nsestart',meta.nseStart,'date')}${fld('NSE End','tc_d_nseend',meta.nseEnd,'date')}</div>
      <div class="form-row">${fld('Close Start Date','tc_d_closestart',meta.closeStart,'date')}${fld('Close End Date','tc_d_closeend',meta.closeEnd,'date')}</div>
      <div class="form-row">${fld('Priority Tier (for Manager Summary)','tc_d_tier',meta.tier)}<div class="field-c"></div></div>
    </div>

    <div class="dsec" style="margin-top:16px">
      ${sec('💵 Quarterly NSE Revenue')}
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px">${qInputs||'<div style="font-size:12px;color:var(--muted)">No quarter columns yet — add one with ＋ Quarter on the list.</div>'}</div>
      <div style="text-align:right;margin-top:10px;font-weight:800;color:var(--ink)">NSE Total: ${tcMoney(tcTotal(meta))}</div>
    </div>

<script>
/* ===================================================================
   IMPORT CENTER v7 — PROSPECT FUNNEL CSV IMPORT
   -------------------------------------------------------------------
   Adds a CSV uploader to the Import Center that ingests the exact
   columns produced by the Office Summary Report export:
     Company, Broker, Office, Industry, Tier, Likelihood, Progress,
     Type, Deal Type, Volume, Modes, Equipment, Notes
   It follows the SAME review rules as the JSON import:
     • ADDITIONS  — rows in the CSV not already in the funnel  (added)
     • DUPLICATES — rows already in the funnel                 (NOT added)
     • REMOVALS   — funnel opps in the CSV's office(s) that are
                    NOT in the CSV                             (opt-in remove)
   Nothing is written until you approve; a backup is saved so the
   existing "Undo Last Import" restores everything.
   =================================================================== */

/* ---------- staging state ---------- */
let FUNNEL_CSV = null;

/* ---------- helpers ---------- */
function fcsvNorm(s){ return (s==null?'':String(s)).replace(/\s+/g,' ').trim().toLowerCase(); }
function fcsvKey(company, office){ return fcsvNorm(company)+'||'+fcsvNorm(office); }

/* Progress label -> funnel flags + derived status */
function fcsvProgToFields(prog){
  const p=fcsvNorm(prog);
  const f={ brokerContacted:false, nseConversation:false, readyToQuote:false, noOpp:false };
  if(p.indexOf('exclud')>=0){ f.noOpp=true; f.status='0 - Excluded (No Opportunity)'; return f; }
  if(p.indexOf('ready')>=0){ f.brokerContacted=true; f.nseConversation=true; f.readyToQuote=true; }
  else if(p.indexOf('nse')>=0){ f.brokerContacted=true; f.nseConversation=true; }
  else if(p.indexOf('broker')>=0){ f.brokerContacted=true; }
  f.status = f.readyToQuote?'4 - Ready to Quote':f.nseConversation?'3 - NSE Conversation':f.brokerContacted?'2 - Broker Outreach':'1 - No Communication';
  return f;
}
/* "5 Shipments Yearly" / "4 Shipments Per Project" -> {volumeQty, volume} */
function fcsvParseVolume(v){
  v=(v||'').trim(); if(!v) return null;
  const q=(v.match(/(\d+(?:\.\d+)?)/)||[])[1]||'';
  let freq=v.replace(/\d+(?:\.\d+)?/,'').replace(/shipments?/i,'').trim();
  freq=freq.replace(/^[·\-\s]+/,'').trim();
  const known=(typeof OPP_VOLUMES!=='undefined')?OPP_VOLUMES:['Weekly','Monthly','Yearly','Per Project'];
  const hit=known.find(k=>k.toLowerCase()===freq.toLowerCase());
  if(hit) freq=hit;
  if(!q && !freq) return null;
  return { volumeQty:q, volume:freq };
}
function fcsvParseModes(v){ v=(v||'').trim(); if(!v) return []; return v.split(/\s*\|\s*/).map(s=>s.trim()).filter(Boolean); }
function fcsvTier(t){ t=(t||'').trim(); const known=(typeof OPP_TIERS!=='undefined')?OPP_TIERS:[]; const hit=known.find(k=>k.toLowerCase()===t.toLowerCase()); return hit||t; }
function fcsvDeal(d){ d=(d||'').trim(); const known=(typeof OPP_CLASS!=='undefined')?OPP_CLASS:[]; const hit=known.find(k=>k.toLowerCase()===d.toLowerCase()); return hit||''; }

/* Build a funnel-opportunity record from one CSV row object */
function fcsvRowToOpp(r){
  const prog=fcsvProgToFields(r.progress);
  const likeRaw=(r.likelihood||'').match(/\d+(?:\.\d+)?/);
  const likelihood=likeRaw?likeRaw[0]:'';
  const rec={
    id:'op'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),
    office:(r.office||'').trim(),
    broker:(r.broker||'').trim(),
    company:(r.company||'').trim(),
    industry:(r.industry||'').trim(),
    tier:fcsvTier(r.tier)||(likelihood?oppTierFromLike(likelihood):'Tier 3 - Medium'),
    likelihood:likelihood,
    equipment:(r.equipment||'').trim(),
    notes:(r.notes||'').trim(),
    classification:fcsvDeal(r.dealType),
    relationship:(fcsvNorm(r.type)==='customer')?'Customer':'Prospect',
    brokerContacted:prog.brokerContacted, nseConversation:prog.nseConversation, readyToQuote:prog.readyToQuote,
    noOpp:prog.noOpp, status:prog.status, wonCustomer:false, notesLog:[]
  };
  const vol=fcsvParseVolume(r.volume); const modes=fcsvParseModes(r.modes);
  if(vol || modes.length){
    rec.intake={ volume:(vol&&vol.volume)||'', volumeQty:(vol&&vol.volumeQty)||'', modes:modes, needs:[], steps:[], savedAt:new Date().toISOString() };
  }
  return rec;
}

/* ---------- column mapping ---------- */
function fcsvColMap(header){
  const idx={}; header.forEach((h,i)=>{ idx[fcsvNorm(h).replace(/[^a-z0-9]/g,'')]=i; });
  const pick=(...names)=>{ for(const n of names){ const k=n.replace(/[^a-z0-9]/g,''); if(idx[k]!=null) return idx[k]; } return -1; };
  return {
    company:pick('company','customer'), broker:pick('broker'), office:pick('office'),
    industry:pick('industry'), tier:pick('tier'), likelihood:pick('likelihood','likely'),
    progress:pick('progress','stage'), type:pick('type','relationship'),
    dealType:pick('dealtype','classification'), volume:pick('volume'),
    modes:pick('modes'), equipment:pick('equipment'), notes:pick('notes')
  };
}

/* ---------- stage a CSV file (no writes) ---------- */
function stageFunnelCsv(text, fileName){
  const rows=parseCSV(text);
  if(rows.length<2){ alert('That CSV looks empty.'); return; }
  const map=fcsvColMap(rows[0]);
  if(map.company<0){ alert('Could not find a "Company" column. Make sure this is the Office Summary Report CSV export.'); return; }
  const g=(cols,k)=>{ const i=map[k]; return (i==null||i<0)?'':((cols[i]!=null?String(cols[i]):'').trim()); };

  /* incoming rows -> opp records, de-duped within the file by company+office */
  const incoming=[]; const seenIn=new Set();
  for(let r=1;r<rows.length;r++){
    const cols=rows[r];
    const company=g(cols,'company'); if(!company) continue;
    const office=g(cols,'office');
    const key=fcsvKey(company,office);
    if(seenIn.has(key)) continue;          /* same file duplicate — collapse */
    seenIn.add(key);
    incoming.push(fcsvRowToOpp({
      company, office, broker:g(cols,'broker'), industry:g(cols,'industry'), tier:g(cols,'tier'),
      likelihood:g(cols,'likelihood'), progress:g(cols,'progress'), type:g(cols,'type'),
      dealType:g(cols,'dealType'), volume:g(cols,'volume'), modes:g(cols,'modes'),
      equipment:g(cols,'equipment'), notes:g(cols,'notes')
    }));
  }

  const existing=oppList();
  const exByKey={}; existing.forEach(o=>{ exByKey[fcsvKey(o.company,o.office)]=o; });
  const csvKeys=new Set(incoming.map(o=>fcsvKey(o.company,o.office)));
  const officeSet=new Set(incoming.map(o=>fcsvNorm(o.office)).filter(Boolean));

  const additions=[], duplicates=[];
  incoming.forEach(o=>{ const k=fcsvKey(o.company,o.office);
    if(exByKey[k]) duplicates.push({existing:exByKey[k], incoming:o}); else additions.push(o); });

  /* removals: funnel opps whose office is represented in the CSV, but which the CSV no longer lists */
  const removals=existing.filter(o=> officeSet.has(fcsvNorm(o.office)) && !csvKeys.has(fcsvKey(o.company,o.office)))
    .map(o=>({o, _remove:false}));

  FUNNEL_CSV={ fileName, additions, duplicates, removals,
    offices:[...officeSet], officeLabels:[...new Set(incoming.map(o=>o.office).filter(Boolean))] };
  showFunnelCsvReview();
}

/* ---------- review modal ---------- */
function fcsvSetRemove(i, on){ if(FUNNEL_CSV && FUNNEL_CSV.removals[i]) FUNNEL_CSV.removals[i]._remove=!!on; }
function fcsvRemoveAll(on){ if(!FUNNEL_CSV) return; FUNNEL_CSV.removals.forEach(x=>x._remove=!!on); showFunnelCsvReview(); }
function showFunnelCsvReview(){

  const addRows=F.additions.slice(0,120).map(o=>`<tr>

  const dupRows=F.duplicates.slice(0,120).map(d=>`<tr>

    </tr>`).join('');
  const remCount=F.removals.filter(x=>x._remove).length;

      <td>${esc(x.o.broker||'—')}</td><td>${esc(x.o.office||'—')}</td><td>${esc(x.o.tier||'')}</td>
    </tr>`).join('');
  box.innerHTML=`
    <h3>📄 Prospect Funnel — CSV Import Review</h3>
    <div class="card-sub" style="margin-bottom:14px">From <strong>${esc(F.fileName)}</strong> · Office(s): <strong>${esc(offLbl)}</strong>. Nothing is saved yet — review below, choose any removals, then click <strong>Approve Import</strong>. A backup is saved so you can Undo.</div>
    <div class="kpi-grid" style="margin-bottom:16px">
      <div class="kpi b-green"><div class="bar"></div><div class="lbl">New — will be added</div><div class="val">${F.additions.length}</div></div>
      <div class="kpi b-amber"><div class="bar"></div><div class="lbl">Duplicates — skipped</div><div class="val">${F.duplicates.length}</div></div>
      <div class="kpi b-red"><div class="bar"></div><div class="lbl">Selected to remove</div><div class="val">${remCount}</div></div>

    </div>
    ${F.additions.length?`<div class="card"><div class="card-head"><h3>✅ New Opportunities (${F.additions.length})</h3><span class="tag">added on approve</span></div>
      <div class="table-wrap"><table style="min-width:560px"><thead><tr><th>Company</th><th>Broker</th><th>Office</th><th>Tier</th><th>Likely</th></tr></thead><tbody>${addRows}</tbody></table></div>
      ${F.additions.length>120?`<div style="font-size:12px;color:var(--muted);margin-top:6px">…and ${F.additions.length-120} more.</div>`:''}</div>`:''}
    ${F.removals.length?`<div class="card"><div class="card-head"><h3>🗑️ In Funnel, Not in CSV (${F.removals.length})</h3>
        <div style="display:flex;gap:8px"><button class="rowbtn" onclick="fcsvRemoveAll(true)">Select all</button><button class="rowbtn" onclick="fcsvRemoveAll(false)">Select none</button></div></div>
      <div class="card-sub">These opportunities live in the office(s) covered by this CSV but weren't listed in it. Tick any you want to <strong>remove</strong> — left unchecked, they're kept.</div>
      <div class="table-wrap"><table style="min-width:600px"><thead><tr><th style="width:40px">Remove</th><th>Company</th><th>Broker</th><th>Office</th><th>Tier</th></tr></thead><tbody>${remRows}</tbody></table></div></div>`:''}
    ${F.duplicates.length?`<div class="card"><div class="card-head"><h3>♻ Duplicates — Not Added (${F.duplicates.length})</h3></div>
      <div class="table-wrap"><table style="min-width:520px"><thead><tr><th>Company</th><th>Broker</th><th>Office</th><th>Status</th></tr></thead><tbody>${dupRows}</tbody></table></div>
      ${F.duplicates.length>120?`<div style="font-size:12px;color:var(--muted);margin-top:6px">…and ${F.duplicates.length-120} more.</div>`:''}</div>`:''}
    <div class="modal-actions">
      <button class="btn btn-ghost" style="width:auto" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="width:auto" onclick="approveFunnelCsv()">✓ Approve Import</button>
    </div>`;
  document.getElementById('modalBg').classList.add('show');
}

/* ---------- approve: write staged changes ---------- */
function approveFunnelCsv(){
  const F=FUNNEL_CSV; if(!F) return;
  try{ localStorage.setItem('hht_preImportBackup', JSON.stringify(snapshot())); }catch(e){}
  let opps=oppList();
  /* removals first */
  const removeIds=new Set(F.removals.filter(x=>x._remove).map(x=>x.o.id));
  const removed=removeIds.size;
  if(removed) opps=opps.filter(o=>!removeIds.has(o.id));
  /* additions */
  F.additions.forEach(o=>opps.push(o));
  oppSave(opps);
  /* union funnel offices so new offices show up in filters */
  if(typeof DB.oppOffices==='function'){
    const offSet=new Set(DB.oppOffices()||[]);
    F.officeLabels.forEach(o=>{ if(o) offSet.add(o); });
    DB.saveOppOffices(Array.from(offSet));
  }
  /* record last-import so the Import Center card + Undo reflect it */
  IMPORT_LAST={ when:new Date().toISOString(), files:[{fileName:F.fileName, added:F.additions.length, updated:0, duplicates:F.duplicates.length, aux:0}],
    added:F.additions.length, updated:0, skipped:F.duplicates.length, removed, aux:{}, auxSum:0, errors:[], kind:'funnelCsv' };
  try{ localStorage.setItem('hht_lastImport', JSON.stringify(IMPORT_LAST)); }catch(e){}
  const added=F.additions.length, skipped=F.duplicates.length;
  FUNNEL_CSV=null; closeModal();
  if(typeof go==='function') go('funnel'); else route();
  toast(`Funnel CSV imported — ${added} added, ${skipped} duplicate(s) skipped${removed?`, ${removed} removed`:''}`);
}

      <div style="display:flex;gap:10px;flex-wrap:wrap">

      </div>
      <div style="margin-top:12px;font-size:12px;color:var(--muted)">
        Recognized columns: ${['Company','Broker','Office','Industry','Tier','Likelihood','Progress','Type','Deal Type','Volume','Modes','Equipment','Notes'].map(c=>`<span class="tag" style="margin-bottom:4px">${c}</span>`).join(' ')}
      </div>

<script>
/* ===================================================================
   TOP CUSTOMER UPGRADE v8
   -------------------------------------------------------------------
   1) Fix the Top-Customer highlight rule — a proper themed class that
      survives hover and works in dark mode (replaces the inline cream
      background that vanished on hover / was unreadable in dark mode).
   2) Growth chart: EACH customer gets its OWN line (multi-series),
      instead of a single aggregated total line.
   3) Toggle the growth chart between a Line graph and a Horizontal
      Bar graph (stacked by quarter, ranked by NSE Total).
   =================================================================== */

/* ---- inject the highlight CSS once (works in light + dark, survives hover) ---- */
(function tcInjectCSS(){
  if(document.getElementById('tcTopStyle')) return;
  const st=document.createElement('style'); st.id='tcTopStyle';
  st.textContent=`
    tr.tc-top td{ background:rgba(224,122,0,.10) !important; }

  `;
  document.head.appendChild(st);
})();

/* ---- chart state + palette ---- */
let TC_CHART = 'line';   /* 'line' | 'hbar' */
const TC_PALETTE = ['#134074','#e07a00','#1b873f','#8e44ad','#16a085','#c0392b',
  '#2980b9','#d35400','#7f8c8d','#f39c12','#2c3e50','#27ae60','#9b59b6','#e74c3c',
  '#0e7490','#b7791f','#6d28d9','#0f766e'];
function tcMoneyShort(n){ n=Number(n)||0; if(Math.abs(n)>=1000) return '$'+(Math.round(n/100)/10).toLocaleString('en-US')+'k'; return '$'+Math.round(n); }

/* ---- per-customer chart data: one series per customer across the quarter columns ---- */
function tcChartData(){
  const cols=tcAllQuarterCols();
  const list=tcList().filter(c=>tcTotal(c.meta)>0).sort((a,b)=>tcTotal(b.meta)-tcTotal(a.meta));
  const series=list.map((c,i)=>({
    name:c.name,
    color:TC_PALETTE[i%TC_PALETTE.length],
    total:tcTotal(c.meta),
    vals:cols.map(col=>{ const raw=(c.meta.quarters||{})[col]; return (raw==null||raw==='')?null:(Number(raw)||0); })
  }));
  return {cols, series};
}

/* ---- multi-line SVG (one line per customer) + legend ---- */
function tcMultiLineSVG(cols, series){
  if(!cols.length || !series.length) return '<div class="empty" style="padding:22px">Add customers with quarterly revenue to chart growth. Each customer appears as its own line.</div>';
  const W=880,H=300,padL=58,padR=18,padT=18,padB=40;
  const plotW=W-padL-padR, plotH=H-padT-padB, n=cols.length;
  let max=0; series.forEach(s=>s.vals.forEach(v=>{ if(v!=null && v>max) max=v; })); max=Math.max(1,max);
  const X=i=> n<=1 ? padL+plotW/2 : padL+plotW*i/(n-1);
  const Y=v=> padT+plotH*(1-v/max);
  let grid='';
  for(let g=0;g<=4;g++){ const gv=max*g/4, gy=Y(gv);
    grid+=`<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${padL+plotW}" y2="${gy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`
        +`<text x="${padL-8}" y="${(gy+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${tcMoneyShort(gv)}</text>`;
  }
  const xlab=cols.map((c,i)=>`<text x="${X(i).toFixed(1)}" y="${H-14}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(c)}</text>`).join('');
  let lines='';
  series.forEach(s=>{
    const pts=[]; s.vals.forEach((v,i)=>{ if(v!=null) pts.push([X(i),Y(v),v,i]); });
    if(pts.length>1) lines+=`<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach(p=>{ lines+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.4" fill="${s.color}"><title>${esc(s.name)} — ${esc(cols[p[3]])}: ${tcMoney(p[2])}</title></circle>`; });
  });
  const svg=`<div class="tc-chart-wrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px;height:auto;max-height:320px" preserveAspectRatio="xMidYMid meet">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plotH}" stroke="var(--line)"/>${grid}${lines}${xlab}
  </svg></div>`;
  const legend=`<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px">`+series.map(s=>
    `<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px"><span style="width:12px;height:12px;border-radius:3px;background:${s.color};display:inline-block"></span>${esc(s.name)} <strong style="color:var(--ink)">${tcMoneyShort(s.total)}</strong></span>`).join('')+`</div>`;
  return svg+legend;
}

/* ---- horizontal bars, one per customer, stacked by quarter, ranked by NSE Total ---- */
function tcHBarSVG(cols, series){
  if(!series.length) return '<div class="empty" style="padding:22px">Add customers with quarterly revenue to chart growth.</div>';
  const maxTotal=Math.max(1,...series.map(s=>s.total));
  const qcolor=i=>TC_PALETTE[i%TC_PALETTE.length];
  const rows=series.map(s=>{
    const pct=Math.max(2, s.total/maxTotal*100);
    let segs='';
    cols.forEach((col,i)=>{ const v=s.vals[i]; if(v){ const w=v/s.total*100;
      segs+=`<div title="${esc(col)}: ${tcMoney(v)}" style="width:${w}%;background:${qcolor(i)}"></div>`; }});
    if(!segs) segs=`<div style="width:100%;background:var(--line)"></div>`;
    return `<div style="display:flex;align-items:center;gap:10px">
      <div style="width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:600" title="${esc(s.name)}">${esc(s.name)}</div>
      <div style="flex:1;background:var(--bg);border:1px solid var(--line);border-radius:6px;height:20px;overflow:hidden">
        <div style="height:100%;display:flex;width:${pct}%">${segs}</div>
      </div>
      <div style="width:92px;text-align:right;font-weight:800;font-size:13px;color:var(--ink)">${tcMoney(s.total)}</div>
    </div>`;
  }).join('');
  const legend=`<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px">`+cols.map((col,i)=>
    `<span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px"><span style="width:11px;height:11px;border-radius:3px;background:${qcolor(i)};display:inline-block"></span>${esc(col)}</span>`).join('')+`</div>`;
  return `<div style="display:flex;flex-direction:column;gap:9px">${rows}</div>${legend}`;
}

/* ---- the chart card (toggle + chosen chart) ---- */
function tcGrowthCard(){
  const {cols, series}=tcChartData();
  /* QoQ aggregate chip (unchanged) */
  const agg=tcQuarterSeries();
  const g=(function(){ if(agg.length<2) return {pct:null}; const last=agg[agg.length-1].rev||0, prev=agg[agg.length-2].rev||0; let pct=prev>0?Math.round((last-prev)/prev*100):(last>0?100:0); return {pct,last,prev}; })();
  const growthChip=g.pct==null?`<span class="tag">— add another quarter to compare —</span>`

  const toggle=`<div class="filterbar" style="margin:0">

    : '<div class="empty" style="padding:20px">Add customers with quarterly revenue to chart growth. Each customer appears as its own line.</div>';
  const sub = TC_CHART==='hbar'

    : 'Each customer is its own line across the quarter columns, so you can compare quarter-over-quarter growth customer by customer.';
  return `<div class="card">
    <div class="card-head" style="align-items:flex-start">
      <div><h3>📈 Growth — Quarter over Quarter</h3><div style="font-size:13px;margin-top:2px">${growthChip}</div></div>
      ${toggle}
    </div>
    <div class="card-sub">${sub}</div>
    ${chartBody}
  </div>`;
}

/* =====================================================================
   Re-implemented Top Customer page (fixes highlight + swaps in tcGrowthCard)
   ===================================================================== */
window.pageCustomerOpps = function(){
  const list0=tcList();
  const cols=tcAllQuarterCols();
  const search=((typeof COPP_SEARCH!=='undefined')?COPP_SEARCH:'').toLowerCase().trim();
  let sort=(typeof COPP_SORT!=='undefined')?COPP_SORT:'total';
  if(['total','top','name','cid'].indexOf(sort)<0) sort='total';
  let list=list0.slice();
  if(search) list=list.filter(c=>[c.name,c.meta.cid,c.meta.associatedIds,c.meta.nseName,c.meta.mode].join(' ').toLowerCase().includes(search));
  if(sort==='total') list.sort((a,b)=>tcTotal(b.meta)-tcTotal(a.meta));
  else if(sort==='top') list.sort((a,b)=>((b.meta.fav?1:0)-(a.meta.fav?1:0))||tcTotal(b.meta)-tcTotal(a.meta));
  else if(sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sort==='cid') list.sort((a,b)=>String(a.meta.cid||'').localeCompare(String(b.meta.cid||'')));

  /* KPIs */
  const grand=list0.reduce((s,c)=>s+tcTotal(c.meta),0);
  const tops=list0.filter(c=>c.meta.fav).length;
  const fromFunnel=list0.filter(c=>c.meta.fromFunnel).length;
  const kpis=`<div class="kpi-grid">
    ${kpi('Top Customers',list0.length,'b-blue')}
    ${kpi('NSE Total (All)',tcMoney(grand),'b-green')}
    ${kpi('⭐ Starred',tops,'b-amber','shown on dashboard')}
    ${kpi('From Prospect Funnel',fromFunnel,'b-navy','auto-added')}
  </div>`;

  const growthCard=tcGrowthCard();

  const sortSel=`<select style="max-width:190px" onchange="COPP_SORT=this.value;route()">
      <option value="total" ${sort==='total'?'selected':''}>Sort: NSE Total ↓</option>
      <option value="top" ${sort==='top'?'selected':''}>Sort: Top Customers First</option>
      <option value="name" ${sort==='name'?'selected':''}>Sort: Customer A→Z</option>
      <option value="cid" ${sort==='cid'?'selected':''}>Sort: CID</option>
    </select>`;

  /* spreadsheet */
  const qHeads=cols.map(c=>`<th style="text-align:right;white-space:nowrap">${esc(c)}</th>`).join('');
  const rows=list.map(c=>{ const m=c.meta; const nm=jsq(c.name);
    const qCells=cols.map(col=>{ const v=(m.quarters||{})[col]; return `<td style="text-align:right;white-space:nowrap;color:${v?'var(--ink)':'#c9d2dc'}">${v?tcMoney(v):''}</td>`; }).join('');
    return `<tr class="${m.fav?'tc-top':''}" style="cursor:pointer" onclick="openCustomerDetail('${nm}')">
      <td onclick="event.stopPropagation();toggleCustFav('${nm}')" title="${m.fav?'Remove Top Customer':'Mark as Top Customer'}" style="text-align:center;font-size:16px;color:${m.fav?'var(--accent)':'#c9d2dc'}">${m.fav?'★':'☆'}</td>
      <td style="white-space:nowrap"><strong>${esc(c.name)}</strong>${m.fromFunnel?' <span class="pill won" title="Converted from Prospect Funnel">🎉</span>':''}</td>
      <td style="white-space:nowrap;color:var(--muted)">${esc(m.cid||'')}</td>
      <td style="white-space:nowrap;color:var(--muted)">${esc(m.associatedIds||'')}</td>
      <td style="white-space:nowrap"><span class="pill type">${esc(m.mode||'OSOW')}</span></td>
      <td style="white-space:nowrap">${esc(m.nseName||'')}</td>
      <td style="white-space:nowrap;font-size:12px">${m.nseStart?fmtDate(m.nseStart):'—'}</td>
      <td style="white-space:nowrap;font-size:12px">${m.nseEnd?fmtDate(m.nseEnd):'—'}</td>
      <td style="white-space:nowrap;font-size:12px">${m.closeStart?fmtDate(m.closeStart):'—'}</td>
      <td style="white-space:nowrap;font-size:12px">${m.closeEnd?fmtDate(m.closeEnd):'—'}</td>
      ${qCells}
      <td style="text-align:right;white-space:nowrap"><strong>${tcMoney(tcTotal(m))}</strong></td>
    </tr>`;
  }).join('');
  const totalsRow=(function(){
    const qTot=cols.map(col=>{ const t=list.reduce((s,c)=>s+(Number((c.meta.quarters||{})[col])||0),0); return `<td style="text-align:right;font-weight:800">${t?tcMoney(t):''}</td>`; }).join('');
    const grandShown=list.reduce((s,c)=>s+tcTotal(c.meta),0);
    return `<tr style="background:var(--th-bg);font-weight:800"><td></td><td>Total</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>${qTot}<td style="text-align:right">${tcMoney(grandShown)}</td></tr>`;
  })();
  const body = list.length ? `<div class="card">
      <div class="card-head"><h3>Top Customers <span style="color:var(--muted);font-weight:500;font-size:13px">(${list.length})</span></h3>
        <span style="font-size:12px;color:var(--muted)">Click any row to open &amp; edit the full record · ★ highlights your Top Customers</span></div>
      <div class="table-wrap"><table style="min-width:${1080+cols.length*90}px">
        <thead><tr><th style="width:34px">★</th><th>Customer</th><th>CID</th><th>AssociatedCustomerIDs</th><th>Mode</th><th>NSEName</th><th>NSEStart</th><th>NSEEnd</th><th>CloseStartDate</th><th>CloseEndDate</th>${qHeads}<th style="text-align:right">NSE Total</th></tr></thead>
        <tbody>${rows}${totalsRow}</tbody>
      </table></div></div>`
    : `<div class="card"><div class="empty">No Top Customers yet. Click <strong>＋ Add Customer</strong> to enter one, or win a prospect in the Prospect Funnel and it lands here automatically.</div></div>`;

  return `
  <div class="page-title">🏢 Top Customer</div>
  <div class="page-sub">Your book of Top Customers — <strong>manually entered</strong> (no longer pulled from the quote log). Track CID, mode, NSE window, close dates, and quarterly NSE revenue. Prospects won in the <strong>Prospect Funnel</strong> are added here automatically. Star up to five for the dashboard.</div>
  ${growthCard}
  ${kpis}
  <div class="card" style="padding:14px 18px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap">
    <div style="flex:1;min-width:200px"><label style="margin-bottom:6px">Search</label><input placeholder="Customer, CID, NSE, mode…" value="${esc((typeof COPP_SEARCH!=='undefined')?COPP_SEARCH:'')}" oninput="COPP_SEARCH=this.value;coppSearchDebounce()"></div>
    <div><label style="margin-bottom:6px">Sort</label>${sortSel}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost" style="width:auto" onclick="tcAddQuarterCol()">＋ Quarter</button>
      <button class="btn btn-ghost" style="width:auto" onclick="tcManagerSummary()">📋 Manager Summary</button>
      <button class="btn btn-primary" style="width:auto" onclick="openAddTopCustomer()">＋ Add Customer</button>
    </div>
  </div>
  ${body}`;
};

/* expose helpers used by inline handlers / router */
window.tcChartData=tcChartData; window.tcMultiLineSVG=tcMultiLineSVG; window.tcHBarSVG=tcHBarSVG; window.tcGrowthCard=tcGrowthCard;

try{ if(typeof route==='function' && CURRENT_PAGE==='custopps') route(); }catch(e){}
</script>

</body>
</html>
